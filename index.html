<style>:root{--tx:#16181d;--tx2:#5b6270;--bg:#f6f7f9;--bg2:#ffffff;--bd:#dfe2e7;--bd2:#b9bec8;--ac:#2f6fed;--acbg:#e7efff;--ok:#16794a;--okbg:#e5f5ec;--bad:#c0362c;--badbg:#fdecea;--warnbg:#fff6e0;--warn:#8a5a00;--infobg:#eef3fb}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

#app{max-width:860px;margin:0 auto;padding:0 12px 40px}
nav.top{position:sticky;top:0;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
.topb{flex:1 0 auto;min-height:44px;padding:8px 14px;border-radius:22px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:15px;white-space:nowrap}
.topb.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
h1{font-size:21px;line-height:1.35;margin:16px 0 10px}
.sec{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
.sec .sec{border-color:var(--bd);margin:10px 0;padding:10px}
.sechead{font-size:17px;line-height:1.4;margin:0 0 6px;font-weight:700}
button.sechead{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:6px 0;min-height:44px;font-family:inherit}
.cap{color:var(--tx2);font-size:13px;margin-bottom:8px}
.txt{margin:6px 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;width:100%}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap;color:var(--tx2)}
td.r,th.r{text-align:right;white-space:nowrap}
td.t-danger{color:var(--bad);font-weight:600}td.t-success{color:var(--ok);font-weight:600}
.co{border-radius:10px;padding:10px 12px;margin:10px 0;border-left:4px solid var(--ac);background:var(--infobg)}
.co .lead{font-weight:700;margin-bottom:2px}
.co-warning{border-left-color:#e0a100;background:var(--warnbg)}
.co-success{border-left-color:var(--ok);background:var(--okbg)}
.co-danger{border-left-color:var(--bad);background:var(--badbg)}
.btn{min-height:44px;padding:9px 14px;border-radius:10px;font-size:15px;font-family:inherit;border:1px solid var(--bd2);background:var(--bg2);color:var(--tx);text-align:left;max-width:100%}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn:disabled{opacity:.45}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.segb{min-height:44px;padding:8px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:15px;font-family:inherit}
.segb.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:700}
.sel{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.sel span{font-size:13px;color:var(--tx2)}
.sel select{min-height:44px;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg2);color:var(--tx);width:100%}
.grid{display:grid;gap:8px;margin-top:8px}
.links{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.linkc{min-height:48px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--ac);font-size:15px;font-weight:600;font-family:inherit}

button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.lk{scroll-margin-top:64px}
.lkh{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;background:var(--bad);color:#fff;font-weight:700;font-size:15px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:600;margin:2px 0 4px}
.badge.tent{background:var(--warnbg);color:#a66f00}
.badge.sm{margin-left:auto;flex:0 0 auto}
.lbl{font-weight:700;margin:12px 0 4px;color:var(--tx)}
.ul{margin:4px 0;padding-left:20px}.ul li{margin:4px 0}
.hx{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;background:var(--bg)}
.hxh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.hxt{font-size:12px;color:var(--tx2);width:100%}
.hxb{color:var(--bad);margin-top:6px}.hxg{color:var(--ok);margin-top:4px;font-weight:600}
.cc{display:inline-flex;gap:4px}.cd{display:inline-block;min-width:34px;text-align:center;padding:2px 5px;border-radius:6px;border:1px solid var(--bd2);background:var(--bg2);font-weight:700;font-size:17px;color:var(--tx)}.cd.red{color:var(--bad)}
.rule{border-left:4px solid var(--ok);background:var(--okbg);border-radius:8px;padding:10px 12px;font-weight:700;font-size:16px}
.pbtn{display:flex;flex-wrap:wrap;gap:8px}
.stat{font-size:13px;color:var(--tx2);margin-top:12px;border-top:1px dashed var(--bd);padding-top:8px}
.toc{display:flex;flex-direction:column;gap:6px}
.tocb{display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:15px;font-family:inherit}

V -0.05BB\">Q3o</div><div class=\"b4c c0\" title=\"J3o：模型 EV -0.10BB\">J3o</div><div class=\"b4c c0\" title=\"T3o：模型 EV -0.14BB\">T3o</div><div class=\"b4c c0\" title=\"93o：模型 EV -0.16BB\">93o</div><div class=\"b4c c0\" title=\"83o：模型 EV -0.19BB\">83o</div><div class=\"b4c c0\" title=\"73o：模型 EV -0.19BB\">73o</div><div class=\"b4c c0\" title=\"63o：模型 EV -0.18BB\">63o</div><div class=\"b4c c0\" title=\"53o：模型 EV -0.07BB\">53o</div><div class=\"b4c c0\" title=\"43o：模型 EV -0.08BB\">43o</div><div class=\"b4c c3\" title=\"33：模型 EV +0.32BB\">33</div><div class=\"b4c c0\" title=\"32s：模型 EV +0.05BB\">32s</div><div class=\"b4c c2\" title=\"A2o：模型 EV +0.16BB\">A2o</div><div class=\"b4c c0\" title=\"K2o：模型 EV +0.01BB\">K2o</div><div class=\"b4c c0\" title=\"Q2o：模型 EV -0.07BB\">Q2o</div><div class=\"b4c c0\" title=\"J2o：模型 EV -0.12BB\">J2o</div><div class=\"b4c c0\" title=\"T2o：模型 EV -0.15BB\">T2o</div><div class=\"b4c c0\" title=\"92o：模型 EV -0.18BB\">92o</div><div class=\"b4c c0\" title=\"82o：模型 EV -0.20BB\">82o</div><div class=\"b4c c0\" title=\"72o：模型 EV -0.22BB\">72o</div><div class=\"b4c c0\" title=\"62o：模型 EV -0.22BB\">62o</div><div class=\"b4c c0\" title=\"52o：模型 EV -0.20BB\">52o</div><div class=\"b4c c0\" title=\"42o：模型 EV -0.12BB\">42o</div><div class=\"b4c c0\" title=\"32o：模型 EV -0.14BB\">32o</div><div class=\"b4c c3\" title=\"22：模型 EV +0.25BB\">22</div></div>\n<div class=\"cap\">右上三角＝同花（s），左下三角＝不同花（o），對角線＝對子。只適用「前面所有人都棄牌、輪到你在 BTN」的情況；前面有人跛入或加注就不是這張圖。</div>\n<div class=\"txt\"><b>用文字講：</b>對子全開；A 開頭全開（同花、不同花都開）；同花的 K、Q、J 全開；同花 T5s 以上、95s、85s、74s 以上、64s、53s 以上；不同花 K8o 以上、QTo 以上、JTo、J9o、T9o、T8o。</div>\n<div class=\"txt\"><b>黃色加開：</b>T4s–T2s、94s、93s、84s、63s、43s、42s，以及 Q9o、Q8o、K7o–K5o、98o、97o、87o。</div>\n</div>\n\n<div class=\"sec\"><div class=\"sechead\">為什麼可以開這麼寬？三句白話</div>\n<ol class=\"ul\">\n<li><b>不是靠「盲注都會棄」賺錢。</b>400 萬手裡，你在 BTN 加注 2.1–2.5BB 後，兩個盲注都棄牌只有 <b>41%</b>（NL2，63,386 次）。純偷盲要 62.5% 的人棄牌才不虧，所以光偷是不夠的。（你自己那 127 次的 57% 是小樣本，偏高。）</li>\n<li><b>真正賺錢的是「被跟注之後你有位置」。</b>大盲跟注後，BTN 平均還是賺 <b>+0.62BB</b>（15,859 次）；盲注過牌給你時，玩家池在 BTN 持續下注 60%，大盲面對持續下注棄牌 <b>47%</b>（22,492 次）。所以邊緣牌只要能在翻牌後撿到這些棄牌，就值得開。</li>\n<li><b>開得寬的人在 BTN 賺得比較多。</b>把有 100 次以上 BTN 機會的 1,361 位 NL2 玩家照開牌率分組：開 25–35% 的人每 100 次機會賺 20BB；開 35–45% 賺 29BB；開 45–55% 賺 <b>38BB</b>；開超過 55% 反而降到 24BB。贏家（前 25%）中位數開 38%，輸家開 35%。</li>\n</ol></div>\n\n<div class=\"sec\"><div class=\"sechead\">開多大？2.5BB</div>\n<div class=\"tw\"><table>\n<tr><th>加注尺寸（NL2 6人）</th><th class=\"r\">開牌次數</th><th class=\"r\">兩盲都棄</th><th class=\"r\">大盲跟注</th><th class=\"r\">被3bet</th><th class=\"r\">每次開牌平均賺</th></tr>\n<tr><td>2BB（最小加注）</td><td class=\"r\">43,501</td><td class=\"r\">34%</td><td class=\"r\">29%</td><td class=\"r\">18%</td><td class=\"r\">+0.45BB</td></tr>\n<tr><td><b>2.1–2.5BB</b></td><td class=\"r\">63,386</td><td class=\"r\">41%</td><td class=\"r\">25%</td><td class=\"r\">16%</td><td class=\"r\"><b>+0.62BB</b></td></tr>\n<tr><td>2.6–3BB</td><td class=\"r\">52,035</td><td class=\"r\">46%</td><td class=\"r\">23%</td><td class=\"r\">15%</td><td class=\"r\">+0.62BB</td></tr>\n</table></div>\n<div class=\"txt\">2.5BB 和 3BB 賺得差不多（誤差約 ±0.05–0.06BB），但 2.5BB 被 3bet 時輸得少，所以用 2.5BB。<b>不要用 2BB 最小加注</b>：大盲會多防守 8 個百分點，每次少賺約 0.17BB。NL5 結果一樣（2BB +0.38、2.6–3BB +0.60BB）。</div>\n</div>\n\n<div class=\"sec\"><div class=\"sechead\">看盲注是哪種人再調整</div>\n<div class=\"txt\">用 GG 的 HUD 看大盲的「Fold to Steal（被偷盲時棄牌率）」和「3Bet」，至少要 30 次以上才準。</div>\n<div class=\"tw\"><table>\n<tr><th>大盲類型</th><th class=\"r\">人數</th><th class=\"r\">棄牌</th><th class=\"r\">跟注</th><th class=\"r\">3bet</th><th>你怎麼做</th></tr>\n<tr><td>很緊（棄 ≥65%）</td><td class=\"r\">214</td><td class=\"r\">70%</td><td class=\"r\">22%</td><td class=\"r\">8%</td><td>開到黃色（約 55%），用 2–2.5BB 小一點偷</td></tr>\n<tr><td>一般</td><td class=\"r\">146</td><td class=\"r\">59%</td><td class=\"r\">32%</td><td class=\"r\">9%</td><td>照圖：深綠＋綠（約 45%）</td></tr>\n<tr><td>很愛跟（棄 ≤45%）</td><td class=\"r\">21</td><td class=\"r\">40%</td><td class=\"r\">52%</td><td class=\"r\">8%</td><td>只開深綠（約 30%），拿好牌開 3BB 讓他付錢</td></tr>\n<tr><td>很愛 3bet（≥14%）</td><td class=\"r\">65</td><td class=\"r\">59%</td><td class=\"r\">24%</td><td class=\"r\">17%</td><td>深綠為主（約 30–35%），拿掉 A5o–A2o、K9o、J9o、T9o、小同花間隔牌；被 3bet 時綠色牌直接棄</td></tr>\n</table></div>\n<div class=\"cap\">NL2，2–3BB 開牌、小盲已棄的情況。類型用一半手牌判定、另一半手牌驗證（避免自己騙自己），所以這些比例是真的會重複出現的習慣。小盲很愛 3bet 時也照「很愛 3bet」那一列收緊。</div>\n<div class=\"txt\"><b>被 3bet 怎麼辦：</b>玩家池在 BTN 被 3bet 時大約棄牌 50–57%，3bet 尺寸多半是你開牌的 3–4 倍。綠色、黃色的牌被 3bet 一律棄掉；深綠裡的大牌和中對子再去跟或 4bet。</div>\n</div>\n\n<div class=\"sec\"><div class=\"sechead\">5 人桌</div>\n<div class=\"txt\">NL2 5 人桌（391,905 次機會）兩盲都棄 42%，每次開牌平均賺 +0.73BB，比 6 人桌好一點，可以再多開一點點（把黃色裡的同花牌加進來）。</div></div>\n\n<div class=\"sec\"><div class=\"sechead\">數據怎麼算的（和限制）</div>\n<ul class=\"ul\">\n<li>資料：HHDealer GG NL2/NL5 6-max，約 401 萬手（2024/10–2025/05）。輪到 BTN 開牌的機會共 1,536,341 次，其中加注 543,978 次。</li>\n<li><b>這份資料沒有任何人的底牌是一定看得到的</b>（每手都是匿名、只有攤牌才看得到），所以「每一種牌直接算實際輸贏」做不到，因為只看攤牌會高估好牌、低估被棄掉的牌。</li>\n<li>所以用三種方法互相對照：① 盲注對 BTN 開牌怎麼反應（全部手牌都看得到，沒有偏差）；② 模型：每種起手牌對盲注實際防守範圍（從攤牌估計）的勝率 × 位置實現率，再用玩家池實際賺賠校準；③ 不同開牌率玩家的實際 BTN 收益。三種都指向 40–50%。</li>\n<li>模型對「實現率」很敏感：假設你翻牌後打得比玩家池平均差，範圍就該縮小（本圖已經用偏保守的假設）；打得好可以再寬。第③點的玩家比較可能混有「開得寬的人本來就比較會打」的效果。</li>\n<li>研究整理，不保證獲利。</li>\n</ul></div>\n</div>\n";
