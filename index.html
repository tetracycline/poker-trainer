盲跟注後，BTN 平均還是賺 <b>+0.62BB</b>（15,859 次）；盲注過牌給你時，玩家池在 BTN 持續下注 60%，大盲面對持續下注棄牌 <b>47%</b>（22,492 次）。所以邊緣牌只要能在翻牌後撿到這些棄牌，就值得開。</li>\n<li><b>開得寬的人在 BTN 賺得比較多。</b>把有 100 次以上 BTN 機會的 1,361 位 NL2 玩家照開牌率分組：開 25–35% 的人每 100 次機會賺 20BB；開 35–45% 賺 29BB；開 45–55% 賺 <b>38BB</b>；開超過 55% 反而降到 24BB。贏家（前 25%）中位數開 38%，輸家開 35%。</li>\n</ol></div>\n\n<div class=\"sec\"><div class=\"sechead\">開多大？2.5BB</div>\n<div class=\"tw\"><table>\n<tr><th>加注尺寸（NL2 6人）</th><th class=\"r\">開牌次數</th><th class=\"r\">兩盲都棄</th><th class=\"r\">大盲跟注</th><th class=\"r\">被3bet</th><th class=\"r\">每次開牌平均賺</th></tr>\n<tr><td>2BB（最小加注）</td><td class=\"r\">43,501</td><td class=\"r\">34%</td><td class=\"r\">29%</td><td class=\"r\">18%</td><td class=\"r\">+0.45BB</td></tr>\n<tr><td><b>2.1–2.5BB</b></td><td class=\"r\">63,386</td><td class=\"r\">41%</td><td class=\"r\">25%</td><td class=\"r\">16%</td><td class=\"r\"><b>+0.62BB</b></td></tr>\n<tr><td>2.6–3BB</td><td class=\"r\">52,035</td><td class=\"r\">46%</td><td class=\"r\">23%</td><td class=\"r\">15%</td><td class=\"r\">+0.62BB</td></tr>\n</table></div>\n<div class=\"txt\">2.5BB 和 3BB 賺得差不多（誤差約 ±0.05–0.06BB），但 2.5BB 被 3bet 時輸得少，所以用 2.5BB。<b>不要用 2BB 最小加注</b>：大盲會多防守 8 個百分點，每次少賺約 0.17BB。NL5 結果一樣（2BB +0.38、2.6–3BB +0.60BB）。</div>\n</div>\n\n<div class=\"sec\"><div class=\"sechead\">看盲注是哪種人再調整</div>\n<div class=\"txt\">用 GG 的 HUD 看大盲的「Fold to Steal（被偷盲時棄牌率）」和「3Bet」，至少要 30 次以上才準。</div>\n<div class=\"tw\"><table>\n<tr><th>大盲類型</th><th class=\"r\">人數</th><th class=\"r\">棄牌</th><th class=\"r\">跟注</th><th class=\"r\">3bet</th><th>你怎麼做</th></tr>\n<tr><td>很緊（棄 ≥65%）</td><td class=\"r\">214</td><td class=\"r\">70%</td><td class=\"r\">22%</td><td class=\"r\">8%</td><td>開到黃色（約 55%），用 2–2.5BB 小一點偷</td></tr>\n<tr><td>一般</td><td class=\"r\">146</td><td class=\"r\">59%</td><td class=\"r\">32%</td><td class=\"r\">9%</td><td>照圖：深綠＋綠（約 45%）</td></tr>\n<tr><td>很愛跟（棄 ≤45%）</td><td class=\"r\">21</td><td class=\"r\">40%</td><td class=\"r\">52%</td><td class=\"r\">8%</td><td>只開深綠（約 30%），拿好牌開 3BB 讓他付錢</td></tr>\n<tr><td>很愛 3bet（≥14%）</td><td class=\"r\">65</td><td class=\"r\">59%</td><td class=\"r\">24%</td><td class=\"r\">17%</td><td>深綠為主（約 30–35%），拿掉 A5o–A2o、K9o、J9o、T9o、小同花間隔牌；被 3bet 時綠色牌直接棄</td></tr>\n</table></div>\n<div class=\"cap\">NL2，2–3BB 開牌、小盲已棄的情況。類型用一半手牌判定、另一半手牌驗證（避免自己騙自己），所以這些比例是真的會重複出現的習慣。小盲很愛 3bet 時也照「很愛 3bet」那一列收緊。</div>\n<div class=\"txt\"><b>被 3bet 怎麼辦：</b>玩家池在 BTN 被 3bet 時大約棄牌 50–57%，3bet 尺寸多半是你開牌的 3–4 倍。綠色、黃色的牌被 3bet 一律棄掉；深綠裡的大牌和中對子再去跟或 4bet。</div>\n</div>\n\n<div class=\"sec\"><div class=\"sechead\">5 人桌</div>\n<div class=\"txt\">NL2 5 人桌（391,905 次機會）兩盲都棄 42%，每次開牌平均賺 +0.73BB，比 6 人桌好一點，可以再多開一點點（把黃色裡的同花牌加進來）。</div></div>\n\n<div class=\"sec\"><div class=\"sechead\">數據怎麼算的（和限制）</div>\n<ul class=\"ul\">\n<li>資料：HHDealer GG NL2/NL5 6-max，約 401 萬手（2024/10–2025/05）。輪到 BTN 開牌的機會共 1,536,341 次，其中加注 543,978 次。</li>\n<li><b>這份資料沒有任何人的底牌是一定看得到的</b>（每手都是匿名、只有攤牌才看得到），所以「每一種牌直接算實際輸贏」做不到，因為只看攤牌會高估好牌、低估被棄掉的牌。</li>\n<li>所以用三種方法互相對照：① 盲注對 BTN 開牌怎麼反應（全部手牌都看得到，沒有偏差）；② 模型：每種起手牌對盲注實際防守範圍（從攤牌估計）的勝率 × 位置實現率，再用玩家池實際賺賠校準；③ 不同開牌率玩家的實際 BTN 收益。三種都指向 40–50%。</li>\n<li>模型對「實現率」很敏感：假設你翻牌後打得比玩家池平均差，範圍就該縮小（本圖已經用偏保守的假設）；打得好可以再寬。第③點的玩家比較可能混有「開得寬的人本來就比較會打」的效果。</li>\n<li>研究整理，不保證獲利。</li>\n</ul></div>\n</div>\n";
