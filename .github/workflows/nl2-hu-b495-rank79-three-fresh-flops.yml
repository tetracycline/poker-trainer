name: B495 rank79 three new rainbow flops with genuine GTO and CO-IP pool locks
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b495-rank79-three-fresh-flops.yml'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        flop: [QcJh5s, QdJc3s, KhQs8d]
        version: [gto, exp_ip]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve rank79 from the full UTG/CO flop and native checked turn on three frozen runouts
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot UTG_CO \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy oop-b50only \
            --turn-line-policy checkcheck --lock-marginals-by-street --archive-empty-river-extraction --turn-count 3 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= len(m["turns"])
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert m["cases"] or len(m["skipped"]) == len(m["turns"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NL2-B495-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/UTG_CO/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 90

  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify the completed archive identities and both native seat policies across all runouts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/b495-originals"
          mkdir -p "$dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$dir/list.json"
          for id in $(python3 -c 'import json,sys;print(*(r["id"] for r in json.load(open(sys.argv[1]))["artifacts"] if r["name"].startswith("NL2-B495-")))' "$dir/list.json"); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/$id.zip"
          done
          python3 tools/hu_b495_rank79_flops.py --solver pinned-solver --artifacts "$dir" --run-id "$GITHUB_RUN_ID" --head "$GITHUB_SHA"
          node tools/hu_b489_model_route.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: B495-verified-rank79-board-pairs
          path: |
            data/nl2_hu_b495_rank79_flops.json
            data/nl2_hu_b495_locked_medium.json
            data/solver_evidence/NL2_B495_R79_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_B495_R79_*.json.gz
            data/solver_evidence/reverified/rank79.json
          if-no-files-found: error
          retention-days: 90
      - name: Integrate surviving native pairs, verify both viewers and run the full exact audit
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          shopt -s nullglob
          files=(data/nl2_hu_b495_rank79_flops.json data/solver_evidence/NL2_B495_R79_*.json.gz data/solver_evidence/NL2_MULTIBOARD_B495_R79_*.json.gz)
          if test -f data/solver_evidence/reverified/rank79.json; then files+=(data/solver_evidence/reverified/rank79.json data/nl2_hu_b495_locked_medium.json); fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add --quiet --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              status=data/nl2_hu_multiboard_status_current.json
              python3 tools/hu_apply_cert_extensions.py --out "$status"
              python3 - <<'PYVERIFY'
          import json
          d=json.load(open('data/nl2_hu_b495_rank79_flops.json'))['model']
          m=json.load(open('data/nl2_hu_multiboard_status_current.json'))['records'][d['model_id']]
          assert (m['label']=='CERT-MULTIBOARD')==(len(d['boards'])>=3)
          if len(d['boards'])>=3:
              assert {b['source_sha256'] for b in d['boards']}=={b['source_sha256'] for b in m['certified_3_to_5_exact_flop_boards']}
          PYVERIFY
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              git add "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B495: publish the reverified rank79 turn outcomes and cumulative exact-board registry'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
