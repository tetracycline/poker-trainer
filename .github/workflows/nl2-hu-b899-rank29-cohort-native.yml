name: B899 rank29 frozen cohort new native candidates
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b899_rank29_cohort_native.py'
      - '.github/workflows/nl2-hu-b899-rank29-cohort-native.yml'
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [Ac3c2h, Ac3h2c]
    env:
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=3072
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate frozen cohort and exhaust historical dispatch leads before original
        env:
          GH_TOKEN: ${{ github.token }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b899_rank29_cohort_native.py --preflight --flop "$FLOP" --receipt "$RUNNER_TEMP/b899-preflight.json" --solver pinned-solver --output "$RUNNER_TEMP/b899-source"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned driver
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve unique root and matched partial lock then replay without driver
        env:
          GH_TOKEN: ${{ github.token }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          python tools/hu_b899_rank29_cohort_native.py --flop "$FLOP" --receipt "$RUNNER_TEMP/b899-preflight.json" --solver pinned-solver --output "$RUNNER_TEMP/b899-source" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$RUNNER_TEMP/b899-source/proof.json" "$RUNNER_TEMP/b899-proof.json"
          python tools/hu_b899_rank29_cohort_native.py --flop "$FLOP" --receipt "$RUNNER_TEMP/b899-preflight.json" --solver pinned-solver --output "$RUNNER_TEMP/b899-source"
          cmp "$RUNNER_TEMP/b899-proof.json" "$RUNNER_TEMP/b899-source/proof.json"
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B899-R29-${{ matrix.flop }}
          path: |
            ${{ runner.temp }}/b899-source
            ${{ runner.temp }}/b899-preflight.json
          if-no-files-found: warn
          retention-days: 90
