name: B919 repair B918 inventory schema and prove disjoint run scopes
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['tools/hu_b918_run_scope.py', '.github/workflows/nl2-hu-b918-run-scope.yml']
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  archive-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions: {contents: write, actions: read, pull-requests: read}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify B917 artifact and immutable workflow scopes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          PYTHONPATH=tools python -c 'from hu_b918_run_scope import index_runs,read,INV; assert len(index_runs(read(INV))) == 61'
          python tools/hu_b918_run_scope.py prepare "$RUNNER_TEMP/b918"
      - name: Full static model route and exact board audit
        run: |
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
      - name: Create detached archive candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/hu_b918_run_scope.py publish "$RUNNER_TEMP/b918"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B919-audited-legacy-and-run-scope
          path: ${{ runner.temp }}/b918
          retention-days: 90
