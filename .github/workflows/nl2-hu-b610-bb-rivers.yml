name: B610 authenticate exact BB river policies and all CERT boards
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b610-bb-rivers.yml'
      - 'tools/hu_b588_bb_river*'
      - 'tools/hu_b610_bb_pot_turn_routes.cjs'
      - 'data/nl2_hu_b610_bb_river*'
      - 'data/solver_evidence/NL2_B610_R*.zip'
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        flop: ['As6c3s', 'Ah8s5h', 'Ac9s6c']
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned native engine
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          git clone -q https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Independently reproduce the original flop and both river policies
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          from zipfile import ZipFile
          flop = os.environ['FLOP']
          driver = Path('../solver/postflop/pfdriver/target/release/pfdriver').resolve()
          specs = json.loads(Path('data/nl2_hu_b610_bb_river_inputs.json').read_bytes())['73']
          spec, = (s for s in specs if s['flop'] == flop)
          archive = Path(f'data/solver_evidence/NL2_B610_R73_{flop.upper()}.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == spec['archive_sha256']
          with ZipFile(archive) as source, tempfile.TemporaryDirectory() as temp:
              for version, threads in [('root',2), ('gto',1), ('native',1)]:
                  job = version + '.job.json'
                  output = version + '.json'
                  raw = source.read(job)
                  assert json.loads(raw)['out'] == output
                  (Path(temp)/job).write_bytes(raw)
                  subprocess.run([driver,job], cwd=temp, env=dict(os.environ,RAYON_NUM_THREADS=str(threads)), check=True)
                  original = json.loads(source.read(output))
                  fresh = json.loads((Path(temp)/output).read_bytes())
                  for result in (original,fresh):
                      del result['info']['secs']
                  assert fresh == original, (flop, version)
          PYTHON
  verify-audit:
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Rebuild both native job specifications and replay both private-hand policies
        working-directory: trainer
        run: |
          set -euo pipefail
          python tools/hu_b588_bb_rivers.py --batch 610 --solver ../solver --out "$RUNNER_TEMP/preview.json"
          cmp "$RUNNER_TEMP/preview.json" data/nl2_hu_b610_bb_river_preview.json
      - name: Verify the published viewer policies, node locks, medium sizes and all registry routes
        working-directory: trainer
        run: |
          set -euo pipefail
          python tools/hu_b588_bb_rivers.py --batch 610 --solver ../solver --run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/publication.json"
          for rank in $(python -c "import json; print(*json.load(open('data/nl2_hu_b610_bb_river_inputs.json')))"); do
            node tools/hu_b558_river_policy_view.cjs "data/solver_evidence/reverified/rank$rank.json"
          done
          registry=data/nl2_hu_multiboard_status_current.json
          cp "$registry" "$RUNNER_TEMP/before.json"
          python tools/hu_apply_cert_extensions.py --out "$registry"
          python - "$RUNNER_TEMP/before.json" "$registry" <<'PYTHON'
          import json, sys
          before, after = [json.load(open(p))["records"] for p in sys.argv[1:]]
          ranks = set(map(int, json.load(open('data/nl2_hu_b610_bb_river_inputs.json'))))
          for mid, record in before.items():
              if record['frequency_rank'] in ranks:
                  assert after[mid]['label'] == 'CERT-MULTIBOARD'
              elif record['label'] == 'CERT-MULTIBOARD':
                  assert after[mid] == record
          PYTHON
          node tools/hu_extension_runtime_test.cjs "$registry"
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/coverage.json"
          bash tools/hu_exact_batch_audit.sh "$registry"
      - uses: actions/upload-artifact@v4
        with:
          name: B610-authenticated-BB-river-policies
          path: |
            trainer/data/nl2_hu_b610_locked_medium.json
            trainer/data/solver_evidence/NL2_MULTIBOARD_B610_R*.json.gz
            trainer/data/solver_evidence/reverified/rank73.json
          if-no-files-found: error
          retention-days: 90
