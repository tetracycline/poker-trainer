name: NL2 B373 exact SHA-independent recovery of B372 true Rust NL2 partial turn, HU2475 audit
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b373-authenticated-partial-source.yml'
      - 'tools/hu_b373_validate_partial_nl2_source.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify completed B372 genuine original Rust source, no re-solve and no false measured-node claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b373-original
          gh run download 45016548530 --repo "$GITHUB_REPOSITORY" --name 'NL2-B372-rank27-9s6h3d-GTO-root-true-NL2-OOP-turn' --dir /tmp/b373-original
          python3 -m py_compile tools/hu_b373_validate_partial_nl2_source.py
          python3 tools/hu_b373_validate_partial_nl2_source.py /tmp/b373-original
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b373-cert-gate.json
      - name: Full HU2475 link, reach, model-path and frontend source integrity
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b373-contract.json
          node tools/link_audit.js --md /tmp/b373-link.md --json /tmp/b373-link.json
          node tools/reach_verify.js --log /tmp/b373-reach.md --json /tmp/b373-reach.json
          node tools/hu_model_path_audit.js /tmp/b373-model-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b373-cert-gate.json'))
          q=json.load(open('data/nl2_hu_b373_rank27_b372_true_partial_nl2_oop_original_source_proof.json'))
          c=json.load(open('/tmp/b373-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['actual_NL2_measured_pooled_marginal_patterns_history_imputed']==15 and q['assumed_history_fallback_patterns']==4
          assert not q['not_CERT_multiboard'] is False
          print('PASS B373 authentic source, 2475/2475, 159 CERT / 233 APPROX, no fake upgrades')
          PY
          git diff --check
      - name: Commit and push independent proof, never merge PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b373_rank27_b372_true_partial_nl2_oop_original_source_proof.json docs/NL2_HU_B373_RANK27_TRUE_NL2_PARTIAL_SOURCE_AUDIT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B373: verify authentic original GTO and true NL2 partially locked turn; source marginals properly distinguished; 159/233'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
