name: TASK-HYBRID B285 rank46 B279 exact original GTO 0 CO-IP actor, B280 cancelled failclosed, 590 locks HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b285-rank46-b279-zero-b280-cancelled-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  rank46-true-source-original-B279-zero-B280-cancelled:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require actual original Rust job success B279 and cancellation B280 with skipped independent audit; no partial source counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44937413659" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44937484979" --jq .conclusion)" = cancelled
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44937484979/jobs" --jq '.jobs[] | select(.name=="original-gto-solve") | .conclusion')" = cancelled
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44937484979/jobs" --jq '.jobs[] | select(.name=="independent-audit-and-source-commit") | .conclusion')" = skipped
          python3 -m py_compile tools/hu_b285_v41_rank46_b279_zero_b280_cancelled_failclosed.py
          python3 tools/hu_b285_v41_rank46_b279_zero_b280_cancelled_failclosed.py
      - name: Independent B279 raw/gzip SHA GTO original source with 0 actor legal combos, verify no B280 source artifacts and V41 source/lock scope
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('data')
          p=d/'nl2_hu_b285_v41_rank46_b279_zero_b280_cancelled_failclosed.json'
          x=json.loads(p.read_text())
          assert x['schema']=='NL2_HU_B285_R46_B279_ZERO_GTO_B280_CANCELLED_STRICT_FAILCLOSED_V1'
          assert (x['V41_CERT_MULTIBOARD'],x['V41_APPROX'],x['V41_EST'],x['TOTAL'])==(154,238,0,392)
          assert x['V41_status_sha256']==hashlib.sha256((d/'nl2_hu_multiboard_status_v41_b271_rank61.json').read_bytes()).hexdigest()
          assert x['B279']['original_GTO_run']==44937413659 and x['B279']['full_GTO_original_solved_cases']==1
          assert (x['B279']['legal_actor_turn_nodes'],x['B279']['legal_actor_strict_combos'])==(0,0)
          assert x['B279']['cannot_count_as_third_certified_board']
          assert (x['B280']['original_GTO_run'],x['B280']['original_Rust_job_conclusion'])==(44937484979,'cancelled')
          assert x['B280']['independent_source_verify_job']=='skipped'
          assert x['B280']['no_complete_source_pin_or_gzip_or_index']
          assert x['B280']['cannot_count_as_third_certified_board']
          assert x['still_only_two_true_GTO_plus_CO_IP_NL2_rank46_flops']==['8s8h3d','9s6h3d']
          assert x['exact_flop_turn_only_not_other_turn_rejection'] and x['no_partial_solve_certification']
          assert (x['existing_genuine_named_boards'],x['existing_actor_NL2_hero_locks'],
              x['b50_exact_board_research_candidates_only'])==(590,682,134)
          assert x['no_nl2_private_card_data_fabricated'] and x['PR2_Draft_NEVER_MERGE']
          print('PASS B279 exact 0 actor original Rust GTO, B280 cancelled not counted')
          PY
      - name: Full unchanged 154 V41 CERT 590 original real GTO+NL2 matched locked named boards, 134 medium50 research and all 2475 HU paths
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v41_b271_rank61.json --out nl2-audit/b285-lock-medium.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b285-lock-medium.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(154,238,0)
          assert (a['aggregate']['named_board_proofs'],
            a['aggregate']['paired_hero_locked_source_variants'],
            a['aggregate']['board_examples_with_b50_candidate'])==(590,682,134)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B285 2475/2475")'
      - name: Commit B279 zero actor / B280 cancelled metadata only after source and HU2475 PASS, normal non-force push PR2 Draft NEVER MERGE
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b285_v41_rank46_b279_zero_b280_cancelled_failclosed.json docs/NL2_HU_B285_R46_B279_ZERO_B280_CANCELLED_SOURCE_FAILCLOSED.md
          git commit -m 'TASK-HYBRID B285 V41: B279 original GTO zero legal COIP, B280 cancelled failclosed, all 590 GTO/NL2 source locks and HU2475 PASS; CERT 154 APPROX 238'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NL2-HU-B285-V41-R46-B279-0-actor-B280-cancelled-HU2475
          path: |
            data/nl2_hu_b285_v41_rank46_b279_zero_b280_cancelled_failclosed.json
            docs/NL2_HU_B285_R46_B279_ZERO_B280_CANCELLED_SOURCE_FAILCLOSED.md
            nl2-audit/
          retention-days: 30
