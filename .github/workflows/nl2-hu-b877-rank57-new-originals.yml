name: B877 rank57 two new low-paired 100bb GTO and NL2 actor-locked original sources
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b877_rank57_new_originals.py'
      - '.github/workflows/nl2-hu-b877-rank57-new-originals.yml'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [Kh5s5d, Ts6h6d]
    env:
      FLOP: ${{ matrix.flop }}
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Preflight new native flop sources and exact SB action line
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b877_rank57_new_originals.py --preflight --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/preflight"
      - name: Build native driver pinned to solved input
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve authentic GTO and partial measured NL2 opponent lock
        run: |
          set -euo pipefail
          python tools/hu_b877_rank57_new_originals.py --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/b877-source" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$RUNNER_TEMP/b877-source/proof.json" "$RUNNER_TEMP/original-proof.json"
          python tools/hu_b877_rank57_new_originals.py --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/b877-source"
          cmp "$RUNNER_TEMP/original-proof.json" "$RUNNER_TEMP/b877-source/proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B877-R57-${{ matrix.flop }}
          path: ${{ runner.temp }}/b877-source/
          if-no-files-found: warn
          retention-days: 90
