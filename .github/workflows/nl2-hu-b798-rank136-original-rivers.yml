name: B798 extract previously unseen weak-draw rivers from four fixed rank136 turn games
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b798-rank136-original-rivers.yml'
      - 'tools/hu_b798_rank136_new_rivers.py'
permissions: {contents: read, actions: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {flop: Ac8h5d, turn: Js, original: 14900322317, sha: 82dae00ffed0eb673730383819d91d28b5e16a8156d9a976c0b3c0ba58fdb21b}
          - {flop: Ac8h5d, turn: 2h, original: 14900322317, sha: 82dae00ffed0eb673730383819d91d28b5e16a8156d9a976c0b3c0ba58fdb21b}
          - {flop: Ah8d4s, turn: Qc, original: 14900951010, sha: 63778af66077e76bbd6f9d90a98d49becf116c3d6a663363071d498f68f95d28}
          - {flop: Ah8d4s, turn: Jc, original: 14900951010, sha: 63778af66077e76bbd6f9d90a98d49becf116c3d6a663363071d498f68f95d28}
    env:
      TURN: ${{ matrix.turn }}
      EXPECTED: ${{ matrix.sha }}
      FLOP: ${{ matrix.flop }}
      ORIGINAL: ${{ matrix.original }}
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate the original B792 game and verify every unextracted eligible river
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install numpy phevaluator==0.5.3.1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45351501007" | jq -e '
            .head_sha=="693a5d7cf92ba22c5f4e8da4f6ee29312c5779d3" and .conclusion=="success" and .status=="completed"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL" | jq -e --arg n "B792-R136-$FLOP" --arg sha "$EXPECTED" '
            .name==$n and .digest==("sha256:"+$sha) and .expired==false and .workflow_run.id==45351501007 and
            .workflow_run.head_sha=="693a5d7cf92ba22c5f4e8da4f6ee29312c5779d3"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL/zip" > "$RUNNER_TEMP/b792.zip"
          echo "$EXPECTED  $RUNNER_TEMP/b792.zip" | sha256sum -c -
          python tools/hu_b798_rank136_new_rivers.py --preflight --flop "$FLOP" --turn "$TURN" --solver pinned-solver \
            --archive "$RUNNER_TEMP/b792.zip" --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Keep both original strategy trees and add only unseen river extracts
        run: |
          set -euo pipefail
          args=(--solver pinned-solver --flop "$FLOP" --turn "$TURN" --archive "$RUNNER_TEMP/b792.zip" --output "$RUNNER_TEMP/b798-source")
          python tools/hu_b798_rank136_new_rivers.py "${args[@]}" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$RUNNER_TEMP/b798-source/proof.json" "$RUNNER_TEMP/b798-proof"
          python tools/hu_b798_rank136_new_rivers.py "${args[@]}"
          cmp "$RUNNER_TEMP/b798-proof" "$RUNNER_TEMP/b798-source/proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B798-R136-${{ matrix.flop }}-${{ matrix.turn }}
          path: ${{ runner.temp }}/b798-source
          if-no-files-found: warn
          retention-days: 90
