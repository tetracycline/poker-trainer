name: TASK-HYBRID B30 independent river navigation and 24-CERT source/UI full regression
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b30-full-regression.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independently render and verify every HU table, source viewer JS, all 392 modeled HU nodes
        run: |
          set -euo pipefail
          mkdir -p audit
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
          node --check nl2_hu_model.js
          node tools/hu_line_contract.js > audit/hu-contract.json
          node tools/link_audit.js --md audit/link.md --json audit/link.json
          node tools/reach_verify.js --log audit/reach.md --json audit/reach.json
          node tools/hu_model_path_audit.js audit/model-path.json
      - name: Verify source SHA/SPR/reach, frozen top24, all measured/default/unknown locks, no universal b50 GTO
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b30_full_regression.py
          python3 tools/hu_cert_ui_completeness_gate.py
          python3 tools/hu_b30_full_regression.py
      - name: Commit independent full navigation+CERT regression evidence to Draft PR#2, never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b30_full_integrity.json docs/NL2_HU_B30_FULL_INTEGRITY.md
          git commit -m 'TASK-HYBRID B30: prove 100pct original HU river paths and 24/24 CERT with exact 99 lock sources'
          for retry in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$retry"
          done
          exit 1
      - name: Preserve evidence even on failed gate or GitHub write conflict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B30-full-HU-cert-navigation-regression
          path: |
            audit/
            data/nl2_hu_b30_full_integrity.json
            docs/NL2_HU_B30_FULL_INTEGRITY.md
          retention-days: 30
