name: B707 solve new KQ-high rank75 original roots and exact-price turn policies
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b707-rank75-highcards.yml'
      - 'tools/hu_b707_rank75_highcards.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [Kc9h3d, QhJc4d, KdTh5h]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify original source pins and real preflop ranges before native work
        env:
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b707_rank75_highcards.py
          python tools/hu_b707_rank75_highcards.py --solver pinned-solver --flop "$FLOP" \
            --output "$RUNNER_TEMP/preflight" --preflight
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve new original roots and only genuine reachable actor decisions
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b707-source"
          python tools/hu_b707_rank75_highcards.py --solver pinned-solver --flop "$FLOP" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$folder/proof.json" "$RUNNER_TEMP/b707-original-proof.json"
          python tools/hu_b707_rank75_highcards.py --solver pinned-solver --flop "$FLOP" --output "$folder"
          cmp "$folder/proof.json" "$RUNNER_TEMP/b707-original-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B707-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b707-source
          if-no-files-found: error
          retention-days: 90
