name: B762 extract the ten eligible rank199 rivers from original paired turn policies
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b762-rank199-rivers.yml'
      - 'tools/hu_b762_rank199_rivers.py'
      - 'tools/hu_b759_rank46_barrel_routes.cjs'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        turn: ['2c', '8d']
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate both B755 turn policies and the shared CO and BB hands
        env:
          TURN: ${{ matrix.turn }}
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b762_rank199_rivers.py
          node tools/hu_b759_rank46_barrel_routes.cjs > "$RUNNER_TEMP/b762-routes.json"
          python tools/hu_b762_rank199_rivers.py --solver pinned-solver --turn "$TURN" --archive data/solver_evidence/NL2_B755_R151_7H6D4S.zip \
            --output "$RUNNER_TEMP/preflight" --routes "$RUNNER_TEMP/b762-routes.json" --preflight
          git diff --exit-code -- nl2_hu_model.js nl2.js tools/hu_trainer_route_contract.cjs data/
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Extract ten missing river decisions across the two turns and verify all original nodes
        env:
          TURN: ${{ matrix.turn }}
          RAYON_NUM_THREADS: 2
          PYTHONDONTWRITEBYTECODE: 1
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b762-source"
          python tools/hu_b762_rank199_rivers.py --solver pinned-solver --turn "$TURN" --archive data/solver_evidence/NL2_B755_R151_7H6D4S.zip \
            --routes "$RUNNER_TEMP/b762-routes.json" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$folder/proof.json" "$RUNNER_TEMP/b762-original-proof.json"
          python tools/hu_b762_rank199_rivers.py --solver pinned-solver --turn "$TURN" --archive data/solver_evidence/NL2_B755_R151_7H6D4S.zip \
            --routes "$RUNNER_TEMP/b762-routes.json" --output "$folder"
          cmp "$folder/proof.json" "$RUNNER_TEMP/b762-original-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B762-R199-7h6d4s-${{ matrix.turn }}
          path: ${{ runner.temp }}/b762-source
          if-no-files-found: error
          retention-days: 90
