name: B588 authenticate exact BB river policies and all CERT boards
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b588-bb-rivers.yml'
      - 'tools/hu_b588_bb_river*'
      - 'data/nl2_hu_b588_bb_river*'
      - 'data/solver_evidence/NL2_B588_R*.zip'
permissions: {contents: read}
jobs:
  verify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Rebuild both native job specifications and replay both private-hand policies
        working-directory: trainer
        run: |
          set -euo pipefail
          python tools/hu_b588_bb_rivers.py --solver ../solver --out "$RUNNER_TEMP/preview.json"
          cmp "$RUNNER_TEMP/preview.json" data/nl2_hu_b588_bb_river_preview.json
      - name: Verify the published viewer policies, node locks, medium sizes and all registry routes
        working-directory: trainer
        run: |
          set -euo pipefail
          python tools/hu_b588_bb_rivers.py --solver ../solver --run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/publication.json"
          for rank in $(python -c "import json; print(*json.load(open('data/nl2_hu_b588_bb_river_inputs.json')))"); do
            node tools/hu_b558_river_policy_view.cjs "data/solver_evidence/reverified/rank$rank.json"
          done
          registry=data/nl2_hu_multiboard_status_current.json
          cp "$registry" "$RUNNER_TEMP/before.json"
          python tools/hu_apply_cert_extensions.py --out "$registry"
          python - "$RUNNER_TEMP/before.json" "$registry" <<'PYTHON'
          import json, sys
          before, after = [json.load(open(p))["records"] for p in sys.argv[1:]]
          ranks = set(map(int, json.load(open('data/nl2_hu_b588_bb_river_inputs.json'))))
          for mid, record in before.items():
              if record['frequency_rank'] in ranks:
                  assert after[mid]['label'] == 'CERT-MULTIBOARD'
              elif record['label'] == 'CERT-MULTIBOARD':
                  assert after[mid] == record
          PYTHON
          node tools/hu_extension_runtime_test.cjs "$registry"
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/coverage.json"
          bash tools/hu_exact_batch_audit.sh "$registry"
      - uses: actions/upload-artifact@v4
        with:
          name: B588-authenticated-BB-river-policies
          path: |
            trainer/data/nl2_hu_b588_locked_medium.json
            trainer/data/solver_evidence/NL2_MULTIBOARD_B588_R*.json.gz
            trainer/data/solver_evidence/reverified/rank72.json
            trainer/data/solver_evidence/reverified/rank74.json
          if-no-files-found: error
          retention-days: 90
