    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b247-v39-rank30-three-authentic-cert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-rank30-three-actor-verified-gto-nl2-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
