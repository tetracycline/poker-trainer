      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NL2-HU-B247-V39-R30-152CERT-584exact-676locks-HU2475
          path: |
            data/nl2_hu_multiboard_status_v39_b247_rank30.json
            data/nl2_hu_cert_lock_medium_matrix_v39_b247.json
            docs/NL2_HU_B247_V39_R30_THREE_AUTHENTIC_UTG_CO_OOP_CERT.md
            docs/NL2_HU_B247_V39_ALL_584_NAMED_BOARD_LOCK_MEDIUM.md
            nl2-audit/
          retention-days: 30
