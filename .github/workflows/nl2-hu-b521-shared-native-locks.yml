name: B521 measured opponent locks on fifteen shared native subgames and their certified decisions
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b521-shared-native-locks.yml', 'tools/hu_b521_native_street_locks.py', 'data/nl2_hu_b521_originals.json']
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild the original solver and solve three independent native boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
          mkdir -p "$RUNNER_TEMP/originals"
          args=(--solver pinned-solver --originals "$RUNNER_TEMP/originals" --out "$RUNNER_TEMP/fresh" --run "$GITHUB_RUN_ID")
          mapfile -t keys < <(jq -r --argjson sh "$SHARD" 'keys | to_entries[] | select(.key % 5 == $sh) | .value' data/nl2_hu_b521_originals.json)
          test "${#keys[@]}" -eq 3
          result=0
          for key in "${keys[@]}"; do
            aid=$(jq -r --arg key "$key" '.[$key].artifact_id' data/nl2_hu_b521_originals.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$RUNNER_TEMP/originals/$aid.zip"
            python tools/hu_b521_native_street_locks.py "${args[@]}" --key "$key" \
              --driver pinned-solver/postflop/pfdriver/target/release/pfdriver || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B521-native-${{ matrix.shard }}
          path: ${{ runner.temp }}/fresh/data/solver_evidence/NL2_B521_*.json.gz
          if-no-files-found: error
          retention-days: 90
  verify:
    runs-on: ubuntu-latest
    needs: solve
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'B521-native-*'
          merge-multiple: true
          path: ${{ runner.temp }}/fresh/data/solver_evidence
      - name: Replay every named original strategy through both players' previous actions and card blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originals"
          for aid in $(jq -r '[.[].artifact_id] | unique[]' data/nl2_hu_b521_originals.json); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$RUNNER_TEMP/originals/$aid.zip"
          done
          python tools/hu_b521_native_street_locks.py --originals "$RUNNER_TEMP/originals" --solver pinned-solver \
            --run "$GITHUB_RUN_ID" --replay "$RUNNER_TEMP/fresh" --out "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@v4
        with:
          name: B521-verified-certified-decisions
          path: ${{ runner.temp }}/verified
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified native locks on the current PR branch and audit all routes
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          status=data/nl2_hu_multiboard_status_current.json
          verified="$RUNNER_TEMP/verified"
          mapfile -t files < <(cd "$verified" && find data -type f | sort)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            for file in "${files[@]}"; do
              if test -e "$live/$file"; then cmp "$verified/$file" "$live/$file"; fi
            done
            cp -a "$verified/data/." "$live/data/"
            (
              cd "$live"
              python tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_extension_runtime_test.cjs "$status"
              git add -f -- "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B521: publish street-specific NL2 locks and native half-pot reach on shared SB and BTN subgames'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then
              (cd "$live" && bash tools/hu_exact_batch_audit.sh "$status")
              exit 0
            fi
            git worktree remove "$live"
          done
          exit 1
