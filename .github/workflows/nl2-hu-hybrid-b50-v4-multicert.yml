name: TASK-HYBRID B50 source-blind 6 high-frequency CERT + all 125 named lock/b50 proof (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b50-v4-multicert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Recheck B43 Rust GTO+EXP SHA and independently certify only preselected B42/B48 models
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b50_v4_multicert.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b50_v4_multicert.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independently regression test 33 cert, 359 approx, 125 real boards, Batch E, 2475 links, V4->V1 UI fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          V='data/nl2_hu_multiboard_status_v4_batch50.json'
          v4=json.load(open(V))
          v3=json.load(open('data/nl2_hu_multiboard_status_v3_rank28.json'))
          m=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v4.json'))
          n=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert v4['schema']=='NL2_HU_392_MULTIBOARD_CERT_STATUS_V4_BATCH50'
          assert v4['CERT_MULTIBOARD']==33 and v4['APPROX']==359
          assert v3['CERT_MULTIBOARD']==27 and v3['APPROX']==365
          assert v4['parent_v3_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v3_rank28.json','rb').read()).hexdigest()
          assert v4['source_blind_expansion_ranks']==[31,34,36,37,38,39]
          assert len(v4['b50_certificates'])==6
          assert m['CERT_MULTIBOARD']==33 and m['APPROX']==359
          assert m['strict_aggregate']['named_board_proofs']==len(m['boards'])==125
          assert all(b['hero_lock_proofs'] and b['strictly_reachable_combo_count']>0 for b in m['boards'])
          assert m['parent_v4_status_sha256']==hashlib.sha256(open(V,'rb').read()).hexdigest()
          assert v4['independently_verified_completed_batches']['B43_UTG_B75']['status']=='VERIFIED'
          assert v4['independently_verified_completed_batches']['B4_MICRO']['run_id']==44732810327
          assert n['reach_river']==n['continuing']==2475 and n['share_pct']==100
          assert n['missing_river']==n['link_misses']==n['reach_violations']==n['modeled_path_violations']==0
          print('PASS V4 exact six ranks / 33 CERT 359 APPROX / 125 hero locks, E and river provenance')
          PY
          node - <<'JS'
          const fs=require('fs'), assert=require('assert').strict;
          const stems=['data/nl2_hu_multiboard_status_v4_batch50.json',
           'data/nl2_hu_multiboard_status_v3_rank28.json',
           'data/nl2_hu_multiboard_status_v2_tie.json',
           'data/nl2_hu_multiboard_status.json'];
          const statuses=stems.map(x=>JSON.parse(fs.readFileSync(x,'utf8')));
          async function test(path){
            const s=fs.readFileSync(path,'utf8'),a=s.indexOf('function fetchCertifiedRegistry(){'),
            b=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',a);
            assert(a>=0&&b>a,'Must consume parsed JSON, never a second .json()');
            const fn=new Function('fetch',s.slice(a,b)+';return fetchCertifiedRegistry();');
            for(let i=0;i<4;i++){
              const value=await fn(async url=>{
                const index=stems.findIndex(x=>url.includes(x));
                assert(index>=0);
                return index<i?{ok:false,status:404}:{ok:true,json:async()=>statuses[index]};
              });
              assert.strictEqual(value,statuses[i]);
            }
          }
          (async()=>{await test('nl2-multiboard.js');await test('nl2_hu_multiboard_ui.js');
            console.log('PASS V4/V3/V2/V1 model UI fallback');})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Commit true source-backed V4 and all-board lock/50pct report to PR #2, NEVER merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v4_batch50.json data/nl2_hu_cert_lock_medium_matrix_v4.json docs/NL2_HU_B50_V4_CERT.md docs/NL2_HU_CERT_LOCK_MEDIUM_MATRIX_V4.md
          git commit -m 'TASK-HYBRID B50: six authentic rank31/34/36-39 V4 certs, 33 CERT/359 APPROX, 125 exact lock+b50 proofs'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B50-V4-33-CERT-125-real-boards
          path: |
            data/nl2_hu_multiboard_status_v4_batch50.json
            data/nl2_hu_cert_lock_medium_matrix_v4.json
            docs/NL2_HU_B50_V4_CERT.md
            docs/NL2_HU_CERT_LOCK_MEDIUM_MATRIX_V4.md
          retention-days: 30
