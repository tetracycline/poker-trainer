name: B690 screen three connected CO-BTN roots and solve genuine rank75 continuations
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b690-rank75-connected.yml'
      - 'tools/hu_b690_rank75_connected.py'
permissions: {contents: read, actions: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        flop: [9d8d6h, 8c7c5h, 7s6s4d]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare exact call prices and build the pinned native solver
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b682_stage_prices.py --apply
          python tools/hu_b682_stage_prices.py --apply
          node tools/hu_b674_threebet_call_routes.cjs
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Screen native root reach and solve only actual shared turn actor decisions
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/source"
          python tools/hu_b690_rank75_connected.py --solver pinned-solver --flop "$FLOP" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$folder/proof.json" "$RUNNER_TEMP/native-proof.json"
          python tools/hu_b690_rank75_connected.py --solver pinned-solver --flop "$FLOP" --output "$folder"
          cmp "$folder/proof.json" "$RUNNER_TEMP/native-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: B690-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/source
          if-no-files-found: error
          retention-days: 90
