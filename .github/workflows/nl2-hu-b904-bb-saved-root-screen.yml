name: B904 six saved CO BB roots untested turn screen
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b904_bb_saved_root_screen.py'
      - '.github/workflows/nl2-hu-b904-bb-saved-root-screen.yml'
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  saved-root-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [9d7h4c, 8s6d2c, 7c5d3h, 7h6h2c, 8h7h3c, 9h8h2c]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate saved root and screen only untested conditional turn boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b904_bb_saved_root_screen.py --flop "$FLOP" --output "$RUNNER_TEMP/b904"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: B904-CO-BB-screen-${{ matrix.flop }}
          path: ${{ runner.temp }}/b904
          if-no-files-found: error
          retention-days: 90
