name: B758 study three monotone rank75 flops and preserve the original boundary extractions
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b758-rank75-monotone.yml'
      - 'tools/hu_b758_rank75_monotone.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [9h7h5h, 9d8d6d, 8c7c5c]
    env:
      FLOP: ${{ matrix.flop }}
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify original CO donk and BTN call witnesses, monotone UI and both preflop ranges
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b758_rank75_monotone.py --preflight --solver pinned-solver --flop "$FLOP" --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Extract the missing original boundaries or solve a new monotone full-size root
        run: |
          python tools/hu_b758_rank75_monotone.py --solver pinned-solver --flop "$FLOP" --checkpoint-only \
            --output "$RUNNER_TEMP/b758-root" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - name: Preserve the completed original before conditional work
        uses: actions/upload-artifact@v4
        with:
          name: B758-root-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b758-root
          if-no-files-found: error
          retention-days: 90
      - name: Read the saved original and verify both policies at reachable turn decisions
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b758-source"
          python tools/hu_b758_rank75_monotone.py --solver pinned-solver --flop "$FLOP" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver --checkpoint "$RUNNER_TEMP/b758-root"
          cp "$folder/proof.json" "$RUNNER_TEMP/original-proof"
          python tools/hu_b758_rank75_monotone.py --solver pinned-solver --flop "$FLOP" --output "$folder"
          cmp "$RUNNER_TEMP/original-proof" "$folder/proof.json"
          cmp "$RUNNER_TEMP/b758-root/flop/job.json" "$folder/flop/job.json"
          cmp "$RUNNER_TEMP/b758-root/flop/result.json" "$folder/flop/result.json"
      - name: Preserve the conditional jobs and original decisions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B758-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b758-source
          if-no-files-found: error
          retention-days: 90
