name: NL2 B414 rank214/219 durable SHA-pinned original Rust CFR combo archives, source viewer, HU2475 (max11m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b414-r214219-persistent-source.yml'
      - 'tools/hu_b414_r214219_persistent_original.py'
      - 'data/nl2_hu_b405_rank214_219_two_three_source_cert_proof.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate-archive-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require actual B405 verified CERT162 and all exact-source lock guards, fail closed on missing
        id: ready
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b414_r214219_persistent_original.py
          if [ ! -s data/nl2_hu_b405_rank214_219_two_three_source_cert_proof.json ];then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json,os
          x=json.load(open('data/nl2_hu_b405_rank214_219_two_three_source_cert_proof.json'))
          ok=(x.get('CERT_after'),x.get('APPROX_after'),x.get('named_boards_after'),x.get('locked_hero_variants_after'))==(162,230,615,707)
          ok=ok and x.get('true_original_full100bb_CFR_source_and_40_70_check') and x.get('unknown_lock_denominators_after')==0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+('true' if ok else 'false')+'\n')
          print('B414 authentic source original archive eligible:',ok)
          PY
      - name: Fetch actual B393 original GTO and B396 partially NL2 IP locked full CFR Rust sources
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b414-gto /tmp/b414-exp
          for flop in KsQh4d Js9h5d;do
            gh run download 45026396521 --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B393_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto" \
              --dir "/tmp/b414-gto/nl2-multiboard-B393_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto"
            gh run download 45027557999 --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B396_R214219_NL2_IP-CO_BB-${flop}-exp_ip" \
              --dir "/tmp/b414-exp/nl2-multiboard-B396_R214219_NL2_IP-CO_BB-${flop}-exp_ip"
          done
      - name: Independently verify complete actual Rust CFR per-combo original hashes and gzip preserve all certified pairs
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 tools/hu_b414_r214219_persistent_original.py --solver-root solver --gto /tmp/b414-gto --exp /tmp/b414-exp
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v49_b405_rank214_219.json --out /tmp/b414-source-audit.json
          python3 - <<'PY'
          import json
          x=json.load(open('data/nl2_hu_b414_rank214_219_persistent_source_index.json'))
          a=json.load(open('/tmp/b414-source-audit.json'))
          assert x['original_GTO_and_NL2_IP_source_SHA_pairing_verified']
          assert len(x['durable_immutable_gzip_CFR_source_archives'])==2
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(162,230,0)
          print('PASS B414 two real original source archive batches, certified CO-IP 162/230')
          PY
      - name: Wire exact source IDs to viewer without incorrectly treating partial NL2 lock as original GTO
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('nl2-multiboard.js')
          s=p.read_text(encoding='utf-8')
          anchor="if(!batch)return null;"
          assert s.count(anchor)==1
          addon="""if(!batch && ['ln-ipfr-r_model-1t7q0mn','ln-ipfr-r_model-kp19if'].includes(chosenModel?.model_id) &&
             status?.schema==='NL2_HU_392_MULTIBOARD_CERT_STATUS_V49_B405_R214_R219'){
             const verifiedOriginalRuns={45026396521:'B414_COBB_B393',45027557999:'B414_COBB_B396'};
             const code=verifiedOriginalRuns[run];
             if(code)batch=[code,{run_id:run,status:'VERIFIED'}];
           }
           """
          p.write_text(s.replace(anchor,addon+anchor),encoding='utf-8')
          h=pathlib.Path('nl2-multiboard.html');t=h.read_text()
          assert t.count('task-hybrid-b405-v49-20261122')==1
          h.write_text(t.replace('task-hybrid-b405-v49-20261122','task-hybrid-b414-persistent-20261122'))
          r=pathlib.Path('tools/hu_b378_v47_loader_runtime_test.cjs')
          u=r.read_text();needle='392-persistent-r107|405-v49'
          assert u.count(needle)==1
          r.write_text(u.replace(needle,needle+'|414-persistent'))
          PY
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
      - name: Full HU2475/2475 links, action contract, sequential reach, model paths, source label, V49 frontend
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b414-contract.json
          node tools/link_audit.js --md /tmp/b414-link.md --json /tmp/b414-link.json
          node tools/reach_verify.js --log /tmp/b414-reach.md --json /tmp/b414-reach.json
          node tools/hu_model_path_audit.js /tmp/b414-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node -e 'const c=require("/tmp/b414-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B414 HU2475/2475")'
          git diff --check
      - name: Commit and push only original authenticated persistent Rust CFR sources plus source viewer, never merge PR2
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B414_COBB_B393.json.gz \
            data/solver_evidence/NL2_MULTIBOARD_B414_COBB_B396.json.gz \
            data/nl2_hu_b414_rank214_219_persistent_source_index.json \
            docs/NL2_HU_B414_R214219_PERSISTENT_REAL_SOURCE.md \
            nl2-multiboard.js nl2-multiboard.html tools/hu_b378_v47_loader_runtime_test.cjs
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B414: preserve SHA-authenticated rank214/219 100bb Rust GTO+NL2 per-combo sources, viewer and HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
