name: B665 solve BB river decisions after a third-pot flop and half-pot turn
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b665-rank126.yml'
      - 'tools/hu_b665_rank126.py'
      - 'tools/hu_b665_rank126_routes.cjs'
permissions: {contents: read, actions: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        flop: [9h6s2c, 8d5h3c, 7c4h2d, Kh8c3d]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile the pinned Rust solver and verify the named original GTO boundary
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
        run: |
          set -euo pipefail
          python -m pip install numpy phevaluator==0.5.3.1
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
          output="$RUNNER_TEMP/sources/$FLOP"
          python tools/hu_b665_rank126.py --solver pinned-solver --flop "$FLOP" --output "$output" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$output/proof.json" "$RUNNER_TEMP/solver-proof.json"
          python tools/hu_b665_rank126.py --solver pinned-solver --flop "$FLOP" --output "$output"
          cmp "$RUNNER_TEMP/solver-proof.json" "$output/proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: B665-R126-${{ matrix.flop }}
          path: ${{ runner.temp }}/sources/${{ matrix.flop }}
          if-no-files-found: error
          retention-days: 90
