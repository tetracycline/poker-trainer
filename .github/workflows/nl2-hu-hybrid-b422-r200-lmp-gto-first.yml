name: NL2 B422 rank200 three distinct original LMP GTO-first flops, exact x-b50 line, HU2475 <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b422-r200-lmp-gto-first.yml'
      - 'tools/hu_b422_rank200_three_gto_first.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [QhTc5d, KcJh7d, AhTd5s]
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine original 100bb LMP CO_BB GTO, full flop sizing, exact checked b50-call branch
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot LMP_CO_BB --flop "${{ matrix.flop }}" --version gto \
            --flop-size-profile full --flop-line-policy checked-b50only --turn-count 1 \
            --manifest "evidence/LMP_CO_BB-${{ matrix.flop }}-gto.json"
      - name: Preserve original full 100bb Rust source and true zero-reach negative per flop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B422_R200_GTO_FIRST-LMP_CO_BB-${{ matrix.flop }}-gto
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independently authenticate original LMP GTO source, 169-class assumptions and exact actor-IP 40-70 SPR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b422-original
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/b422-original
          python3 -m py_compile tools/hu_b422_rank200_three_gto_first.py
          python3 tools/hu_b422_rank200_three_gto_first.py --downloads /tmp/b422-original --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b422-source.json
      - name: Full HU2475 river route reach, model paths, frontend, source labels and whitespace
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b422-contract.json
          node tools/link_audit.js --md /tmp/b422-link.md --json /tmp/b422-link.json
          node tools/reach_verify.js --log /tmp/b422-reach.md --json /tmp/b422-reach.json
          node tools/hu_model_path_audit.js /tmp/b422-model.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          python3 - <<'PY'
          import json
          p=json.load(open('data/nl2_hu_b422_rank200_three_gto_first.json'))
          a=json.load(open('/tmp/b422-source.json'))
          c=json.load(open('/tmp/b422-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(163,229,0)
          assert len(p['original_true_Rust_GTO_only_sources'])==3
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert p['NL2_partial_lock_only_after_GTO_strict_actor_positive']
          print('PASS B422 rank200 authentic original LMP GTO source triage, HU2475; no false CERT')
          PY
          git diff --check
      - name: Commit and push only original GTO evidence or negative proofs; never fake CERT or merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add data/nl2_hu_b422_rank200_three_gto_first.json docs/NL2_HU_B422_R200_THREE_GTO_FIRST_SOURCES.md
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B422: rank200 LMP original three-flop GTO source-first, exact checked-b50, HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
