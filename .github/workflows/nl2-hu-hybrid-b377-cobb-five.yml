name: NL2 B377 five CO_BB APPROX models, two actual full flop GTO + NL2 IP partial Rust source solves <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b377-cobb-five.yml'
      - 'tools/hu_b377_cobb_five_strict_sources.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - {flop: 7s5h3d, version: gto}
          - {flop: 7s5h3d, version: exp_ip}
          - {flop: 8s8h3d, version: gto}
          - {flop: 8s8h3d, version: exp_ip}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine original full-100bb four-flop-actions Rust CFR, predeclared two checked-CO cbet histories
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot CO_BB --flop "${{ matrix.flop }}" \
            --version "${{ matrix.version }}" --flop-size-profile full \
            --flop-line-policy checked-b50b100only --turn-count 1 \
            --manifest "evidence/CO_BB-${{ matrix.flop }}-${{ matrix.version }}.json"
      - name: Archive original SHA/verbatim Rust manifest, job and source regardless of case reach
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B377_COBB_FIVE-CO_BB-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent SHA, true Rust source, actor IP and full-street 40-70 combination gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b377-source
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/b377-source
          python3 -m py_compile tools/hu_b377_cobb_five_strict_sources.py tools/hu_sequential_cfr_reach.py
          python3 tools/hu_b377_cobb_five_strict_sources.py --downloads /tmp/b377-source
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b377-cert-source.json
      - name: All HU2475 link, reach, model-path, original matrix and UI integrity
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b377-contract.json
          node tools/link_audit.js --md /tmp/b377-link.md --json /tmp/b377-link.json
          node tools/reach_verify.js --log /tmp/b377-reach.md --json /tmp/b377-reach.json
          node tools/hu_model_path_audit.js /tmp/b377-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b377-cert-source.json'))
          q=json.load(open('data/nl2_hu_b377_co_bb_five_approx_two_fresh_true_gto_nl2_ip_strict_source.json'))
          c=json.load(open('/tmp/b377-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['no_certification_from_missing_or_zero_combo_board']
          assert len(q['models_and_frozen_lines'])==5
          print('PASS B377 true original source gate, 159/233 and HU2475')
          PY
          git diff --check
      - name: Commit authentic source board proof (or explicitly excluded negative) to draft PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b377_co_bb_five_approx_two_fresh_true_gto_nl2_ip_strict_source.json docs/NL2_HU_B377_FIVE_CO_BB_APPROX_STRICT_PAIR_SOURCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B377: SHA-and-strict-reach source proofs for five APPROX CO_BB models; never certify without 3 flops'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
