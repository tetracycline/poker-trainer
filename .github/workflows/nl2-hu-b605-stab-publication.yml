name: B605 verify four reachable CO turn boards from five completed native jobs
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b605-stab-publication.yml'
      - 'tools/hu_checked_stab_turns.py'
      - 'tools/hu_b598_stab_turns.py'
      - 'tools/hu_b592_iso_turn_routes.cjs'
      - 'data/nl2_hu_b598*'
      - 'data/solver_evidence/reverified/rank133.json'
      - 'data/solver_evidence/NL2_MULTIBOARD_B598_R133_*'
permissions: {contents: read, actions: read}
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Match the archived jobs and solutions to each successful native run
        working-directory: trainer
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          sha=6e305c61b113b36b54cba8fbaee404f57b3b1d69
          git fetch --quiet --no-tags --depth=1 origin "$sha"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45174797088" | jq -e --arg sha "$sha" '.head_sha == $sha'
          while read -r flop job; do
            path="data/solver_evidence/NL2_B598_R133_${flop^^}.zip"
            git diff --exit-code "$sha" HEAD -- "$path" data/nl2_hu_b598_stab_inputs.json
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" |
              jq -e --arg name "reproduce ($flop)" '.name == $name and .run_id == 45174797088 and .conclusion == "success"'
          done <<'JOBS'
          JsJc4d 137693158155
          Jc7c4c 137693158506
          Qd8d3d 137693158553
          8h6h2h 137693158781
          9s6h3d 137693159083
          JOBS
          python tools/hu_b598_stab_turns.py --solver ../solver --run 45174797088 --out "$RUNNER_TEMP/preview.json"
          cmp "$RUNNER_TEMP/preview.json" data/nl2_hu_b598_stab_preview.json
          git diff --exit-code -- data
          node tools/hu_b558_river_policy_view.cjs data/solver_evidence/reverified/rank133.json
          registry=data/nl2_hu_multiboard_status_current.json
          python tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/registry.json"
          cmp "$registry" "$RUNNER_TEMP/registry.json"
          git diff --exit-code -- data
          bash tools/hu_exact_batch_audit.sh "$registry"
