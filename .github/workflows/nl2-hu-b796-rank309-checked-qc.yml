name: B796 solve the original checked CO versus BTN Qc boundary for rank309
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b796-rank309-checked-qc.yml'
      - 'tools/hu_b796_rank309_checked_qc.py'
      - 'tools/hu_b796_rank309_routes.cjs'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the saved flop, preflop action ranges and exact Qc weights
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b796_rank309_checked_qc.py --solver pinned-solver --output "$RUNNER_TEMP/b796" --preflight
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve both Qc policies and replay the original files
        run: |
          set -euo pipefail
          args=(--solver pinned-solver --output "$RUNNER_TEMP/b796")
          python tools/hu_b796_rank309_checked_qc.py "${args[@]}" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          PYTHONHASHSEED=867 python tools/hu_b796_rank309_checked_qc.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B796-R309-9h7h5h-Qc
          path: ${{ runner.temp }}/b796
          if-no-files-found: error
          retention-days: 90
