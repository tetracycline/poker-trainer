name: TASK-HYBRID B244 V38 all 581 CERT exact NL2 lock measured-default-unknown + b50 HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b244-all-581-exact-lock-medium-source-priority.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent-all-581-rate-source-nonpolar-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify every original V38 actor-locked named board, source SHA, observed marginal vs assumed/unknown, and 50%-pot research scope
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b244_all_cert_measured_lock_nonpolar_gap_priority.py
          python3 tools/hu_b244_all_cert_measured_lock_nonpolar_gap_priority.py
      - name: Independently assert 581 provenance rows, all 151 certified models, 673 actor-locks, 133 exact b50 only and no fabricated NL2 private-card frequencies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,hashlib,json,pathlib,collections
          d=pathlib.Path('data')
          original=d/'nl2_hu_multiboard_status_v38_b206_rank190.json'
          j=d/'nl2_hu_b244_v38_all_581_measured_lock_nonpolar_gap_priority.json'
          c=d/'nl2_hu_b244_v38_all_581_board_lock_gap_priority.csv'
          x=json.loads(j.read_text());s=json.loads(original.read_text())
          assert x['schema']=='NL2_HU_B244_V38_ALL_581_EXACT_BOARD_NL2_RATE_SOURCE_MEDIUM50_PRIORITY_V1'
          assert (x['CERT_MULTIBOARD'],x['APPROX'],x['EST'],x['TOTAL'])==(151,241,0,392)
          assert x['parent_status_sha256']==hashlib.sha256(original.read_bytes()).hexdigest()
          assert (x['exact_named_board_count'],x['distinct_certified_models'])==(581,151)
          a=x['aggregate']
          assert (a['boards'],a['hero_lock_variants'],a['50pct_exact_only'])==(581,673,133)
          assert (a['measured_nodes'],a['assumed_nodes'],a['unmatched_nodes'],
                  a['historical_unknown_lock_variants'])==(4510,2139,3850,315)
          assert a['boards_missing_pure_measured_evidence']==567
          assert all(x[k] for k in ('all_581_have_real_actor_matched_NL2_lock_source',
            'observed_rate_is_pool_marginal_not_hole_card_conditional',
            'UNKNOWN_and_ASSUMED_not_reclassified_as_observed',
            'no_new_observed_NL2_private_card_rates','no_new_hero_NL2_locked_sources',
            'no_unsupported_model_CERT_upgrade','PR2_Draft_NEVER_MERGE'))
          with c.open(newline='',encoding='utf-8') as f:
              csvrows=list(csv.DictReader(f))
          assert len(csvrows)==581
          assert len(x['all_581_board_source_rows'])==581
          assert len({(z['model_id'],z['flop'],z['turn'],z['exact_action_line'],z['actor_seat'])
             for z in x['all_581_board_source_rows']})==581
          assert sum(z['b50_exact_board_nonpolarized_research_only'] for z in x['all_581_board_source_rows'])==133
          assert sum(z['lock_variant_count'] for z in x['all_581_board_source_rows'])==673
          assert all(z['strict_hero_combos']>0 and len(z['GTO_source_sha256'])==64 and
            z['new_real_NL2_measured_private_hand_conditionals']==0 and
            z['CERT_scope_only_exact_board_and_action'] and not z['universal_50pct_bet_recommendation']
            for z in x['all_581_board_source_rows'])
          assert len(x['highest_frequency_rate_source_upgrade_queue'])==60
          assert all(z['model_id'] in s['records'] and s['records'][z['model_id']]['label']=='CERT-MULTIBOARD'
            for z in x['highest_frequency_rate_source_upgrade_queue'])
          print('PASS B244 source rates 581 exact 151 models 673 locks 133 b50 and 567 missing measured coverage')
          PY
      - name: Full independent 581 true CERT GTO-NL2 board locks, medium50, exact contract and 2475 HU route regression
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v38_b206_rank190.json --out nl2-audit/b244-lock-medium.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b244-lock-medium.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(151,241,0)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'],
              a['aggregate']['board_examples_with_b50_candidate'])==(581,673,133)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS HU2475/2475")'
      - name: Commit measured-vs-assumed all 581 exact named-board priority only after full Actions PASS, Draft PR #2 NEVER MERGE
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b244_v38_all_581_measured_lock_nonpolar_gap_priority.json             data/nl2_hu_b244_v38_all_581_board_lock_gap_priority.csv             docs/NL2_HU_B244_V38_EXACT_581_LOCK_MEASURED_DEFAULT_UNKNOWN_AND_MEDIUM.md
          git commit -m 'TASK-HYBRID B244: 581 exact CERT NL2 locks observed/default/UNKNOWN prioritized, 133 b50 candidate-only, full HU2475 PASS; no false data'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-hu-B244-all-581-real-NL2-actor-lock-rates-medium50-HU2475
          path: |
            data/nl2_hu_b244_v38_all_581_measured_lock_nonpolar_gap_priority.json
            data/nl2_hu_b244_v38_all_581_board_lock_gap_priority.csv
            docs/NL2_HU_B244_V38_EXACT_581_LOCK_MEASURED_DEFAULT_UNKNOWN_AND_MEDIUM.md
            nl2-audit/
          retention-days: 30
