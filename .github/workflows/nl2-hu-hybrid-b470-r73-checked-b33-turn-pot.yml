name: B470 rank73 three new original BTN_BB checked-b33/turn-pot river pairs
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b470-r73-checked-b33-turn-pot.yml'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        flop: [7s5h3d, 8s7h5d, 4s4h2d]
        version: [gto, exp_oop]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve full flop tree and original 50/100 turn menu with pot-lead river extraction
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot BTN_BB \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy checked-b33only \
            --turn-line-policy b100only --lock-marginals-by-street --turn-count 1 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= 1
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert m["cases"] or len(m["skipped"]) == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NL2-B470-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/BTN_BB/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: NL2-B470-*
          path: downloads
      - name: Reconstruct both seats' legal full-street deals from the six original solves
        run: python3 tools/hu_b470_rank73_new_rivers.py --downloads downloads --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: B470-verified-originals-and-classification
          path: |
            data/nl2_hu_b470_rank73_river_sources.json
            data/solver_evidence/NL2_B470_R73_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_R73_*.json.gz
            data/solver_evidence/extensions/rank73.json
          if-no-files-found: error
          retention-days: 90
      - name: Run full audit against the live cumulative registry and commit verified sources
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          files=(data/nl2_hu_b470_rank73_river_sources.json data/solver_evidence/NL2_B470_R73_*.json.gz data/solver_evidence/NL2_MULTIBOARD_R73_*.json.gz)
          if test -f data/solver_evidence/extensions/rank73.json; then files+=(data/solver_evidence/extensions/rank73.json); fi
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              status=data/nl2_hu_multiboard_status_current.json
              python3 tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              git add "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              if ! git diff --cached --quiet; then
                git commit -m 'B470: preserve exact rank73 board-level evidence and cumulative certification'
              fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
