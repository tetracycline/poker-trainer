name: B861 rank128 original SB BB source and GTO river preflight
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b861-rank128-originals.yml'
      - 'tools/hu_b861_rank128_originals.py'
permissions: {contents: read, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check original completed jobs and rank128 untested boundaries
        run: |
          set -euo pipefail
          python -m pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b838_approx_coverage_priority_audit.py
          NODE_OPTIONS=--max-old-space-size=1536 python tools/hu_b861_rank128_originals.py "$RUNNER_TEMP/b861" pinned-solver
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        with:
          name: B861-rank128-original-source-screen
          path: ${{ runner.temp }}/b861
          if-no-files-found: error
          retention-days: 90
