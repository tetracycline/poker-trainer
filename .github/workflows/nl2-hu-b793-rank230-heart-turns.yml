name: B793 verify four held-out heart turns on the original rank230 SB/BTN root
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b793-rank230-heart-turns.yml'
      - 'tools/hu_b793_rank230_heart_turns.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FLOP: Ts7h6s
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify five held-out original jobs and the checked two-seat root
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b793_rank230_heart_turns.py --preflight --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native driver
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve only the four missing chance branches and verify original native outputs
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/b793-source"
          python tools/hu_b793_rank230_heart_turns.py --flop "$FLOP" --solver pinned-solver --output "$path" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$path/proof.json" "$RUNNER_TEMP/b793-proof"
          python tools/hu_b793_rank230_heart_turns.py --flop "$FLOP" --solver pinned-solver --output "$path"
          cmp "$RUNNER_TEMP/b793-proof" "$path/proof.json"
      - name: Preserve the immutable flop source and newly solved conditional jobs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B793-R230-Ts7h6s
          path: ${{ runner.temp }}/b793-source
          if-no-files-found: error
          retention-days: 90
