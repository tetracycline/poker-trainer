name: B914 held-out free-suit boundary verification
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['tools/hu_b914_boundary_replay.py', '.github/workflows/nl2-hu-b914-boundary-replay.yml']
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [7h6h2c, 8h7h3c]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compare raw boundary weights and original job bytes without solving
        env:
          GH_TOKEN: ${{ github.token }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b914_boundary_replay.py "$RUNNER_TEMP/b914" pinned-solver "$FLOP"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B914-boundary-${{ matrix.flop }}
          path: ${{ runner.temp }}/b914
          if-no-files-found: warn
          retention-days: 90
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static model link and exact named-board audit
        run: |
          python -m pip install -q numpy phevaluator==0.5.3.1
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
