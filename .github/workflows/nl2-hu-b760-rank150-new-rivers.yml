name: B760 extract 16 previously unexported rank150 rivers from original turn policies
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b760-rank150-new-rivers.yml'
      - 'tools/hu_b760_rank150_rivers.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Replay the original paired-turn jobs and preregister the new physical BB and CO deals
        run: |
          set -euo pipefail
          python -m pip -q install numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b760_rank150_rivers.py
          python tools/hu_b760_rank150_rivers.py --preflight --solver pinned-solver --output "$RUNNER_TEMP/b760-preflight"
      - name: Compile the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Export new rivers and verify all 210 original nodes per policy and both seats
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/b760-source"
          python tools/hu_b760_rank150_rivers.py --solver pinned-solver --output "$out" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$out/proof.json" "$RUNNER_TEMP/b760-original-proof.json"
          python tools/hu_b760_rank150_rivers.py --solver pinned-solver --output "$out"
          cmp "$out/proof.json" "$RUNNER_TEMP/b760-original-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B760-R150-Ts9s5h-9d
          path: ${{ runner.temp }}/b760-source
          if-no-files-found: error
          retention-days: 90
