name: NL2 B407 rank166 two true CO-IP NL2 partial-locked source flops <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b407-r166-nl2-source.yml'
      - 'tools/hu_b407_rank166_true_co_ip_pairs.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        flop: [KcJh7d, QhTc5d]
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine original 100bb CO-IP partially NL2-locked Rust fullflop and turn for B400-positive two flops
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot CO_BB --flop "${{ matrix.flop }}" --version exp_ip \
            --flop-size-profile full --flop-line-policy checked-b50b100only --turn-count 1 \
            --manifest "evidence/CO_BB-${{ matrix.flop }}-exp_ip.json"
      - name: Preserve real solve manifest and exact original SHA even on no actor reach
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B407_R166_NL2_IP-CO_BB-${{ matrix.flop }}-exp_ip
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Genuine B400 GTO pinned original + B407 new EXP SHA and fullstreet 40-70 actor-IP proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b407-gto /tmp/b407-exp
          for flop in KcJh7d QhTc5d; do
            gh run download 45028060598 --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B400_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto" \
              --dir "/tmp/b407-gto/nl2-multiboard-B400_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B407_R166_NL2_IP-CO_BB-${flop}-exp_ip" \
              --dir "/tmp/b407-exp/nl2-multiboard-B407_R166_NL2_IP-CO_BB-${flop}-exp_ip" || true
          done
          python3 -m py_compile tools/hu_b407_rank166_true_co_ip_pairs.py
          python3 tools/hu_b407_rank166_true_co_ip_pairs.py \
            --gto-root /tmp/b407-gto --exp-root /tmp/b407-exp --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v48_b390_rank107.json --out /tmp/b407-lockaudit.json
      - name: Full HU 2475/2475 action river routes, per board labels and JS/model paths
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b407-contract.json
          node tools/link_audit.js --md /tmp/b407-link.md --json /tmp/b407-link.json
          node tools/reach_verify.js --log /tmp/b407-reach.md --json /tmp/b407-reach.json
          node tools/hu_model_path_audit.js /tmp/b407-model.json
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/b407-link.json'))['counts']
          x=json.load(open('data/nl2_hu_b407_r166_two_real_nl2_ip_original_pairs.json'))
          a=json.load(open('/tmp/b407-lockaudit.json'))
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(160,232,0)
          assert x['no_automatic_CERT_while_no_three_independent_original_sources']
          assert len(x['source_evidence'])==2
          print('PASS B407 real source-only GTO/NL2 IP pairs, 160/232, HU2475/2475')
          PY
          git diff --check
      - name: Commit and push B407 source proof, no fake CERT, NEVER MERGE PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b407_r166_two_real_nl2_ip_original_pairs.json docs/NL2_HU_B407_R166_TWO_TRUE_IP_LOCKS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B407: genuine CO_BB rank166 two GTO+NL2 IP source flop pairs, strict combo/SPR, HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
