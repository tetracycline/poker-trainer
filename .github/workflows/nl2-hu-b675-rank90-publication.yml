name: B675 authenticate original rank90 workers and prepare a fully audited candidate
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b675-rank90-publication.yml'
      - 'tools/hu_b673_publish_rank90.py'
      - 'tools/hu_b675_rank90_collect.py'
      - 'data/nl2_hu_b673_rank90_workers.json'
permissions: {contents: write, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Authenticate only the completed original B666 and B673 worker archives
        working-directory: trainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile tools/hu_b673_publish_rank90.py tools/hu_b675_rank90_collect.py tools/hu_publish_candidate.py
          cp data/nl2_hu_multiboard_status_current.json "$RUNNER_TEMP/b675-before.json"
          python tools/hu_b675_rank90_collect.py --output "$RUNNER_TEMP/b675-originals"
          python tools/hu_b673_publish_rank90.py --solver ../solver \
            --receipts "$RUNNER_TEMP/b675-originals" --output "$RUNNER_TEMP/b675-replayed" \
            > "$RUNNER_TEMP/b675-summary.json"
          cat "$RUNNER_TEMP/b675-summary.json"
      - name: Require three distinct positive flops before touching the live registry
        working-directory: trainer
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/b675-replayed/data/solver_evidence/reverified/rank90.json"
          python - "$RUNNER_TEMP/b675-replayed/data/solver_evidence/reverified/rank90.json" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_bytes())
          assert d['rank']==90 and d['model_id']=='ln-opfr-r_model-1ixkq7a'
          assert 3<=len(d['boards'])<=5
          assert len({b['flop'] for b in d['boards']})==len(d['boards'])
          assert all(p['GTO_compatible_hole_card_pairs']>=p['GTO_strict_combos']>0 and
                     p['NL2_compatible_hole_card_pairs']>=p['NL2_strict_combos']>0 for p in d['pins'])
          PY
          cp -R "$RUNNER_TEMP/b675-replayed/data/." data/
          python tools/hu_apply_cert_extensions.py --out data/nl2_hu_multiboard_status_current.json
          python - "$RUNNER_TEMP/b675-before.json" <<'PY'
          import json,sys
          old=json.load(open(sys.argv[1]));new=json.load(open('data/nl2_hu_multiboard_status_current.json'))
          mid='ln-opfr-r_model-1ixkq7a'
          changed=[k for k,r in old['records'].items() if r['label']!=new['records'][k]['label']]
          assert changed in ([],[mid]), changed
          assert all(new['records'][k]['label']=='CERT-MULTIBOARD' for k,r in old['records'].items() if r['label']=='CERT-MULTIBOARD')
          assert new['records'][mid]['label']=='CERT-MULTIBOARD'
          assert new['TOTAL']==392 and new['CERT_MULTIBOARD']+new['APPROX']==392
          PY
      - name: Run the complete source, node-lock, half-pot and HU navigation audits
        working-directory: trainer
        run: |
          set -euo pipefail
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
          python tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/b675-registry-replay.json"
          cmp data/nl2_hu_multiboard_status_current.json "$RUNNER_TEMP/b675-registry-replay.json"
          git fetch --quiet --no-tags --depth=1 origin d0fe026b3cd59b50450f99471bd27c55e7d4b522
          python tools/hu_b491_incremental_medium.py
          node tools/hu_b491_incremental_medium.cjs
          node tools/hu_b483_lock_medium_ui.cjs
          node tools/hu_b485_medium_viewers.cjs
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/b675-medium-coverage.json"
          node tools/hu_b558_river_policy_view.cjs data/solver_evidence/reverified/rank90.json
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          node tools/hu_b492_medium_tree_ui.cjs
          node tools/hu_b584_optional_river_ui.cjs
      - name: Create an immutable candidate commit without moving any branch
        working-directory: trainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo 'Rank90 authenticated outputs are already current; no candidate needed.'
            exit 0
          fi
          python tools/hu_publish_candidate.py \
            --message 'B675 certify rank90 from authenticated native GTO and measured actor-lock boards' \
            --paths \
            'data/nl2_hu_b673_rank90_workers.json' \
            'data/nl2_hu_b673_rank90_results.json' \
            'data/nl2_hu_b673_locked_medium.json' \
            'data/solver_evidence/reverified/rank90.json' \
            'data/solver_evidence/NL2_B666_R90_*.zip' \
            'data/solver_evidence/NL2_MULTIBOARD_B666_R90_*.json.gz' \
            'data/nl2_hu_multiboard_status_current.json' \
            'data/nl2_hu_verified_extensions.json' \
            'data/nl2_hu_model_history_crosswalk.json' \
            'data/nl2_hu_model_source_references.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B675-authenticated-rank90
          path: |
            ${{ runner.temp }}/b675-replayed/data
            ${{ runner.temp }}/b675-summary.json
            ${{ runner.temp }}/b675-medium-coverage.json
          if-no-files-found: warn
          retention-days: 90
