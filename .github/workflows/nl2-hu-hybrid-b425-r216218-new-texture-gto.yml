name: NL2 B425 rank216/218 three fresh texture-diverse GTO-first CO_BB flops, HU2475 <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b425-r216218-new-texture-gto.yml'
      - 'tools/hu_b425_r216218_three_new_texture_gto_first.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        flop: [Ac8d4h, 7c5h2d, 9s9h3d]
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine full100bb original Rust GTO on three frozen texture-diverse boards, exact checked-b50 line
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot CO_BB --flop "${{ matrix.flop }}" --version gto \
            --flop-size-profile full --flop-line-policy checked-b50only --turn-count 1 \
            --manifest "evidence/CO_BB-${{ matrix.flop }}-gto.json"
      - name: Preserve original GTO root and exact turn/river sources including true strict-zero negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B425_R216218_GTO_FIRST-CO_BB-${{ matrix.flop }}-gto
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent source SHA, CO-IP actor, exact action and 40-70 sequential reach verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b425-original
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/b425-original
          python3 -m py_compile tools/hu_b425_r216218_three_new_texture_gto_first.py
          python3 tools/hu_b425_r216218_three_new_texture_gto_first.py --downloads /tmp/b425-original --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b425-source.json
      - name: Full HU2475 river reach, JS model paths, exact source labels and whitespace
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b425-contract.json
          node tools/link_audit.js --md /tmp/b425-link.md --json /tmp/b425-link.json
          node tools/reach_verify.js --log /tmp/b425-reach.md --json /tmp/b425-reach.json
          node tools/hu_model_path_audit.js /tmp/b425-model.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          python3 - <<'PY'
          import json
          p=json.load(open('data/nl2_hu_b425_r216218_three_new_texture_gto_sources.json'))
          a=json.load(open('/tmp/b425-source.json'))
          c=json.load(open('/tmp/b425-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(163,229,0)
          assert len(p['real_original_GTO_only_solve_sources'])==3
          assert len(p['models'])==2
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert p['only_GTO_positive_flops_eligible_for_future_real_NL2_IP_partial_lock']
          print('PASS B425 original texture-diverse GTO-first sources, no premature CERT, HU2475')
          PY
          git diff --check
      - name: Commit and push original GTO evidence/negative proofs only, never fake CERT or merge PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b425_r216218_three_new_texture_gto_sources.json docs/NL2_HU_B425_R216218_THREE_NEW_TEXTURE_GTO_SOURCES.md
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B425: three new texture-diverse CO_BB GTO sources for ranks216/218, 40-70 and HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
