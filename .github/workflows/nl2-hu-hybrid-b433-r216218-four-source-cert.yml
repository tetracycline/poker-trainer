name: NL2 B433 promote rank216/218 with four exact GTO+NL2-IP flops, V52 165/227, HU2475 <=25m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b433-r216218-four-source-cert.yml'
      - 'tools/hu_b433_rank216218_four_source_promote.py'
      - 'data/nl2_hu_b429_r216218_three_new_texture_gto_sources.json'
      - 'data/nl2_hu_b431_r216218_one_new_texture_nl2_ip_pair.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  independently-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download immutable original B2, B400, B393, B429 GTO and actual NL2-IP artifacts (no solver reruns)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b433-historical-gto /tmp/b433-historical-exp /tmp/b433-td-gto /tmp/b433-td-exp /tmp/b433-js-gto /tmp/b433-js-exp /tmp/b433-low-gto /tmp/b433-low-exp
          gh run download 44666290556 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B2-CO_BB-gto-Js9h4d --dir /tmp/b433-historical-gto
          gh run download 44666290556 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B2-CO_BB-exp_ip-Js9h4d --dir /tmp/b433-historical-exp
          gh run download 45028060598 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B400_COBB_FIVE_GTO_FIRST-CO_BB-Td8h3c-gto --dir /tmp/b433-td-gto
          gh run download 45029736915 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B412_R216218_NL2_IP-CO_BB-Td8h3c-exp_ip --dir /tmp/b433-td-exp
          gh run download 45026396521 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B393_COBB_FIVE_GTO_FIRST-CO_BB-Js9h5d-gto --dir /tmp/b433-js-gto
          gh run download 45052841553 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B421_R216218_NL2_IP-CO_BB-Js9h5d-exp_ip --dir /tmp/b433-js-exp
          gh run download 45055601616 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B429_R216218_GTO_FIRST-CO_BB-7c6h5d-gto --dir /tmp/b433-low-gto
          gh run download 45056914556 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B431_R216218_NL2_IP-CO_BB-7c6h5d-exp_ip --dir /tmp/b433-low-exp
      - name: Independently authenticate four distinct original GTO and actual NL2-IP flops per rank
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b433_rank216218_four_source_promote.py
          python3 tools/hu_b433_rank216218_four_source_promote.py \
            --historical-gto /tmp/b433-historical-gto --historical-exp /tmp/b433-historical-exp \
            --td-gto /tmp/b433-td-gto --td-exp /tmp/b433-td-exp \
            --js-gto /tmp/b433-js-gto --js-exp /tmp/b433-js-exp \
            --low-gto /tmp/b433-low-gto --low-exp /tmp/b433-low-exp
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v52_b433_rank216_218.json --out /tmp/b433-audit.json
          python3 - <<'PY'
          import json
          s=json.load(open('data/nl2_hu_multiboard_status_v52_b433_rank216_218.json'))
          a=json.load(open('/tmp/b433-audit.json'))
          m=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v52_b433.json'))
          p=json.load(open('data/nl2_hu_b433_rank216218_four_true_source_cert_proof.json'))
          assert (s['CERT_MULTIBOARD'],s['APPROX'],s['EST'],s['TOTAL'])==(165,227,0,392)
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(165,227,0)
          assert (len(m['models']),len(m['boards']))==(165,626)
          assert (p['named_boards_after'],p['locked_hero_variants_after'],p['unknown_lock_denominators_after'])==(626,718,0)
          assert all(len(x['pins'])==4 for x in p['model_source_pins'])
          print('PASS B433 V52 165/227; 626 exact boards; 718 NL2 lock variants; UNKNOWN=0')
          PY
      - name: Frontend V52 fail-closed validators and runtime loader
        run: |
          set -euo pipefail
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const status=JSON.parse(fs.readFileSync('data/nl2_hu_multiboard_status_v52_b433_rank216_218.json','utf8'));
          for(const file of ['nl2_hu_multiboard_ui.js','nl2-multiboard.js']){
            const src=fs.readFileSync(file,'utf8');
            const a=src.indexOf('const v50b417=d=>{'),b=src.indexOf('const v49b405=d=>{',a);
            assert.ok(a>=0&&b>a,file+' missing V50/V52 validators');
            const fn=new Function(src.slice(a,b)+';return v52b433;')();
            assert.equal(fn(status),status);
            const forged=structuredClone(status);forged.CERT_MULTIBOARD=164;
            assert.throws(()=>fn(forged),/failclosed/);
            const missing=structuredClone(status);
            missing.records['ln-ipfr-r_model-7kv23r'].certified_3_to_5_exact_flop_boards[3].strict_full_street_combo_reachable=0;
            assert.throws(()=>fn(missing),/failclosed/);
            assert.ok(src.includes('data/nl2_hu_multiboard_status_v52_b433_rank216_218.json'));
          }
          console.log('PASS B433 V52 frontend exact-source validator and negative cases');
          JS
      - name: Full HU2475 river routes, sequential reach, model paths, JS and whitespace audit
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b433-contract.json
          node tools/link_audit.js --md /tmp/b433-link.md --json /tmp/b433-link.json
          node tools/reach_verify.js --log /tmp/b433-reach.md --json /tmp/b433-reach.json
          node tools/hu_model_path_audit.js /tmp/b433-model.json
          node -e 'const c=require("/tmp/b433-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B433 HU2475/2475")'
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("/tmp/b433-reach.json","utf8"));if(r.violations!==0)process.exit(1);console.log("PASS sequential reach zero violations")'
          git diff --check
      - name: Commit V52 four-flop certificate, per-board locks, UI and audit to draft PR2 only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add data/nl2_hu_b433_r216218_four_true_source_pre_cert_gate.json \
            data/nl2_hu_multiboard_status_v52_b433_rank216_218.json \
            data/nl2_hu_cert_lock_medium_matrix_v52_b433.json \
            data/nl2_hu_cert_lock_medium_audit_v52_b433.json \
            data/nl2_hu_b433_rank216218_four_true_source_cert_proof.json \
            docs/NL2_HU_B433_R216218_FOUR_TRUE_SOURCE_CERT.md \
            tools/hu_cert_lock_medium_audit.py tools/hu_b378_v47_loader_runtime_test.cjs \
            nl2_hu_multiboard_ui.js nl2-multiboard.js nl2.html nl2-multiboard.html
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B433: rank216/218 four-flop original GTO+NL2-IP CERT, V52 165/227, 626 boards 718 locks'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
