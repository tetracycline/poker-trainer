name: B902 preserve rank75 screen and diagnose saved rank80 roots
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b902_rank75_archive_rank80_screen.py'
      - '.github/workflows/nl2-hu-b902-rank75-archive-rank80-screen.yml'
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  archive-rank75:
    permissions: {contents: write, actions: read, pull-requests: read}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate and independently replay completed B901 screen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b902_rank75_archive_rank80_screen.py archive "$RUNNER_TEMP/b902"
      - name: Full independent registry and browser audit
        run: |
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
      - name: Create audited detached candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/hu_b902_rank75_archive_rank80_screen.py upload "$RUNNER_TEMP/b902"
      - uses: actions/upload-artifact@v4
        with:
          name: B902-detached-rank75-screen
          path: ${{ runner.temp }}/b902
          if-no-files-found: error
          retention-days: 90
  rank80-saved-root-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Diagnose original actor reach, reconstruct unseen boundaries if feasible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b902_rank75_archive_rank80_screen.py rank80 "$RUNNER_TEMP/b902-r80"
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        with:
          name: B902-rank80-saved-root-screen
          path: ${{ runner.temp }}/b902-r80
          if-no-files-found: error
          retention-days: 90
