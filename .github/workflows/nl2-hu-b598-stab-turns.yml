name: B598 reproduce CO pot-sized flop stabs and verify rank133 turns
on:
  workflow_dispatch:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b598-stab-turns.yml'
      - 'tools/hu_b598_stab_turns.py'
      - 'tools/hu_checked_stab_turns.py'
      - 'tools/hu_b592_iso_turn_routes.cjs'
      - 'data/nl2_hu_b598_stab_inputs.json'
      - 'data/solver_evidence/NL2_B598_R133_*.zip'
permissions: {contents: read}
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        flop: ['8h6h2h', 'JsJc4d', '9s6h3d', 'Qd8d3d', 'Jc7c4c']
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned native engine
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          git clone -q https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Re-solve the complete native flop and both turn policies
        working-directory: trainer
        run: python tools/hu_b598_stab_turns.py --solver ../solver --reproduce-flop ${{ matrix.flop }}
  verify:
    needs: reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Check shared private hands, branch prices and existing certifications
        working-directory: trainer
        run: |
          set -euo pipefail
          registry=data/nl2_hu_multiboard_status_current.json
          cp "$registry" "$RUNNER_TEMP/before.json"
          python tools/hu_b598_stab_turns.py --solver ../solver --run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/report.json"
          cmp "$RUNNER_TEMP/report.json" data/nl2_hu_b598_stab_preview.json
          python tools/hu_apply_cert_extensions.py --out "$registry"
          python - "$RUNNER_TEMP/before.json" "$registry" <<'PY'
          import json,sys
          before,after=(json.load(open(p))['records'] for p in sys.argv[1:])
          target='ln-ipc-t_model-day18r'
          assert before.keys()==after.keys() and all(after[k]==before[k] for k in before if k!=target)
          assert after[target]['label']=='CERT-MULTIBOARD'
          PY
          node tools/hu_b558_river_policy_view.cjs data/solver_evidence/reverified/rank133.json
          node tools/hu_extension_runtime_test.cjs "$registry"
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/coverage.json"
          bash tools/hu_exact_batch_audit.sh "$registry"
      - uses: actions/upload-artifact@v4
        with:
          name: B598-authenticated-rank133
          if-no-files-found: error
          path: |
            trainer/data/nl2_hu_b598_locked_medium.json
            trainer/data/solver_evidence/reverified/rank133.json
            trainer/data/solver_evidence/NL2_MULTIBOARD_B598_R133_*.json.gz
