name: TASK-HYBRID B61 source-blind 8 new V8 CERT, 56/336, 219 exact-board NL2 source proofs
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b61-eight-cert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independently-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild real eight-model GTO/hero-lock proofs from frozen B60 ranks only
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b61_v8_eight_cert.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b61_v8_eight_cert.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Gate V7 parent, V8 56-336 219 real source cards, Batch E, all rivers, UI V8-V1 fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          p=json.load(open('data/nl2_hu_multiboard_status_v7_batch59.json'))
          d=json.load(open('data/nl2_hu_multiboard_status_v8_batch61.json'))
          m=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v8.json'))
          nav=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert (p['CERT_MULTIBOARD'],p['APPROX'])==(48,344)
          assert (d['CERT_MULTIBOARD'],d['APPROX'])==(56,336)
          assert d['source_blind_expansion_ranks']==[81,82,85,86,87,90,91,95]
          assert d['parent_v7_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v7_batch59.json','rb').read()).hexdigest()
          assert d['source_blind_b60_sha256']==hashlib.sha256(open('data/nl2_hu_b60_next20_sourceblind_gaps.json','rb').read()).hexdigest()
          changed={i for i in d['records'] if d['records'][i]!=p['records'][i]}
          assert len(changed)==8 and changed=={x['model_id'] for x in d['b61_certificates']}
          assert m['CERT_MULTIBOARD']==56 and m['APPROX']==336
          assert len(m['boards'])==m['strict_aggregate']['named_board_proofs']==219
          assert m['parent_v8_status_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v8_batch61.json','rb').read()).hexdigest()
          assert all(b['hero_lock_proofs'] and b['strictly_reachable_combo_count']>0 and b['no_general_bet_size_recommendation'] for b in m['boards'])
          assert nav['continuing']==nav['reach_river']==2475 and nav['share_pct']==100
          assert d['independently_verified_completed_batches']['B4_MICRO']['run_id']==44732810327
          print('PASS B61 V8 56/336, 219 real exact sources, Batch E + 100pct river')
          PY
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const f=['data/nl2_hu_multiboard_status_v8_batch61.json',
            'data/nl2_hu_multiboard_status_v7_batch59.json',
            'data/nl2_hu_multiboard_status_v6_rank33.json',
            'data/nl2_hu_multiboard_status_v5_batch55.json',
            'data/nl2_hu_multiboard_status_v4_batch50.json',
            'data/nl2_hu_multiboard_status_v3_rank28.json',
            'data/nl2_hu_multiboard_status_v2_tie.json',
            'data/nl2_hu_multiboard_status.json'];
          const data=f.map(p=>JSON.parse(fs.readFileSync(p,'utf8')));
          async function check(path){
            const s=fs.readFileSync(path,'utf8'),
              a=s.indexOf('function fetchCertifiedRegistry(){'),
              b=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',a);
            assert(a>=0&&b>a);
            const fn=new Function('fetch',s.slice(a,b)+';return fetchCertifiedRegistry();');
            for(let i=0;i<f.length;i++){
              const x=await fn(async url=>{
                const j=f.findIndex(p=>url.includes(p));assert(j>=0);
                return j<i?{ok:false,status:404}:{ok:true,json:async()=>data[j]};
              });
              assert.strictEqual(x,data[i]);
            }
          }
          (async()=>{
            await check('nl2-multiboard.js');
            await check('nl2_hu_multiboard_ui.js');
            console.log('PASS V8→V1 fallback both UIs');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Commit V8 exact GTO and complete 219 lock/50pct proof matrices; PR #2 Draft never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v8_batch61.json data/nl2_hu_cert_lock_medium_matrix_v8.json docs/NL2_HU_B61_V8_EIGHT_CERT.md docs/NL2_HU_B61_V8_ALL_LOCKS_MEDIUM.md
          git commit -m 'TASK-HYBRID B61: 8 source-blind rank76-95 3-5 board certs, V8 56 CERT/336 APPROX, 219 exact locks'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B61-V8-eight-real-CERT
          path: |
            data/nl2_hu_multiboard_status_v8_batch61.json
            data/nl2_hu_cert_lock_medium_matrix_v8.json
            docs/NL2_HU_B61_V8_EIGHT_CERT.md
            docs/NL2_HU_B61_V8_ALL_LOCKS_MEDIUM.md
          retention-days: 30
