name: B820 check unexported rank264 rivers against both original strategies
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['tools/hu_b820_rank264_missing_rivers.py', '.github/workflows/nl2-hu-b820-rank264-missing-rivers.yml']
permissions: {contents: read}
jobs:
  original-reach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy phevaluator==0.5.3.1
      - name: Authenticate both original policies and independently compare actual physical common turn hands
        run: |
          set -euo pipefail
          for seed in 23 867; do
            PYTHONHASHSEED="$seed" python tools/hu_b820_rank264_missing_rivers.py --output "$RUNNER_TEMP/b820-$seed.json"
          done
          cmp "$RUNNER_TEMP/b820-23.json" "$RUNNER_TEMP/b820-867.json"
          git diff --exit-code -- data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B820-rank264-unexported-river-gate
          path: ${{ runner.temp }}/b820-23.json
          if-no-files-found: error
          retention-days: 90
