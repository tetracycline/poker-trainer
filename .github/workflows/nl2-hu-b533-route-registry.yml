name: B533 publish trainer route validation and matching certified boards together
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['tools/hu_b533_trainer_routes.patch', '.github/workflows/nl2-hu-b533-route-registry.yml']
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Rebuild the canonical registry at current head and publish after testing all views
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          patch=tools/hu_b533_trainer_routes.patch
          registry=data/nl2_hu_multiboard_status_current.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d "$RUNNER_TEMP/route.XXXXXX")
            git worktree add --quiet --detach "$live" FETCH_HEAD
            (
              cd "$live"
              if test -f "$patch"; then
                git apply --3way "$patch"
                git rm -- "$patch"
              fi
              # The UI, exclusions and generated registry become visible in the same commit.
              python3 tools/hu_apply_cert_extensions.py --out "$registry"
              node tools/hu_extension_runtime_test.cjs "$registry"
              bash tools/hu_exact_batch_audit.sh "$registry"
              python3 tools/hu_b491_incremental_medium.py
              node tools/hu_b491_incremental_medium.cjs
              node tools/hu_b483_lock_medium_ui.cjs
              node tools/hu_b485_medium_viewers.cjs
              node tools/hu_b492_medium_tree_ui.cjs
              if test -f data/nl2_hu_b530_locked_medium.json; then node tools/hu_b530_history_rates_ui.cjs; fi
              git add -- "$registry" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then
                git commit -m 'B533: publish only exact CFR boards that match the trainer actor, action prices and monotone-turn route'
              fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
