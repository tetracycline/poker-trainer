name: TASK-HYBRID B357 rank96 next highfreq UTGCO OOP river b33 c/b50 c genuine 2 original 100bb GTO+NL2 partial Rust pairs HU2475 (max29m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b357-r96-two-full-gto-nl2-oop-river.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {spot: UTG_CO, flop: 8s8h3d, version: gto}
          - {spot: UTG_CO, flop: 8s8h3d, version: exp_oop}
          - {spot: UTG_CO, flop: Js9h4d, version: gto}
          - {spot: UTG_CO, flop: Js9h4d, version: exp_oop}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Python exact source syntax gate and pinned Rust CFR compile
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_multiboard_100bb.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve genuine full 100bb UTGCO original GTO or real Rust NL2 UTG OOP river lock 8s8h3d Js9h4d
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot "${{ matrix.spot }}" --flop "${{ matrix.flop }}" \
            --version "${{ matrix.version }}" --flop-size-profile full \
            --flop-line-policy oop-b33only --turn-count 1 \
            --manifest "evidence/${{ matrix.spot }}-${{ matrix.flop }}-${{ matrix.version }}.json"
      - name: Preserve immutable Rust source, even if solve fails or no legal combos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B357_R96_UTGCO_TWO-${{ matrix.spot }}-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: ${{ needs.solve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - name: Fetch exactly 6 immutable original Rust solve artifacts, separately report zero-reach cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloads
          test "$(find downloads -mindepth 1 -maxdepth 1 -type d -name 'nl2-multiboard-B357_R96_UTGCO_TWO-*' | wc -l)" -eq 4
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py --downloads downloads --solver-root solver --run-id "$GITHUB_RUN_ID" \
            --out trainer/data/solver_evidence/NL2_MULTIBOARD_B357_R96_UTGCO_TWO.json
      - name: Freeze four independent actual Rust source jobs; do not claim CERT from unsupported card path
        run: |
          python3 - <<'PY'
          import pathlib,gzip,json,hashlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B357_R96_UTGCO_TWO.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert not d['errors'] and len(d['artifacts'])==4
          assert sum(x['version']=='gto' for x in d['artifacts'])==2
          assert sum(x['version']=='exp_oop' for x in d['artifacts'])==2
          assert 0<=d['exact_board_gto_sources']<=2 and 0<=d['imputed_pool_locked_sources']<=2
          assert all(not x['errors'] and x['flop'] in ('8s8h3d','Js9h4d') for x in d['artifacts'])
          raw=p.read_bytes();gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
              run_id=d['source_run_id'],batch='B357_R96_UTGCO_TWO',
              actual_spot_flop_version_jobs=4,verified_cases=d['new_authentic_board_cases'],
              gto_cases=d['exact_board_gto_sources'],locked_cases=d['imputed_pool_locked_sources'],
              source_sha256=hashlib.sha256(raw).hexdigest(),
              gzip_sha256=hashlib.sha256(gz.read_bytes()).hexdigest(),
              generic_model_certification=0,
              exact_menu='Original full 100bb UTGCO preflop CFR 4-size flop b33 bet/call, separate real NL2 OOP partial Rust river b50 c source. No generic strategy.')
          p.with_suffix('.index.json').write_text(json.dumps(idx,indent=2,ensure_ascii=False)+'\n')
          p.unlink()
          print('PASS four full original UTGCO GTO and genuine NL2 COIP Rust sources',idx)
          PY
      - name: Canonical per-hand max 40-70 original b33 flop and b50 turn OOP actor river true GTO vs independently Rust NL2 partial, exact public board/SPR4.15
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b357_rank96_two_new_utgco_gto_nl2_oop_source_gate.py
          python3 tools/hu_b357_rank96_two_new_utgco_gto_nl2_oop_source_gate.py \
            --downloads ../downloads --run "$GITHUB_RUN_ID" \
            --out data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json
          python3 - <<'PY'
          import json
          x=json.load(open('data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json'))
          assert x['schema']=='NL2_HU_B357_RANK96_TWO_NEW_GENUINE_ORIGINAL_UTGCO_GTO_NL2_OOP_RIVER_SOURCE_V1'
          assert (x['original_V46_CERT'],x['original_V46_APPROX'])==(158,234)
          assert [z['flop'] for z in x['flops']]==['8s8h3d','Js9h4d']
          assert x['authentic_cases']==4 and x['target_line']=='b33 c/b50 c/' and x['actor']=='UTG_OOP'
          assert x['historic_successful_original_stage2_Ks7h2d_river_GTO_NL2_source_run']==44654973894
          assert x['no_GTO_only_cert_or_invented_private_card_NL2_rates']
          print('PASS B357 actual GTO plus NL2 OOP exact river target positive candidates',x['true_matching_new_original_GTO_plus_NL2_actor_OOP_flops'])
          PY
      - name: Full independently current V46 all392 models 158 CERT/234 APPROX 603 named original GTO real actor NL2 locks695 134 medium50 and 2475 HU river-path regression
        working-directory: trainer
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v46_b354_rank79.json --out nl2-audit/b357-source.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b357-source.json'))
          x=json.load(open('data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(158,234,0)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'],
             a['aggregate']['board_examples_with_b50_candidate'])==(603,695,134)
          assert x['original_V46_sha256']
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B357 2475/2475")'
      - name: Commit only four genuine original Rust GTO and real NL2 OOP source, strict GTO 40-70 full previous actor/SPR and full HU PASS; never auto-CERT
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json
          x=json.load(open('data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json'))
          lines=['# B357 rank96 original UTGCO full100bb GTO plus real NL2 OOP genuine actor river sources','',
           'Frozen new different public flops: 8s8h3d PAIRED and Js9h4d JT_HIGH, full original 100bb Rust GTO plus independent genuine Rust NL2 pooled-size partial OOP locks.',
           'Target exact river actor UTG OOP b33 c/b50 c/ after canonical per-combo max or 40%/70% preceding flop and turn actions, model SPR4.15 +/-5%.']
          for q in x['flops']:
            lines.append('- '+q['flop']+'/'+q['turn']+': GTO strict river '+
             str(q['GTO']['exact_target_actor_OOP_strict_source_combo_rows'])+
             ', NL2 strict river '+str(q['real_NL2_OOP_partial_lock']['exact_target_actor_OOP_strict_source_combo_rows'])+
             ', exact positive river-board matches '+str(len(q['matching_positive_public_river_boards'])))
          lines+=['', 'Original GTO-only or negative-root branch never counts as a real NL2 3-flop CERT; historic Ks7h2d/9d Stage2 authentic GTO+NL2 OOP rank96 still needs independent third-flop gate.',
             'NL2 observed street/size marginal only; no private-hand conditional measured frequency, generic texture GTO, or universal 50%-pot bet claims.',
             'V46 158 CERT/234 APPROX/0 EST unchanged, 603 named authenticated GTO+real NL2 boards, 695 partial actor lock variants, 134 exact-board b50 research-only flags, HU2475/2475 full independent audit before commit. PR2 Draft never merge.']
          pathlib.Path('docs/NL2_HU_B357_RANK96_TWO_GTO_REAL_NL2_OOP_RIVER_SOURCES.md').write_text('\n'.join(lines)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B357_R96_UTGCO_TWO.json.gz \
            data/solver_evidence/NL2_MULTIBOARD_B357_R96_UTGCO_TWO.index.json \
            data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json \
            docs/NL2_HU_B357_RANK96_TWO_GTO_REAL_NL2_OOP_RIVER_SOURCES.md
          git commit -m 'TASK-HYBRID B357: rank96 2 new 100bb full UTGCO original GTO plus real NL2 OOP river b33c/b50c source 40-70 SPR4.15, V46 603/695 HU2475 PASS no false CERT'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B357-rank96-two-full100bb-GTO-real-NL2-OOP-river-HU2475
          path: |
            trainer/data/solver_evidence/NL2_MULTIBOARD_B357_R96_UTGCO_TWO.*
            trainer/data/nl2_hu_b357_rank96_original_GTO_real_NL2_OOP_river_source.json
            trainer/docs/NL2_HU_B357_RANK96_TWO_GTO_REAL_NL2_OOP_RIVER_SOURCES.md
            trainer/nl2-audit/
          retention-days: 30
