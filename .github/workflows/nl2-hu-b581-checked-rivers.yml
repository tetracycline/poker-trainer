name: B581 verify CO three-bet caller rivers and full HU audit
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b581-checked-rivers.yml'
      - 'tools/hu_b581_checked_rivers.py'
      - 'tools/hu_b581_threebet_routes.cjs'
      - 'data/nl2_hu_b581_checked_river_inputs.json'
      - 'data/solver_evidence/NL2_B581_R261_*.zip'
permissions: {contents: read, actions: read}
jobs:
  verify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip -q install numpy phevaluator==0.5.3.1
      - name: Verify the original successful three-board replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=45141010324
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e '.head_sha == "ee0490cf9547f67ddb3c3677ed931b09a782bc74"' > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" | jq -e 'any(.jobs[].steps[]; .name == "Replay native source arrays and turn-specific measured locks" and .conclusion == "success")' > /dev/null
      - name: Rebuild both policies and compare the published evidence
        working-directory: trainer
        run: |
          set -euo pipefail
          python tools/hu_b581_checked_rivers.py --solver ../solver --run 45141010324
          git diff --exit-code -- data
          node tools/hu_b558_river_policy_view.cjs data/solver_evidence/reverified/rank261.json
