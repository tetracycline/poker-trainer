name: B835 archive two checked rank75 monotone originals
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b835-originals.yml'
      - 'tools/hu_b835_originals.py'
permissions: {contents: write, actions: read, pull-requests: read}
jobs:
  replay-audit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy phevaluator==0.5.3.1
      - name: Authenticate all B833 source pins and replay both policies twice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/hu_b835_originals.py --collect --archives "$RUNNER_TEMP/original"
          for seed in 23 867; do
            PYTHONHASHSEED="$seed" python tools/hu_b835_originals.py --archives "$RUNNER_TEMP/original" --solver pinned-solver --output "$RUNNER_TEMP/data-$seed"
          done
          diff -r "$RUNNER_TEMP/data-23" "$RUNNER_TEMP/data-867"
          git diff --exit-code -- data
      - name: Add original ZIPs and perform full certification plus UI audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          stage=Path(os.environ["RUNNER_TEMP"])/"data-23"
          paths=[]
          for src in sorted(stage.rglob("*")):
              if not src.is_file():continue
              dest=Path("data")/src.relative_to(stage)
              assert not dest.exists() and not dest.is_symlink()
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(src.read_bytes())
              paths.append(dest.as_posix())
          (Path(os.environ["RUNNER_TEMP"])/"candidate-paths.txt").write_text("\n".join(paths)+"\n")
          PY
          python tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/rebuilt.json"
          cmp data/nl2_hu_multiboard_status_current.json "$RUNNER_TEMP/rebuilt.json"
          git diff --exit-code -- data/nl2_hu_multiboard_status_current.json
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
          git fetch --quiet --no-tags --depth=1 origin d0fe026b3cd59b50450f99471bd27c55e7d4b522
          python tools/hu_b491_incremental_medium.py
          node tools/hu_b491_incremental_medium.cjs
          node tools/hu_b483_lock_medium_ui.cjs
          node tools/hu_b485_medium_viewers.cjs
          node tools/hu_b492_medium_tree_ui.cjs
          node tools/hu_b584_optional_river_ui.cjs
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/coverage.json"
      - name: Create single-parent audited candidate and keep PR as draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t paths < "$RUNNER_TEMP/candidate-paths.txt"
          python tools/hu_publish_candidate.py --message "B835 archive original QJo monotone negative controls" --paths "${paths[@]}" | tee "$RUNNER_TEMP/candidate.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B835-audited-candidate
          path: |
            ${{ runner.temp }}/candidate.txt
            ${{ runner.temp }}/candidate-paths.txt
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/data-23/nl2_hu_b835_results.json
          if-no-files-found: warn
          retention-days: 90
