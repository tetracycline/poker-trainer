name: TASK-HYBRID B212 rank71 6s4h2d original B207 GTO SHA genuine NL2 BB-OOP child + V38 581 HU2475 (max29m)
# Staged until B207 original GTO source and strict actor OOP combos
# actually PASS. No automatic source reuse without confirmed SHA.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Require original B207 full-size GTO source+pin and positive strict OOP river before even compiling new Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path('trainer/data')
          p=json.loads((d/'nl2_hu_b207_rank71_lmp_6s4h2d_gto_parent_pin.json').read_text())
          i=json.loads((d/'solver_evidence/NL2_MULTIBOARD_B207_R71_6S4H2D_GTO.index.json').read_text())
          assert p['schema']=='NL2_HU_B207_RANK71_LMP_6S4H2D_GTO_PARENT_PIN_V1'
          assert (p['source_run_id'],i['run_id'])==(44882288427,44882288427)
          assert p['target_rank']==71 and p['model_id']=='ln-iso-lmp_r_model-vlgh2t'
          assert (p['flop'],p['flop_line'],p['turn_line'])==('6s4h2d','b50 c','x b50 c')
          assert p['target_exact_actor_OOP_river_nodes']>0 and p['target_exact_actor_OOP_strict_combos']>0
          assert i['exact_target_actor_OOP_river_nodes']>0 and i['exact_target_actor_OOP_strict_combos']>0
          assert (i['gto_cases'],i['locked_cases'])==(1,0)
          assert p['original_gto_root_sha256']==i['original_parent_GTO_root_SHA256']
          assert p['original_gto_job_sha256']==i['original_parent_GTO_job_SHA256']
          assert p['original_gto_manifest_sha256']==i['original_parent_GTO_manifest_SHA256']
          print('PASS immutable original positive B207 GTO source pinned; actor BB OOP strict hero river')
          PY
          mkdir -p gto_parent
          gh run download 44882288427 --repo "$GITHUB_REPOSITORY" --name 'nl2-multiboard-B207_R71_LMP_6S4H2D-LMP_CO_BB-gto-6s4h2d' --dir gto_parent
          test -s gto_parent/evidence/LMP_CO_BB-gto-6s4h2d.json
          test -s gto_parent/solver/postflop/out/LMP_CO_BB/gto/6s4h2d_multiboard.json
          test -s gto_parent/solver/postflop/out/LMP_CO_BB/gto/6s4h2d_multiboard.job.json
      - name: Compile authentic pinned Rust backend after strict original GTO source gate
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_b212_lmp_rank71_turnonly.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve only true NL2 actor-OOP turn/rivers from unchanged SHA-pinned original B207 full GTO flop parent
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-engine-pin.txt
          python3 trainer/tools/solve_hu_b212_lmp_rank71_turnonly.py \
            --solver-root solver --gto-artifact-root gto_parent \
            --manifest evidence/LMP_CO_BB-exp_oop-6s4h2d.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B212_R71_6S4H2D-LMP_CO_BB-exp_oop-6s4h2d
          path: |
            evidence/
            solver/postflop/out/
          retention-days: 30
          if-no-files-found: warn
  verify-and-commit:
    needs: solve
    if: ${{ needs.solve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Download fresh authentic B212 Rust NL2 OOP partial source, not original GTO mislabeled EXP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=nl2-multiboard-B212_R71_6S4H2D-LMP_CO_BB-exp_oop-6s4h2d
          mkdir -p "downloads/$name"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
          test -s "downloads/$name/evidence/LMP_CO_BB-exp_oop-6s4h2d.json"
      - name: Independent verify exact 100bb original GTO SHA/SPR/rake, NL2 observed vs assumed partial locks, turn actor reach
        run: |
          set -euo pipefail
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py \
            --downloads downloads --solver-root solver --run-id "$GITHUB_RUN_ID" \
            --out trainer/data/solver_evidence/NL2_MULTIBOARD_B212_R71_6S4H2D_EXP_OOP.json
      - name: Seal genuine SHA NL2 OOP source, exact river actor and original positive B207 GTO, keep rank71 APPROX until independent 3-flop audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          d=pathlib.Path('trainer/data')
          p=d/'solver_evidence/NL2_MULTIBOARD_B212_R71_6S4H2D_EXP_OOP.json'
          v=json.loads(p.read_text())
          assert v['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert v['source_run_id']>0 and not v['errors'] and len(v['artifacts'])==1
          assert (v['exact_board_gto_sources'],v['imputed_pool_locked_sources'],v['new_authentic_board_cases'])==(0,1,1)
          a=v['artifacts'][0]
          assert not a['errors'] and (a['spot'],a['version'],a['flop'])==('LMP_CO_BB','exp_oop','6s4h2d')
          assert len(a['cases'])==1
          c=a['cases'][0]
          pin=json.loads((d/'nl2_hu_b207_rank71_lmp_6s4h2d_gto_parent_pin.json').read_text())
          gi=json.loads((d/'solver_evidence/NL2_MULTIBOARD_B207_R71_6S4H2D_GTO.index.json').read_text())
          assert (c['flop_line'],c['turn'])==('b50 c',pin['turn'])
          assert pin['target_exact_actor_OOP_river_nodes']>0 and gi['exact_target_actor_OOP_river_nodes']>0
          assert pin['original_gto_root_sha256']==gi['original_parent_GTO_root_SHA256']
          hero=[n for n in c['nodes'] if n['exact_node_line']=='b50 c/x b50 c/' and
                n['acting_seat']==0 and n['strictly_reachable_combos']>0]
          raw=p.read_bytes();gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          sha=lambda x:hashlib.sha256(x).hexdigest()
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
            batch='B212_R71_6S4H2D_EXP_OOP',run_id=v['source_run_id'],
            actual_spot_flop_version_jobs=1,verified_cases=1,
            gto_cases=0,locked_cases=1,
            source_sha256=sha(raw),gzip_sha256=sha(gz.read_bytes()),
            original_gto_parent_run=44882288427,
            original_parent_GTO_root_SHA256=pin['original_gto_root_sha256'],
            original_parent_GTO_job_SHA256=pin['original_gto_job_sha256'],
            original_parent_GTO_manifest_SHA256=pin['original_gto_manifest_sha256'],
            original_B207_full_GTO_flop_not_recomputed=True,
            original_limped_169class_preflop_ASSUMED=True,
            exact_actor_OOP_river_nodes=len(hero),
            exact_actor_OOP_strict_combos=sum(n['strictly_reachable_combos'] for n in hero),
            exact_action_line='b50 c/x b50 c/',
            flop='6s4h2d',turn=pin['turn'],rank=71,
            no_private_card_conditional_NL2_observation_claim=True,
            generic_model_certification=0,immediate_CERT_upgrades=0,
            strict_failure_reason=None if hero else 'NO_STRICT_MATCHED_OOP_RIVER_NL2_COMBOS_KEEP_APPROX')
          p.with_suffix('.index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          print('PASS original B207 true GTO verified and fresh B212 NL2 actor OOP source; no false CERT',idx)
          PY
      - name: Full 151 CERT /241 APPROX 581 distinct existing named boards, all NL2 pooled/assumed/unknown locks and 131 exact b50 candidates
        working-directory: trainer
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v38_b206_rank190.json --out nl2-audit/lock-medium.json
          python3 - <<'PY'
          import json
          x=json.load(open('nl2-audit/lock-medium.json'))
          assert (x['cert_multiboard'],x['approx'],x['EST'])==(151,241,0)
          assert x['aggregate']['named_board_proofs']==581
          assert x['aggregate']['paired_hero_locked_source_variants']>=670
          assert x['aggregate']['board_examples_with_b50_candidate']>=132
          assert x['not_generalized_handclass_GTO'] and x['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS HU 2475/2475")'
      - name: Commit fresh authentic rank71 NL2 OOP source to PR#2 Draft only, never merge
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B212_R71_6S4H2D_EXP_OOP.json.gz data/solver_evidence/NL2_MULTIBOARD_B212_R71_6S4H2D_EXP_OOP.index.json
          git commit -m 'TASK-HYBRID B212: real rank71 6s4h2d NL2 actor OOP Rust turn-river child pinned to immutable positive B207 GTO, full 581 lock/2475 HU audit'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B212-rank71-genuine-NL2-actor-OOP-SHA-2475
          path: |
            trainer/data/solver_evidence/NL2_MULTIBOARD_B212_R71_6S4H2D_EXP_OOP.*
            trainer/nl2-audit/
          retention-days: 30
