name: TASK-HYBRID B25 frozen LMP three texture flops, exact 50pct paired GTO+hero lock (max29m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b25-lmp-three-textures.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {spot: LMP_CO_BB, flop: 8s8h3d, version: gto}
          - {spot: LMP_CO_BB, flop: 8s8h3d, version: exp_oop}
          - {spot: LMP_CO_BB, flop: Ks7s2s, version: gto}
          - {spot: LMP_CO_BB, flop: Ks7s2s, version: exp_oop}
          - {spot: LMP_CO_BB, flop: Js9h4d, version: gto}
          - {spot: LMP_CO_BB, flop: Js9h4d, version: exp_oop}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Python exact source syntax gate and pinned Rust CFR compile
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_multiboard_100bb.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve authentic 100bb LMP named-flop b50-call GTO or hero-OOP lock in restricted tree
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot "${{ matrix.spot }}" --flop "${{ matrix.flop }}" \
            --version "${{ matrix.version }}" --flop-size-profile lmp-50-only \
            --flop-line-policy oop-b50only --turn-count 1 \
            --manifest "evidence/${{ matrix.spot }}-${{ matrix.flop }}-${{ matrix.version }}.json"
      - name: Preserve immutable Rust source, even if solve fails or no legal combos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B25_LMP_TEXTURES-${{ matrix.spot }}-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: ${{ needs.solve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - name: Fetch exactly 6 immutable original Rust solve artifacts, separately report zero-reach cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloads
          test "$(find downloads -mindepth 1 -maxdepth 1 -type d -name 'nl2-multiboard-B25_LMP_TEXTURES-*' | wc -l)" -eq 6
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py --downloads downloads --solver-root solver --run-id "$GITHUB_RUN_ID" \
            --out trainer/data/solver_evidence/NL2_MULTIBOARD_B25_LMP_TEXTURES.json
      - name: Freeze all 6 independent source jobs; do not claim CERT from unsupported card path
        run: |
          python3 - <<'PY'
          import pathlib,gzip,json,hashlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B25_LMP_TEXTURES.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert not d['errors'] and len(d['artifacts'])==6
          assert sum(x['version']=='gto' for x in d['artifacts'])==3
          assert sum(x['version']=='exp_oop' for x in d['artifacts'])==3
          assert d['exact_board_gto_sources']>=1 and d['imputed_pool_locked_sources']>=1
          assert all(not x['errors'] and x['flop'] in ('8s8h3d','Ks7s2s','Js9h4d') for x in d['artifacts'])
          raw=p.read_bytes();gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
              run_id=d['source_run_id'],batch='B25_LMP_TEXTURES',
              actual_spot_flop_version_jobs=6,verified_cases=d['new_authentic_board_cases'],
              gto_cases=d['exact_board_gto_sources'],locked_cases=d['imputed_pool_locked_sources'],
              source_sha256=hashlib.sha256(raw).hexdigest(),
              gzip_sha256=hashlib.sha256(gz.read_bytes()).hexdigest(),
              generic_model_certification=0,
              exact_menu='Flop 50pct only: authentic restricted-game CFR under explicit assumed 169-class LMP ranges. NOT unrestricted NL2 GTO.')
          p.with_suffix('.index.json').write_text(json.dumps(idx,indent=2,ensure_ascii=False)+'\n')
          p.unlink()
          print('PASS true restricted-tree LMP GTO+EXP source',idx)
          PY
      - name: Reclassify source-proved 392 only; audit every CERT node lock and b50 candidate
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 tools/hu_multiboard_consolidate.py --root data --out data/nl2_hu_multiboard_status.json --doc docs/NL2_HU_MULTIBOARD_STATUS.md
          python3 tools/hu_highfreq_shortfalls.py data data/nl2_hu_highfreq_shortfalls.json
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status.json --out data/nl2_hu_cert_lock_medium_audit.json
          python3 tools/hu_cert_lock_medium_coverage_matrix.py
          python3 - <<'PY'
          import json
          s=json.load(open('data/nl2_hu_multiboard_status.json'))
          g=json.load(open('data/nl2_hu_highfreq_shortfalls.json'))
          a=json.load(open('data/nl2_hu_cert_lock_medium_audit.json'))
          assert s['CERT_MULTIBOARD']>=22 and s['CERT_MULTIBOARD']+s['APPROX']==392
          assert s['independently_verified_completed_batches']['B25_LMP_TEXTURES']['authentic_jobs']==6
          assert g['certified_from_source']==s['CERT_MULTIBOARD']==a['cert_multiboard']
          print('PASS B25 true restricted-source certification',s['CERT_MULTIBOARD'],s['APPROX'])
          PY
      - name: Push independently verified named-board source and audit to PR #2 Draft, never merge
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B25_LMP_TEXTURES.index.json data/solver_evidence/NL2_MULTIBOARD_B25_LMP_TEXTURES.json.gz data/nl2_hu_multiboard_status.json data/nl2_hu_highfreq_shortfalls.json data/nl2_hu_cert_lock_medium_audit.json docs/NL2_HU_MULTIBOARD_STATUS.md data/nl2_hu_cert_lock_medium_matrix.json docs/NL2_HU_CERT_LOCK_MEDIUM_MATRIX.md
          git commit -m 'TASK-HYBRID B25: verify three frozen LMP paired/monotone/JT flops; exact actor/SPR/strict combo and hero locks'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - name: Retain exact root source if verification/push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B25-verified-LMP-textures
          path: trainer/data/solver_evidence/NL2_MULTIBOARD_B25_LMP_TEXTURES*
          retention-days: 30
