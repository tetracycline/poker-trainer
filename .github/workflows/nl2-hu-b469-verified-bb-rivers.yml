name: B469 certify verified BTN-BB river sources and audit all certified models
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b469-verified-bb-rivers.yml']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original solver arrays and publish only source-backed boards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/hu_b469_recover_sources.py
          python3 tools/hu_b469_btn_bb_promotion.py
          python3 tools/hu_b469_btn_bb_promotion.py --verify
          node tools/hu_b469_btn_bb_routes.cjs
          python3 tools/hu_apply_cert_extensions.py --out /tmp/current.json
          node tools/hu_extension_runtime_test.cjs /tmp/current.json
          bash tools/hu_exact_batch_audit.sh /tmp/current.json
      - uses: actions/upload-artifact@v4
        with:
          name: B469-authenticated-originals
          path: data/solver_evidence/b466/
          if-no-files-found: error
      - name: Preserve originals and publish current cumulative status
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/b466/ data/solver_evidence/extensions/rank48.json data/solver_evidence/extensions/rank52.json
          git add 'data/solver_evidence/NL2_MULTIBOARD_R48_*.json.gz' 'data/solver_evidence/NL2_MULTIBOARD_R52_*.json.gz' data/nl2_hu_b469_btn_bb_strict_rivers.json
          if ! git diff --cached --quiet; then
            git commit -m 'B469: retain the authenticated original paired sources for BB 33% and 75% river decisions'
          fi
          # The shared publisher recomputes these derived files against the eventual branch head.
          git restore --worktree data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json data/nl2_hu_verified_extensions.json
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then break; fi
            test "$attempt" != 3
          done
          bash tools/hu_publish_cert_extensions.sh
