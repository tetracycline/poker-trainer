name: TASK-HYBRID S diagnose exact LMP and b66 river gaps, no source invention
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-s-frozen-gaps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Audit current SHA-indexed true CFR source for rank 1 and 24 only
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_frozen_model_gap_diagnostic.py
          python3 tools/hu_frozen_model_gap_diagnostic.py
          python3 - <<'PY'
          import json
          d=json.load(open('data/nl2_hu_rank1_24_exact_source_diagnostic.json'))
          s=json.load(open('data/nl2_hu_multiboard_status.json'))
          assert d['schema']=='TASK_HYBRID_FROZEN_1_AND_24_SOURCE_GAP_DIAG_V1'
          assert len(d['cases'])==2 and d['total_CERT']==s['CERT_MULTIBOARD']
          assert all(x['current_label']=='APPROX' and x['not_a_CERT_upgrade'] for x in d['cases'])
          print('PASS exact-source refusal gate; no generic model promotion')
          PY
      - name: Commit bounded no-upgrade diagnostic to PR #2 only, remain Draft
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_rank1_24_exact_source_diagnostic.json
          git commit -m 'TASK-HYBRID S: source-grounded gap evidence for top ranks 1 and 24, no CERT'
          for retry in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$retry"
          done
          exit 1
      - name: Preserve diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-S-rank1-rank24-source-gap
          path: data/nl2_hu_rank1_24_exact_source_diagnostic.json
          retention-days: 30
