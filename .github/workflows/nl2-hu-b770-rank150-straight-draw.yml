name: B770 verify the B733 paired-seven root and recover the missing rank150 branch
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b770-rank150-straight-draw.yml'
      - 'tools/hu_b770_rank150_straight_draw.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the B733 source, suited 65 hands and the current rank150 route
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b770_rank150_straight_draw.py --preflight --solver pinned-solver --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Export the missing third-pot turn ranges and match all 37 B733 root nodes
        run: |
          python tools/hu_b770_rank150_straight_draw.py --solver pinned-solver --checkpoint-only \
            --output "$RUNNER_TEMP/b770-root" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - name: Preserve the verified original root and newly extracted ranges
        uses: actions/upload-artifact@v4
        with:
          name: B770-root-R150-7s7h4d
          path: ${{ runner.temp }}/b770-root
          if-no-files-found: error
          retention-days: 90
      - name: Solve the missing turn branches and replay each supported CO and BB deal
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b770-source"
          python tools/hu_b770_rank150_straight_draw.py --solver pinned-solver --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver --checkpoint "$RUNNER_TEMP/b770-root"
          cp "$folder/proof.json" "$RUNNER_TEMP/original-proof"
          python tools/hu_b770_rank150_straight_draw.py --solver pinned-solver --output "$folder"
          cmp "$RUNNER_TEMP/original-proof" "$folder/proof.json"
          cmp "$RUNNER_TEMP/b770-root/flop/job.json" "$folder/flop/job.json"
          cmp "$RUNNER_TEMP/b770-root/flop/result.json" "$folder/flop/result.json"
      - name: Preserve the conditional jobs and original decisions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B770-R150-7s7h4d
          path: ${{ runner.temp }}/b770-source
          if-no-files-found: error
          retention-days: 90
