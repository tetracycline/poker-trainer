name: TASK-HYBRID B108 real original B2 CO_BB Js9h4d actor-IP turn NL2 lock (max28m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b108-co-xb100-river.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Download ONLY the B107 independently verified B2 original CO_BB GTO (ignore original failed SB3 job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p gto_parent
          gh run download 44666290556 --repo "$GITHUB_REPOSITORY"             --name nl2-multiboard-B2-CO_BB-gto-Js9h4d --dir gto_parent
          test -s gto_parent/evidence/CO_BB-gto-Js9h4d.json
          test -s gto_parent/solver/postflop/out/CO_BB/gto/Js9h4d_multiboard.json
          test -s gto_parent/solver/postflop/out/CO_BB/gto/Js9h4d_multiboard.job.json
      - name: Build pinned authentic Rust postflop engine with unchanged original GTO root
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_b108_co_turnonly_b2.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve ONLY turn Ts x-b100-call plus river with genuine NL2 partial IP lock, no flop re-solve
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-engine-pin.txt
          python3 trainer/tools/solve_hu_b108_co_turnonly_b2.py             --solver-root solver --gto-artifact-root gto_parent             --manifest evidence/CO_BB-Js9h4d-xb33c-exp_ip.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B108_CO_XB33_XB100-CO_BB-exp_ip-Js9h4d
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-and-commit:
    needs: solve
    if: ${{ needs.solve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch only one B108 original pinned Rust source, no unrelated failed B2 job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='nl2-multiboard-B108_CO_XB33_XB100-CO_BB-exp_ip-Js9h4d'
          mkdir -p "downloads/$name"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
          test -s "downloads/$name/evidence/CO_BB-Js9h4d-xb33c-exp_ip.json"
          test "$(find downloads -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
      - name: Independently verify SHA, full 3-token flop and turn prefix, true actor-IP/SPR/rake and strict legal reach
        run: |
          set -euo pipefail
          mkdir -p trainer/data/solver_evidence
          python3 -m py_compile trainer/tools/verify_hu_multiboard_100bb.py
          python3 trainer/tools/verify_hu_multiboard_100bb.py             --downloads downloads --solver-root solver --run-id "$GITHUB_RUN_ID"             --out trainer/data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.json
      - name: Archive ONLY authentic strict IP hero river node in x-b33c/x-b100c, attach source SHA and prior B2 failure disclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert not d['errors'] and len(d['artifacts'])==1
          assert d['exact_board_gto_sources']==0
          assert d['imputed_pool_locked_sources']==d['new_authentic_board_cases']>=1
          a=d['artifacts'][0]
          assert (a['spot'],a['version'],a['flop'])==('CO_BB','exp_ip','Js9h4d')
          assert not a['errors'] and len(a['cases'])==1
          c=a['cases'][0]
          assert (c['flop_line'],c['turn'])==('x b33 c','Ts')
          hero=[n for n in c['nodes'] if n['acting_seat']==1 and
             n['exact_node_line']=='x b33 c/x b100 c/x' and n['strictly_reachable_combos']>0]
          assert hero, 'No genuine exact IP river decision for rank215/220; cannot certify'
          assert all(n['public_board'] for n in hero)
          raw=p.read_bytes()
          gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
             batch='B108_CO_XB33_XB100',run_id=d['source_run_id'],
             actual_spot_flop_version_jobs=1,
             verified_cases=d['new_authentic_board_cases'],
             gto_cases=0,locked_cases=d['imputed_pool_locked_sources'],
             source_sha256=hashlib.sha256(raw).hexdigest(),
             gzip_sha256=hashlib.sha256(gz.read_bytes()).hexdigest(),
             generic_model_certification=0,
             original_gto_parent_run=44666290556,
             original_parent_GTO_root_SHA256='1e55a710787d36d684eaa03a5c3f7a5abc89eb85b0df4c7906cc27a76922b47d',
             original_B107_parent_manifest_SHA256='113506aa83161e8a3ad8dd98875023c75f8ec4a51e610ba02ea7ab5485fcee52',
             B2_whole_workflow_failed_unrelated_source=True,
             B2_PARTIAL_individual_GTO_was_independently_verified=True,
             original_GTO_flop_NOT_recomputed=True,
             exact_ip_hero_river_actor_nodes=len(hero),
             frozen_rank_targets=[215,220],
             immediate_CERT_upgrades=0)
          p.with_suffix('.index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          print('PASS B108 one true pinned B2 CO_BB IP turn+river Rust lock; no false-GTO whole workflow claim',idx)
          PY
      - name: Commit only independently verified B108 authentic source to Draft PR#2, never merge
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.json.gz data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.index.json
          git commit -m 'TASK-HYBRID B108: CO_BB Js9h4d genuine IP NL2 lock on pinned B2 GTO flop, actor and SHA verified'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B108-original-B2-genuine-IP
          path: |
            trainer/data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100*
          retention-days: 30
