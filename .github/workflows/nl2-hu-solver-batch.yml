        - {spot: BB3_BTN, start: 8, count: 2, version: exp_oop}
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      SPOT: ${{ matrix.spot }}
      START: ${{ matrix.start }}
      COUNT: ${{ matrix.count }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: trainer
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: main
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install numpy matplotlib
      - name: Checkout exact external Rust CFR engine
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
      - name: Build solver driver (legacy upstream Rust lint compatibility)
        working-directory: solver/postflop/pfdriver
        env:
          RUSTFLAGS: '-A dangerous_implicit_autorefs'
          CARGO_BUILD_JOBS: '2'
        run: cargo build --release --locked
      - name: Run real CFR solve and emit hash manifest (no fabricated NL2 cells)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-commit.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/engine-commit.txt
          python trainer/tools/solve_hu_batch.py \
            --solver-root solver --spot "$SPOT" --start "$START" --count "$COUNT" \
            --version "$VERSION" --manifest evidence/solver-manifest.json
      - name: Preserve raw CFR output and reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-real-solver-${{ env.SPOT }}-${{ env.VERSION }}-${{ env.START }}
          path: |
            evidence/
            solver/postflop/out/
          retention-days: 30
          if-no-files-found: warn
