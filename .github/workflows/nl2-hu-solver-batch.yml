name: NL2 authentic HU solver batch (GitHub-hosted 16GB)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/solve_hu_batch.py'
      - '.github/workflows/nl2-hu-solver-batch.yml'
  pull_request:
    paths:
      - 'tools/solve_hu_batch.py'
      - '.github/workflows/nl2-hu-solver-batch.yml'
  workflow_dispatch:
    inputs:
      start:
        description: 'First deterministic representative flop index'
        required: true
        default: '0'
      count:
        description: 'Number of flops in this batch'
        required: true
        default: '1'
      version:
        description: 'GTO or solved opponent-locked BR'
        type: choice
        options: [gto, exp_ip, exp_oop]
        default: gto

concurrency:
  group: nl2-hu-solver-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  authentic-solver:
    # Public repository's standard Linux GitHub-hosted runner: 4 vCPU / 16 GB RAM.
    # Each job solves one flop at a time; raw JSON is uploaded as resumable artifact.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - {spot: BTN_BB, start: 0, count: 2, version: gto}
        - {spot: BTN_BB, start: 0, count: 2, version: exp_ip}
        - {spot: BTN_BB, start: 0, count: 2, version: exp_oop}
