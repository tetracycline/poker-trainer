name: B500 rank71 half-pot river leads on three additional BB versus CO limp boards
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b500-rank71-half-pot-leads.yml']
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [LMP_CO_BB_3c3d4h_7h, LMP_CO_BB_5c5d2h_Kc, LMP_CO_BB_2c2d4h_4c]
        version: [gto, exp_oop]
    env:
      GROUP: ${{ matrix.group }}
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          git clone https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd pinned-solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve conditional GTO or measured street-specific NL2 from the original boundary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originals"
          for id in $(python3 tools/hu_b492_half_pot_leads.py --batch B500 --group "$GROUP" --list-artifacts); do
            ln -s "$GITHUB_WORKSPACE/data/solver_evidence/B496_$id.zip" "$RUNNER_TEMP/originals/$id.zip"
          done
          python3 tools/hu_b492_half_pot_leads.py --batch B500 --group "$GROUP" --version "$VERSION" --solver pinned-solver \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver --originals "$RUNNER_TEMP/originals" \
            --work "$RUNNER_TEMP/result" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: B500-source-${{ matrix.group }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/result/outcome.json
            ${{ runner.temp }}/result/NL2_B500_*.zip
          if-no-files-found: error
          retention-days: 90
  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: B500-source-*
          path: ${{ runner.temp }}/b500-gate
      - name: Authenticate original ranges and jobs, conditional output, legal pairs and exact half-pot edge
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originals"
          for id in $(python3 tools/hu_b492_half_pot_leads.py --batch B500 --list-artifacts); do
            ln -s "$GITHUB_WORKSPACE/data/solver_evidence/B496_$id.zip" "$RUNNER_TEMP/originals/$id.zip"
          done
          python3 tools/hu_b492_half_pot_leads.py --batch B500 --assemble --solver pinned-solver --originals "$RUNNER_TEMP/originals" \
            --work "$RUNNER_TEMP/b500-gate" --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_b492_half_pot_leads.py --batch B500 --verify-published
      - uses: actions/upload-artifact@v4
        with:
          name: B500-conditional-source-comparison
          path: |
            data/nl2_hu_b500_half_pot_leads.json
            data/solver_evidence/NL2_B500_*.zip
            data/solver_evidence/NL2_MULTIBOARD_B500_*.json.gz
          if-no-files-found: error
          retention-days: 90
      - name: Full exact audit and publish paired comparison to the live draft branch
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          files=(data/nl2_hu_b500_half_pot_leads.json data/solver_evidence/NL2_B500_*.zip data/solver_evidence/NL2_MULTIBOARD_B500_*.json.gz)
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add --quiet --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              python3 tools/hu_b492_half_pot_leads.py --batch B500 --verify-published
              node tools/hu_b492_medium_tree_ui.cjs
              node tools/hu_b492_medium_tree_ui.cjs data/nl2_hu_b500_half_pot_leads.json data/nl2_hu_multiboard_status_current.json
              node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
              bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
              git add -f -- "${files[@]}"
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B500: publish source-checked conditional half-pot results on three rank71 river boards'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
