name: B908 archive repairs and review exact prior source jobs
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b908_source_review.py'
      - '.github/workflows/nl2-hu-b908-source-review.yml'
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [8h7h3c, 7h6h2c, 9d7h4c]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Rebuild frozen job with independent held-out observations and inspect exact historic sources
        env:
          GH_TOKEN: ${{ github.token }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b908_source_review.py review "$RUNNER_TEMP/b908-review" pinned-solver "$FLOP"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: B908-review-${{ matrix.flop }}
          path: ${{ runner.temp }}/b908-review
          if-no-files-found: error
          retention-days: 90
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions: {contents: write, actions: read, pull-requests: read}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate four original repair ZIPs and job receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b908_source_review.py prepare "$RUNNER_TEMP/b908-archive"
      - name: Full static model route and exact board audit
        run: |
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
      - name: Create detached archive candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/hu_b908_source_review.py publish "$RUNNER_TEMP/b908-archive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B908-detached-archive
          path: ${{ runner.temp }}/b908-archive
          if-no-files-found: warn
          retention-days: 90
  receipt:
    needs: [review, archive]
    if: always()
    permissions: {actions: read, pull-requests: write, contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record source run once (no ref mutation)
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ needs.review.result }}
          ARCHIVE: ${{ needs.archive.result }}
        run: |
          set -euo pipefail
          state=$(gh api repos/tetracycline/poker-trainer/pulls/2 --jq '[.state,.draft,.merged,.head.ref,.head.repo.full_name]|@tsv')
          test "$state" = "$(printf 'open\ttrue\tfalse\tfix/nl2-hu-lines-audit-20261118\ttetracycline/poker-trainer')"
          gh api repos/tetracycline/poker-trainer/issues/2/comments -f body="B908 source receipt: head $GITHUB_SHA; run $GITHUB_RUN_ID; review=$REVIEW; archive=$ARCHIVE. No certification or ref update. Read source artifacts before use."
