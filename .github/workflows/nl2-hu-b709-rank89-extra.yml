name: B709 solve new rank89 flops after authentic paired-high-turn positives
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b709-rank89-extra.yml'
      - 'tools/hu_b709_rank89_extra.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [Td8c3h, Jh7d4c, Qc9s5d]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify pinned staged prices, original ranges and all three-street UI witnesses
        env:
          FLOP: ${{ matrix.flop }}
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b709_rank89_extra.py
          node tools/hu_b696_turn_call_routes.cjs \
            --model-file tools/staged/hu_b696_nl2_hu_model.js > "$RUNNER_TEMP/b709-routes.json"
          python tools/hu_b709_rank89_extra.py --solver pinned-solver --flop "$FLOP" \
            --routes "$RUNNER_TEMP/b709-routes.json" --output "$RUNNER_TEMP/preflight" --preflight
          git diff --exit-code -- nl2_hu_model.js nl2.js tools/hu_trainer_route_contract.cjs data/
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve new original roots and only strict reachable river GTO and actor locks
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
          PYTHONDONTWRITEBYTECODE: 1
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b709-source"
          python tools/hu_b709_rank89_extra.py --solver pinned-solver --flop "$FLOP" \
            --routes "$RUNNER_TEMP/b709-routes.json" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$folder/proof.json" "$RUNNER_TEMP/b709-original-proof.json"
          python tools/hu_b709_rank89_extra.py --solver pinned-solver --flop "$FLOP" \
            --routes "$RUNNER_TEMP/b709-routes.json" --output "$folder"
          cmp "$folder/proof.json" "$RUNNER_TEMP/b709-original-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B709-R89-${{ matrix.flop }}
          path: ${{ runner.temp }}/b709-source
          if-no-files-found: error
          retention-days: 90
