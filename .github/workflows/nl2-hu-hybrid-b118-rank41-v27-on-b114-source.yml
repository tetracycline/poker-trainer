name: TASK-HYBRID B118 verified B114 rank41 V27 138 CERT and 542 exact board locked medium proofs (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'data/solver_evidence/NL2_MULTIBOARD_B114_R41_CO_XX.index.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-promote-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify SHA-locked B114 genuine GTO+actor-IP source, only then build V27 and 542 precise source-backed lock/50pct rows
        run: |
          set -euo pipefail
          test -s data/solver_evidence/NL2_MULTIBOARD_B114_R41_CO_XX.index.json
          test -s data/solver_evidence/NL2_MULTIBOARD_B114_R41_CO_XX.json.gz
          python3 -m py_compile tools/hu_b118_v27_rank41.py tools/hu_multiboard_promote.py tools/hu_cert_lock_medium_coverage_matrix.py
          python3 tools/hu_b118_v27_rank41.py
      - name: Promote V27 in both browser loaders, never overwrite V26 fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          val=''' const v27=d=>{
             if(d.schema!=='NL2_HU_392_MULTIBOARD_CERT_STATUS_V27_B118_RANK41'||
                d.CERT_MULTIBOARD!==138||d.APPROX!==254||d.TOTAL!==392||
                d.EST!==0||d.original_top24_cutoff_unchanged!==true||
                String(d.source_blind_expansion_ranks)!=='41'||
                d.supplementary_cert_count!==114||
                d.b118_rank41_certificate?.model_id!=='ln-ipfr-t_model-sxr0qa'||
                d.independently_verified_completed_batches?.B114_R41_CO_XX?.status!=='VERIFIED'||
                Object.keys(d.records||{}).length!==392)
                throw Error('V27 exact source-blind rank41 actor-IP proof invalid');
             return d;
           };
          '''
          v26=" const v26=d=>{"
          old=" return fetch('data/nl2_hu_multiboard_status_v26_b111_rank215_220.json',{cache:'no-store'}).then(open).then(v26)"
          new=" return fetch('data/nl2_hu_multiboard_status_v27_b118_rank41.json',{cache:'no-store'}).then(open).then(v27)\n   .catch(()=>fetch('data/nl2_hu_multiboard_status_v26_b111_rank215_220.json',{cache:'no-store'}).then(open).then(v26))"
          for name in ('nl2-multiboard.js','nl2_hu_multiboard_ui.js'):
              p=Path(name);s=p.read_text()
              assert s.count(v26)==1 and s.count(old)==1 and 'const v27=d=>' not in s
              s=s.replace(v26,val+v26).replace(old,new)
              p.write_text(s)
          PY
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independent V26 immutable and V27 392 cells plus exact source evidence checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          B='data/nl2_hu_multiboard_status_v26_b111_rank215_220.json'
          P='data/nl2_hu_multiboard_status_v27_b118_rank41.json'
          M='data/nl2_hu_cert_lock_medium_matrix_v27.json'
          F='data/nl2_hu_b112_all_approx_frozen_frequency_gaps.json'
          base=json.load(open(B));new=json.load(open(P));matrix=json.load(open(M))
          assert new['parent_v26_sha256']==hashlib.sha256(open(B,'rb').read()).hexdigest()
          assert new['B112_frozen_gap_sha256']==hashlib.sha256(open(F,'rb').read()).hexdigest()
          assert (base['CERT_MULTIBOARD'],base['APPROX'])==(137,255)
          assert (new['CERT_MULTIBOARD'],new['APPROX'],new['EST'])==(138,254,0)
          changed=[k for k in base['records'] if base['records'][k]!=new['records'][k]]
          assert changed==['ln-ipfr-t_model-sxr0qa']
          c=new['records'][changed[0]]
          assert len(c['certified_3_to_5_exact_flop_boards'])==3
          assert {b['flop'] for b in c['certified_3_to_5_exact_flop_boards']}=={'8s8h3d','As9h2d','Js9h4d'}
          assert all(b['strict_full_street_combo_reachable']>0 and b['nl2_locked_variants'] for b in c['certified_3_to_5_exact_flop_boards'])
          assert len(matrix['boards'])==542 and len(matrix['models'])==138
          assert matrix['parent_v27_status_sha256']==hashlib.sha256(open(P,'rb').read()).hexdigest()
          assert all(b['hero_lock_proofs'] and b['strictly_reachable_combo_count']>0 for b in matrix['boards'])
          e=new['independently_verified_completed_batches']['B4_MICRO']
          assert e['status']=='VERIFIED' and e['run_id']==44732810327
          print('PASS rank41 V27 138 CERT / 254 APPROX, 542 authentic per-board source lock/50pct rows')
          PY
      - name: Full HU 2475 river links and four independent navigation/actor checks
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts; if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1); console.log("PASS 2475/2475")'
      - name: Frontend V27 and V26 fallback exact file paths on both viewers
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const names=['nl2-multiboard.js','nl2_hu_multiboard_ui.js'];
          for(const name of names){
            const s=fs.readFileSync(name,'utf8');
            assert(s.includes('function fetchCertifiedRegistry(){'));
            assert(s.includes("fetch('data/nl2_hu_multiboard_status_v27_b118_rank41.json'"));
            assert(s.includes(".catch(()=>fetch('data/nl2_hu_multiboard_status_v26_b111_rank215_220.json'"));
            assert(s.includes("d.CERT_MULTIBOARD!==138||d.APPROX!==254"));
            assert(s.includes("const v26=d=>{"));
          }
          console.log('PASS both latest V27 and immutable V26 fallback loaders');
          JS
      - name: Commit independently audited V27, exact sources, 542 lock and 50pct rows to PR2 Draft; NEVER merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v27_b118_rank41.json data/nl2_hu_cert_lock_medium_matrix_v27.json docs/NL2_HU_B118_V27_RANK41_AUTHENTIC_CERT.md docs/NL2_HU_B118_V27_ALL_CERT_LOCKS_MEDIUM.md nl2-multiboard.js nl2_hu_multiboard_ui.js
          git commit -m 'TASK-HYBRID B118: independently certify 3 genuine CO_BB rank41 boards V27 138 CERT/254 APPROX, 542 actor locks and medium evidence, full HU audit'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B118-V27-source-guard-audit
          path: |
            data/nl2_hu_multiboard_status_v27_b118_rank41.json
            data/nl2_hu_cert_lock_medium_matrix_v27.json
            docs/NL2_HU_B118_V27_RANK41_AUTHENTIC_CERT.md
            docs/NL2_HU_B118_V27_ALL_CERT_LOCKS_MEDIUM.md
            nl2-audit/
          retention-days: 30
