name: TASK-HYBRID B67 rank40 three true GTO+hero-IP flops V9 57 CERT/335 APPROX all locks
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b67-rank40-v9.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independently-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check original 44809135555 Rust artifact SHA and B66, B48 preregistered rank40 strict GTO/hero-IP pairing
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b67_rank40_v9.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b67_rank40_v9.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independent 57/335, exact three boards, 222 locks, Batch E, rank41 exclusion, 2475 rivers and V9-V1 fallback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          original=json.load(open('data/nl2_hu_multiboard_status_v8_batch61.json'))
          v9path='data/nl2_hu_multiboard_status_v9_rank40_b67.json'
          upgraded=json.load(open(v9path))
          matrix=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v9_rank40_b67.json'))
          source=json.load(open('data/nl2_hu_b66_rank40_source_reverification.json'))
          b64=json.load(open('data/nl2_hu_b64_rank41_unmatched_hero_node.json'))
          nav=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert (original['CERT_MULTIBOARD'],original['APPROX'])==(56,336)
          assert (upgraded['CERT_MULTIBOARD'],upgraded['APPROX'],upgraded['TOTAL'])==(57,335,392)
          assert upgraded['parent_v8_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v8_batch61.json','rb').read()).hexdigest()
          assert upgraded['authenticated_b66_verification_sha256']==hashlib.sha256(open('data/nl2_hu_b66_rank40_source_reverification.json','rb').read()).hexdigest()
          changed={k for k in upgraded['records'] if upgraded['records'][k]!=original['records'][k]}
          assert changed=={'ln-ipc-t_model-188b2d5'}
          assert upgraded['added_cert_rank']==40 and upgraded['source_blind_expansion_ranks']==[40]
          assert upgraded['records']['ln-ipfr-t_model-sxr0qa']==original['records']['ln-ipfr-t_model-sxr0qa']
          assert upgraded['records']['ln-ipfr-t_model-sxr0qa']['label']=='APPROX'
          assert b64['status']=='PASS_EXCLUSION' and b64['new_EXP_IP_source_hero_nodes']==0
          assert source['status']=='ELIGIBLE_FOR_NEW_VERSION' and source['eligible_for_separate_cert_version']
          assert matrix['CERT_MULTIBOARD']==57 and matrix['APPROX']==335
          assert len(matrix['models'])==57 and len(matrix['boards'])==222
          assert matrix['strict_aggregate']['named_board_proofs']==222
          assert matrix['parent_v9_sha256']==hashlib.sha256(open(v9path,'rb').read()).hexdigest()
          assert all(b['hero_lock_proofs'] and b['strictly_reachable_combo_count']>0 and
                     b['no_general_bet_size_recommendation'] for b in matrix['boards'])
          assert upgraded['independently_verified_completed_batches']['B4_MICRO']['run_id']==44732810327
          assert upgraded['independently_verified_completed_batches']['B66_SB_B100_IP']['run_id']==44809135555
          assert nav['continuing']==nav['reach_river']==2475 and nav['share_pct']==100
          assert nav['missing_river']==nav['link_misses']==nav['reach_violations']==nav['modeled_path_violations']==0
          print('PASS B67 V9 57 CERT/335 APPROX, 222 exact locks, rank41 stays APPROX and 100pct river')
          PY
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const files=['data/nl2_hu_multiboard_status_v9_rank40_b67.json',
           'data/nl2_hu_multiboard_status_v8_batch61.json',
           'data/nl2_hu_multiboard_status_v7_batch59.json',
           'data/nl2_hu_multiboard_status_v6_rank33.json',
           'data/nl2_hu_multiboard_status_v5_batch55.json',
           'data/nl2_hu_multiboard_status_v4_batch50.json',
           'data/nl2_hu_multiboard_status_v3_rank28.json',
           'data/nl2_hu_multiboard_status_v2_tie.json',
           'data/nl2_hu_multiboard_status.json'];
          const data=files.map(x=>JSON.parse(fs.readFileSync(x,'utf8')));
          async function check(path){
            const s=fs.readFileSync(path,'utf8');
            const i=s.indexOf('function fetchCertifiedRegistry(){');
            const j=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',i);
            assert(i>=0 && j>i && !s.includes('fetchCertifiedRegistry()\n .then(r=>'));
            const fn=new Function('fetch',s.slice(i,j)+';return fetchCertifiedRegistry();');
            for(let fallback=0;fallback<files.length;fallback++){
              const visited=[];
              const d=await fn(async url=>{
                const k=files.findIndex(x=>url.includes(x));
                assert(k>=0);visited.push(k);
                return k<fallback?{ok:false,status:404}:{ok:true,json:async()=>data[k]};
              });
              assert.strictEqual(d,data[fallback]);
              assert.deepEqual(visited,Array.from({length:fallback+1},(_,x)=>x));
            }
          }
          (async()=>{await check('nl2-multiboard.js');await check('nl2_hu_multiboard_ui.js');
            console.log('PASS B67 V9 to V1 certified registry fallback on both pages');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit 57/335 exact source ledger and all 222 node-lock/b50 evidence to Draft PR #2; never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v9_rank40_b67.json data/nl2_hu_cert_lock_medium_matrix_v9_rank40_b67.json docs/NL2_HU_B67_V9_RANK40_CERT.md docs/NL2_HU_B67_V9_ALL_LOCKS_MEDIUM.md
          git commit -m 'TASK-HYBRID B67: verified SB_BB rank40 three exact GTO/hero-IP boards, 57 CERT/335 APPROX, 222 board lock audits'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B67-V9-authentic-rank40
          path: |
            data/nl2_hu_multiboard_status_v9_rank40_b67.json
            data/nl2_hu_cert_lock_medium_matrix_v9_rank40_b67.json
            docs/NL2_HU_B67_V9_RANK40_CERT.md
            docs/NL2_HU_B67_V9_ALL_LOCKS_MEDIUM.md
          retention-days: 30
