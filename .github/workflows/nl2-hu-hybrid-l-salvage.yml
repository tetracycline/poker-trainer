name: TASK-HYBRID L-salvage independently archive 2 actual LMP GTO job results
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-l-salvage.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  salvage-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download precisely 2 completed immutable Rust GTO jobs, never cancelled LMP lock artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in nl2-multiboard-B9_LMP_FAST-LMP_CO_BB-gto-As7h3d nl2-multiboard-B9_LMP_FAST-LMP_CO_BB-gto-4s4h2d; do
            mkdir -p "downloads/$name"
            gh run download 44740512245 --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
            test -d "downloads/$name/evidence"
          done
          test "$(find downloads -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 2
      - name: Validate original Rust CFR SHA, combo reach and true convergence, not hero-locked claim
        run: |
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py --downloads downloads --solver-root solver --run-id 44740512245 --out trainer/data/solver_evidence/NL2_MULTIBOARD_B9_LMP_FAST.json
      - name: Freeze accurate source-only verified 2-GTO-0-lock counts
        run: |
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B9_LMP_FAST.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert d['source_run_id']==44740512245 and not d['errors'] and len(d['artifacts'])==2
          assert all(z['version']=='gto' for z in d['artifacts'])
          assert d['exact_board_gto_sources']>0 and d['imputed_pool_locked_sources']==0
          raw=p.read_bytes();gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx={'schema':'NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
               'run_id':44740512245,'batch':'B9_LMP_FAST',
               'actual_spot_flop_version_jobs':2,
               'verified_cases':d['new_authentic_board_cases'],
               'gto_cases':d['exact_board_gto_sources'],
               'locked_cases':0,
               'source_sha256':hashlib.sha256(raw).hexdigest(),
               'gzip_sha256':hashlib.sha256(gz.read_bytes()).hexdigest(),
               'generic_model_certification':0,
               'excluded_unverified_jobs':'LMP exp_oop 3 flops and Jh9d6s GTO timed out; not promoted'}
          p.with_suffix('.index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          print('PASS genuine LMP GTO only',idx['gto_cases'])
          PY
      - name: Refresh exact-model status, high frequency gap report and CERT lock/medium proof
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 tools/hu_multiboard_consolidate.py --root data --out data/nl2_hu_multiboard_status.json --doc docs/NL2_HU_MULTIBOARD_STATUS.md
          python3 tools/hu_highfreq_shortfalls.py data data/nl2_hu_highfreq_shortfalls.json
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status.json --out data/nl2_hu_cert_lock_medium_audit.json
          python3 - <<'PY'
          import json
          s=json.load(open('data/nl2_hu_multiboard_status.json'))
          g=json.load(open('data/nl2_hu_highfreq_shortfalls.json'))
          a=json.load(open('data/nl2_hu_cert_lock_medium_audit.json'))
          assert s['TOTAL']==392 and s['CERT_MULTIBOARD']+s['APPROX']==392 and s['CERT_MULTIBOARD']>=18
          assert s['independently_verified_completed_batches']['B9_LMP_FAST']['authentic_jobs']==2
          assert g['certified_from_source']==s['CERT_MULTIBOARD'] and a['cert_multiboard']==s['CERT_MULTIBOARD']
          print('PASS true two LMP GTO sources, no fake hero lock',s['CERT_MULTIBOARD'],s['APPROX'])
          PY
      - name: Commit and push LMP authentic GTO-only archive to PR #2 Draft, never merge
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B9_LMP_FAST.json.gz data/solver_evidence/NL2_MULTIBOARD_B9_LMP_FAST.index.json data/nl2_hu_multiboard_status.json data/nl2_hu_highfreq_shortfalls.json data/nl2_hu_cert_lock_medium_audit.json docs/NL2_HU_MULTIBOARD_STATUS.md
          git commit -m 'TASK-HYBRID L salvage: two independently verified GTO-only LMP sources, no unjustified CERT'
          for retry in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$retry"
          done
          exit 1
      - name: Preserve recoverable LMP source if push race
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-L-GTO-two-verified
          path: trainer/data/solver_evidence/NL2_MULTIBOARD_B9_LMP_FAST*
          retention-days: 30
