name: B714 solve missing rank255 continuations from authenticated B687 flop roots
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b714-rank255-rivers.yml'
      - 'tools/hu_b714_rank255_rivers.py'
      - 'tools/hu_b714_rank255_routes.cjs'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [Qs8h4d, Jh8d3c, 9c6c3h]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate the published rank103 roots, original turn studies and three-street rank255 route
        env:
          FLOP: ${{ matrix.flop }}
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b714_rank255_rivers.py
          python tools/hu_b714_rank255_rivers.py --solver pinned-solver --flop "$FLOP" \
            --output "$RUNNER_TEMP/preflight" --preflight
          git diff --exit-code -- nl2_hu_model.js nl2.js tools/hu_trainer_route_contract.cjs data/
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve only new conditional turns and checked river decisions from verified original roots
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
          PYTHONDONTWRITEBYTECODE: 1
          NODE_OPTIONS: --max-old-space-size=1536
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b714-source"
          python tools/hu_b714_rank255_rivers.py --solver pinned-solver --flop "$FLOP" \
            --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$folder/proof.json" "$RUNNER_TEMP/b714-original-proof.json"
          python tools/hu_b714_rank255_rivers.py --solver pinned-solver --flop "$FLOP" \
            --output "$folder"
          cmp "$folder/proof.json" "$RUNNER_TEMP/b714-original-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B714-R255-${{ matrix.flop }}
          path: ${{ runner.temp }}/b714-source
          if-no-files-found: error
          retention-days: 90
