name: NL2 verify assumed ISO and limp real CFR
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-assumed-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-assumed-isolimp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact two frozen 100bb genuine CFR solver archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/downloads evidence/output
          for spot in ISO_BTN_CO LMP_CO_BB; do
            mkdir -p "evidence/staging/$spot"
            gh run download 44508547280 --repo "$GITHUB_REPOSITORY" \
              --name "nl2-assumed-$spot" --dir "evidence/staging/$spot"
            ( cd "evidence/staging/$spot" && zip -qr "../../downloads/$spot.zip" . )
          done
      - name: Independently verify actual engine pot/stack/rake, per-169 hand weights, CFR convergence, hashes and river nodes
        run: |
          python3 tools/verify_hu_assumed_pots.py \
            --zip evidence/downloads/ISO_BTN_CO.zip evidence/downloads/LMP_CO_BB.zip \
            --out evidence/output/assumed-isolimp-CFR-proof.json
      - name: Publish exact proof without claiming CERT or EST for website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-assumed-iso-lmp-verified
          path: evidence/output/
          retention-days: 30
