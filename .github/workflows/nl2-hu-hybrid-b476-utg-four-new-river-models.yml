name: B476 four UTG river decisions from three fresh original GTO and NL2 pairs
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b476-utg-four-new-river-models.yml'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        flop: [KcQd6h, QhJc6d, Td9h5c]
        version: [gto, exp_oop]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve one full flop and the two frozen turn subgames for this board and version
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot UTG_CO \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy checkcheck-and-oop-b50 \
            --turn-size-menu 33-50-75-100 --archive-empty-river-extraction --lock-marginals-by-street --turn-count 1 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= 2
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert len(m["cases"]) + len(m["skipped"]) == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NL2-B476-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/UTG_CO/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 30

  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: NL2-B476-*
          path: downloads
      - name: Confirm actual generated parent and child actions, sizing and pot geometry
        run: node tools/hu_b476_utg_trainer_routes.cjs
      - name: Reconstruct both seats' legal full-street deals from the six original solves
        run: python3 tools/hu_b476_utg_river_batch.py --downloads downloads --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: B476-verified-originals-and-classification
          path: |
            data/nl2_hu_b476_four_utg_river_results.json
            data/solver_evidence/NL2_B476_UTG_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_R99_${{ github.run_id }}_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_R109_${{ github.run_id }}_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_R110_${{ github.run_id }}_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_R111_${{ github.run_id }}_*.json.gz
            data/solver_evidence/extensions/rank99.json
            data/solver_evidence/extensions/rank109.json
            data/solver_evidence/extensions/rank110.json
            data/solver_evidence/extensions/rank111.json
          if-no-files-found: error
          retention-days: 90
      - name: Run full audit against the live cumulative registry and commit verified sources
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          files=(data/nl2_hu_b476_four_utg_river_results.json data/solver_evidence/NL2_B476_UTG_*.json.gz)
          for rank in 99 109 110 111; do
            files+=(data/solver_evidence/NL2_MULTIBOARD_R${rank}_${GITHUB_RUN_ID}_*.json.gz)
            ext="data/solver_evidence/extensions/rank$rank.json"
            if test -f "$ext"; then files+=("$ext"); fi
          done
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              status=data/nl2_hu_multiboard_status_current.json
              python3 tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              git add "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              if ! git diff --cached --quiet; then
                git commit -m 'B476: preserve exact UTG river evidence and cumulative certification'
              fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
