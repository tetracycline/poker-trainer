name: TASK-HYBRID B127 preserve true B125 rank88 GTO and NL2 actor-OOP negative strict source (max9m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b127-rank88-preserve-negative.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch finished B125 independent Rust source files without re-solving any flop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for version in gto exp_oop; do
            name="nl2-multiboard-B125_R88_SB3_PAIRED_B33B50-SB3_BTN-${version}-8s8h3d"
            mkdir -p "downloads/$name"
            gh run download 44839628712 --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
            test -s "downloads/$name/evidence/SB3_BTN-${version}-8s8h3d.json"
          done
      - name: Independently validate solver roots, rake, range source, exact path, GTO gaps, lock/default and sequential reach
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/verify_hu_multiboard_100bb.py
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py --downloads downloads --solver-root solver --run-id 44839628712 --out trainer/data/solver_evidence/NL2_MULTIBOARD_B125_R88_SB3_PAIRED_B33B50.json
      - name: Preserve evidence, separately gate exact actor-OOP reach and flag rank88 APPROX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,gzip,hashlib,pathlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B125_R88_SB3_PAIRED_B33B50.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert d['source_run_id']==44839628712 and not d['errors']
          assert (d['exact_board_gto_sources'],d['imputed_pool_locked_sources'])==(1,1)
          assert len(d['artifacts'])==2
          arts={a['version']:a for a in d['artifacts']}
          assert set(arts)=={'gto','exp_oop'}
          for a in arts.values():
              assert (a['spot'],a['flop'])==('SB3_BTN','8s8h3d')
              assert not a['errors'] and a['cases']
              assert all((c['flop_line'],c['turn'])==('b33 c','5s') for c in a['cases'])
          def strict(version):
              return [n for c in arts[version]['cases'] for n in c['nodes']
                  if n['exact_node_line']=='b33 c/b50 c/' and n['acting_seat']==0
                  and n['strictly_reachable_combos']>0]
          gto=strict('gto');exp=strict('exp_oop')
          assert not exp, 'B125 first failure reason unexpectedly resolved; require independent promotion run'
          raw=p.read_bytes();gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
             batch='B125_R88_SB3_PAIRED_B33B50',run_id=44839628712,
             actual_spot_flop_version_jobs=2,
             verified_cases=d['new_authentic_board_cases'],
             gto_cases=1,locked_cases=1,
             source_sha256=hashlib.sha256(raw).hexdigest(),
             gzip_sha256=hashlib.sha256(gz.read_bytes()).hexdigest(),
             generic_model_certification=0,
             rank88_GTO_hero_actor_combo_sum=sum(n['strictly_reachable_combos'] for n in gto),
             rank88_NL2_locked_hero_actor_combo_sum=0,
             missing_exact_actor_OOP_line='b33 c/b50 c/',
             no_certification_reason='NO_STRICT_RIVER_OOP_HERO_COMBOS_AFTER_POOL_LOCK',
             rank88_remains_APPROX=True,immediate_CERT_upgrades=0)
          p.with_suffix('.index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          doc=pathlib.Path('trainer/docs/NL2_HU_B127_RANK88_GENUINE_NEGATIVE.md')
          doc.write_text('# B127 rank88 genuine negative exact SB3 BTN source\n\n'
             'B125 run 44839628712 genuine independently SHA-verified GTO+EXP_OOP '
             '8s8h3d, turn 5s, target b33 c/b50 c/.\n'
             'GTO positive legal hero-OOP rows: '+str(idx['rank88_GTO_hero_actor_combo_sum'])
             + '; actual locked legal hero-OOP rows: 0. No false promotion.\n'
             'Status after B123 remains **139 CERT /253 APPROX /0 EST**. '
             'This is an exact source negative, not proof of a profitable betting action.\n'
             'PR#2 Draft, NEVER MERGE.\n')
          print('PASS authenticated B125 negative source while keeping rank88 APPROX',idx)
          PY
      - name: Commit B125 true negative proof to PR2 Draft branch without changing certified counts
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B125_R88_SB3_PAIRED_B33B50.json.gz data/solver_evidence/NL2_MULTIBOARD_B125_R88_SB3_PAIRED_B33B50.index.json docs/NL2_HU_B127_RANK88_GENUINE_NEGATIVE.md
          git commit -m 'TASK-HYBRID B127: independently archive genuine B125 rank88 GTO and NL2 OOP source; strict OOP river hero zero, keep APPROX'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B127-authentic-rank88-negative
          path: |
            trainer/data/solver_evidence/NL2_MULTIBOARD_B125_R88_SB3_PAIRED_B33B50.*
            trainer/docs/NL2_HU_B127_RANK88_GENUINE_NEGATIVE.md
          retention-days: 30
