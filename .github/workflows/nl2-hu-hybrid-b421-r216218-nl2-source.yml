name: NL2 B421 rank216/218 third distinct true CO-IP NL2 source flop Js9h5d, HU2475 <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b421-r216218-nl2-source.yml'
      - 'tools/hu_b421_rank216_218_true_co_ip_pairs.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine original 100bb CO-IP partially NL2-locked Rust fullflop and turn on B393-positive Js9h5d
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot CO_BB --flop Js9h5d --version exp_ip \
            --flop-size-profile full --flop-line-policy checked-b50b100only --turn-count 1 \
            --manifest evidence/CO_BB-Js9h5d-exp_ip.json
      - name: Preserve true source Rust solve and exact zero/error outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B421_R216218_NL2_IP-CO_BB-Js9h5d-exp_ip
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent B393 original GTO SHA and B421 true NL2 IP source actor/SPR/40-70 check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b421-gto /tmp/b421-exp
          gh run download 45026396521 --repo "$GITHUB_REPOSITORY" \
            --name nl2-multiboard-B393_COBB_FIVE_GTO_FIRST-CO_BB-Js9h5d-gto \
            --dir /tmp/b421-gto/nl2-multiboard-B393_COBB_FIVE_GTO_FIRST-CO_BB-Js9h5d-gto
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name nl2-multiboard-B421_R216218_NL2_IP-CO_BB-Js9h5d-exp_ip \
            --dir /tmp/b421-exp/nl2-multiboard-B421_R216218_NL2_IP-CO_BB-Js9h5d-exp_ip || true
          python3 -m py_compile tools/hu_b421_rank216_218_true_co_ip_pairs.py
          python3 tools/hu_b421_rank216_218_true_co_ip_pairs.py --gto-root /tmp/b421-gto --exp-root /tmp/b421-exp --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b421-lockaudit.json
      - name: Full HU2475 action river paths, exact actor/line/model and front end
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b421-contract.json
          node tools/link_audit.js --md /tmp/b421-link.md --json /tmp/b421-link.json
          node tools/reach_verify.js --log /tmp/b421-reach.md --json /tmp/b421-reach.json
          node tools/hu_model_path_audit.js /tmp/b421-model.json
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/b421-link.json'))['counts']
          x=json.load(open('data/nl2_hu_b421_r216218_one_real_nl2_ip_original_pair.json'))
          a=json.load(open('/tmp/b421-lockaudit.json'))
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(163,229,0)
          assert x['no_automatic_CERT_while_no_three_independent_original_sources']
          assert len(x['source_evidence'])==1
          print('PASS B421 real source-only GTO/NL2 IP pairs, 163/229, HU2475/2475')
          PY
          git diff --check
      - name: Commit and push only genuine B421 NL2 source proof, never fake CERT or merge PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add data/nl2_hu_b421_r216218_one_real_nl2_ip_original_pair.json docs/NL2_HU_B421_R216218_TWO_TRUE_IP_LOCKS.md
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B421: genuine CO_BB rank216/218 paired GTO+NL2 IP source on Js9h5d, strict combo/SPR, HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
