name: NL2 B380 rank107 KsQh4d genuine GTO strict-zero negative and HU2475
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b380-r107-ksq-negative.yml','tools/hu_b380_r107_ksq_strict_negative.py']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  negative-audit-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Real Rust source and full-street 40-70 zero reach gate, no re-solve
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b380-source
          gh run download 45017142943 --repo "$GITHUB_REPOSITORY" --name nl2-multiboard-B374_R107-BTN_BB-KsQh4d-gto --dir /tmp/b380-source
          python3 tools/hu_b380_r107_ksq_strict_negative.py /tmp/b380-source
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b380-gate.json
      - name: Full HU2475 links, actor reach, model paths and frontend
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b380-contract.json
          node tools/link_audit.js --md /tmp/b380-link.md --json /tmp/b380-link.json
          node tools/reach_verify.js --log /tmp/b380-reach.md --json /tmp/b380-reach.json
          node tools/hu_model_path_audit.js /tmp/b380-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          python3 - <<'PY'
          import json
          q=json.load(open('data/nl2_hu_b380_rank107_ksqh4d_strict_zero_gto_source_negative.json'))
          a=json.load(open('/tmp/b380-gate.json'))
          c=json.load(open('/tmp/b380-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['no_CERT_because_zero_legal_actor_IP_combos']
          print('PASS B380 159/233 HU2475/2475 strict original GTO negative')
          PY
          git diff --check
      - name: Commit and push genuine negative, never merge PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b380_rank107_ksqh4d_strict_zero_gto_source_negative.json docs/NL2_HU_B380_RANK107_KSQH4D_STRICT_ZERO_NEGATIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B380: genuine rank107 KsQh4d GTO but zero strict target combo; 159/233 unchanged'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
