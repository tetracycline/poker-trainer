name: B775 replay rank150 and audit its immutable data candidate
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['data/nl2_hu_b775_source_manifest.json']
permissions: {contents: write, actions: read, pull-requests: read}
jobs:
  replay-audit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nl2-hu-lines-audit-20261118
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy phevaluator==0.5.3.1
      - name: Authenticate the final native workers and replay the exact original jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git merge-base --is-ancestor 9fd70b00708fc81a98bafaaaaf01a8889f748b30 HEAD
          python tools/hu_b775_collect.py --output "$RUNNER_TEMP/b775-original"
          cmp data/nl2_hu_b775_source_manifest.json "$RUNNER_TEMP/b775-original/receipt.json"
          python tools/hu_b775_rank150.py --solver pinned-solver \
            --receipts "$RUNNER_TEMP/b775-original/receipt.json" --archives "$RUNNER_TEMP/b775-original" \
            --output "$RUNNER_TEMP/b775-stage/data" > "$RUNNER_TEMP/b775-replay.txt"
          git diff --exit-code -- data/
      - name: Preserve 391 unrelated decisions and stage only verified rank150 evidence
        run: |
          set -euo pipefail
          python tools/hu_b775_integrate.py --stage "$RUNNER_TEMP/b775-stage/data" \
            --paths "$RUNNER_TEMP/b775-paths.txt" --group "$RUNNER_TEMP/b775-group.txt"
          node tools/hu_b679_policy_view.cjs "$(cat "$RUNNER_TEMP/b775-group.txt")"
          sha256sum data/nl2_hu_multiboard_status_current.json data/nl2_hu_verified_extensions.json \
            data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json > "$RUNNER_TEMP/b775-integrated.sha256"
      - name: Run the complete published-batch audit on the candidate tree
        run: |
          set -euo pipefail
          registry=data/nl2_hu_multiboard_status_current.json
          python tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/b775-rebuilt.json"
          cmp "$registry" "$RUNNER_TEMP/b775-rebuilt.json"
          node tools/hu_extension_runtime_test.cjs "$registry"
          bash tools/hu_exact_batch_audit.sh "$registry"
          git fetch --quiet --no-tags --depth=1 origin d0fe026b3cd59b50450f99471bd27c55e7d4b522
          python tools/hu_b491_incremental_medium.py
          node tools/hu_b491_incremental_medium.cjs
          node tools/hu_b483_lock_medium_ui.cjs
          node tools/hu_b485_medium_viewers.cjs
          node tools/hu_b492_medium_tree_ui.cjs
          node tools/hu_b584_optional_river_ui.cjs
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/b775-coverage.json"
          sha256sum -c "$RUNNER_TEMP/b775-integrated.sha256"
      - name: Create the audited single-parent candidate for the open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          mapfile -t paths < "$RUNNER_TEMP/b775-paths.txt"
          GITHUB_SHA="$parent" python tools/hu_publish_candidate.py \
            --message 'B775 archive the B733 exact-root extension and independently verified rank150 policies' \
            --paths "${paths[@]}" | tee "$RUNNER_TEMP/b775-candidate.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B775-original-rank150-publication
          path: |
            ${{ runner.temp }}/b775-stage/data/nl2_hu_b775_results.json
            ${{ runner.temp }}/b775-replay.txt
            ${{ runner.temp }}/b775-paths.txt
            ${{ runner.temp }}/b775-coverage.json
            ${{ runner.temp }}/b775-candidate.txt
            data/nl2_hu_b775_integration.json
          if-no-files-found: warn
          retention-days: 90
