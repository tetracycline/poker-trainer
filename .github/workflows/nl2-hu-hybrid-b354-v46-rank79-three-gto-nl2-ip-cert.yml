name: TASK-HYBRID B354 V46 rank79 3 original 100bb UTGCO GTO plus genuine Rust NL2 CO IP actor flops 158/234 HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b354-v46-rank79-three-gto-nl2-ip-cert.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  original-stage2-and-B351-source-three-flop-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require original independent verified Stage2 and B351 actual 100bb source PASS, download historical raw Rust GTO and true NL2 IP; never copy wrong B2 or generic source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b354_v46_rank79_3_true_utgco_gto_nl2_cert.py tools/hu_cert_lock_medium_coverage_matrix.py tools/hu_cert_lock_medium_audit.py
          for run in 44654973894 44971994483 44972577772; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          done
          mkdir -p downloads/historic-gto downloads/historic-exp
          gh run download 44654973894 --repo "$GITHUB_REPOSITORY" \
            --name 'nl2-stage2-UTG_CO-gto-Ks7h2d' --dir downloads/historic-gto
          gh run download 44654973894 --repo "$GITHUB_REPOSITORY" \
            --name 'nl2-stage2-UTG_CO-exp_ip-Ks7h2d' --dir downloads/historic-exp
          test -s downloads/historic-gto/evidence/UTG_CO-gto-Ks7h2d.json
          test -s downloads/historic-exp/evidence/UTG_CO-exp_ip-Ks7h2d.json
          test -s downloads/historic-gto/solver/postflop/out/UTG_CO/gto/Ks7h2d_b50c_9d.json
          test -s downloads/historic-exp/solver/postflop/out/UTG_CO/exp_ip/Ks7h2d_b50c_9d.json
      - name: Strict V45 157/235 to V46 rank79 158/234 3 original GTO+genuine NL2 source-gated actor 40/70 SPR7 and distinct texture certification
        run: |
          set -euo pipefail
          python3 tools/hu_b354_v46_rank79_3_true_utgco_gto_nl2_cert.py \
            --historic-gto downloads/historic-gto --historic-exp downloads/historic-exp
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path('data')
          s=json.loads((d/'nl2_hu_multiboard_status_v46_b354_rank79.json').read_text())
          m=json.loads((d/'nl2_hu_cert_lock_medium_matrix_v46_b354.json').read_text())
          p=json.loads((d/'nl2_hu_b354_v46_rank79_3_original_GTO_real_NL2_source_gate.json').read_text())
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert (s['CERT_MULTIBOARD'],s['APPROX'],s['EST'],s['TOTAL'])==(158,234,0,392)
          assert s['parent_v45_sha256']==sha(d/'nl2_hu_multiboard_status_v45_b345_rank71.json')
          assert p['parent_V45_status_sha256']==sha(d/'nl2_hu_multiboard_status_v45_b345_rank71.json')
          assert p['V46_status_sha256']==sha(d/'nl2_hu_multiboard_status_v46_b354_rank79.json')
          assert p['V46_matrix_sha256']==sha(d/'nl2_hu_cert_lock_medium_matrix_v46_b354.json')
          assert m['parent_v46_status_sha256']==p['V46_status_sha256']
          assert (len(m['boards']),len(m['models']))==(603,158)
          assert m['strict_aggregate']['hero_lock_variants']==695
          assert p['three_distinct_flops']==['Ks7h2d','8s8h3d','Js9h4d']
          assert len(p['multiple_textures'])>=2
          assert p['source_is_full_four_size_GTO'] and p['original_stage2_run_success']
          assert s['records']['ln-ipc-t_model-1cla93g']['label']=='CERT-MULTIBOARD'
          assert s['records']['ln-iso-lmp_r_model-vlgh2t']['label']=='CERT-MULTIBOARD'
          print('PASS B354 rank79 3 genuine UTGCO original SHA GTO+NL2 CO IP source boards, V46 158/234, 603 named/695 real actor locks')
          PY
      - name: Independent full V46 158 CERT, 234 APPROX, 392 models, all 603 public GTO/true actor NL2 695 lock sources, full HU 2475 reachable river routes
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v46_b354_rank79.json --out nl2-audit/b354-v46-lock.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b354-v46-lock.json'))
          s=json.load(open('data/nl2_hu_multiboard_status_v46_b354_rank79.json'))
          p=json.load(open('data/nl2_hu_b354_v46_rank79_3_original_GTO_real_NL2_source_gate.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(158,234,0)
          assert (s['CERT_MULTIBOARD'],s['APPROX'],s['EST'],s['TOTAL'])==(158,234,0,392)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'])==(603,695)
          assert p['no_observed_NL2_private_card_conditional_rates']
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B354 full HU 2475/2475")'
      - name: Commit ONLY genuine V46 rank79 original Stage2 and B351 source SHA proof with fully audited 392/603/695 HU2475; PR2 Draft never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v46_b354_rank79.json \
            data/nl2_hu_cert_lock_medium_matrix_v46_b354.json \
            data/nl2_hu_b354_v46_rank79_3_original_GTO_real_NL2_source_gate.json \
            docs/NL2_HU_B354_V46_RANK79_THREE_ORIGINAL_GTO_REAL_NL2_IP_CERT.md
          git commit -m 'TASK-HYBRID B354 V46 rank79 3 original UTGCO full100bb real GTO+NL2 actor COIP SHA-pinned flops 40/70 SPR7; 158 CERT 234 APPROX 603/695 HU2475 PASS'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B354-V46-rank79-3-true-original-GTO-NL2-COIP-158-234-HU2475
          path: |
            data/nl2_hu_multiboard_status_v46_b354_rank79.json
            data/nl2_hu_cert_lock_medium_matrix_v46_b354.json
            data/nl2_hu_b354_v46_rank79_3_original_GTO_real_NL2_source_gate.json
            docs/NL2_HU_B354_V46_RANK79_THREE_ORIGINAL_GTO_REAL_NL2_IP_CERT.md
            nl2-audit/
          retention-days: 30
