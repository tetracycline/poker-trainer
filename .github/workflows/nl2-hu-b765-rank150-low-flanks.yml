name: B765 solve two original paired-three rank150 flops and preserve their original roots
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b765-rank150-low-flanks.yml'
      - 'tools/hu_b765_rank150_low_flanks.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        flop: [9s9h3s, TdTc3d]
    env:
      FLOP: ${{ matrix.flop }}
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify original A-low private deals and current paired-three routes
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b765_rank150_low_flanks.py --preflight --solver pinned-solver --flop "$FLOP" --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve just the new full-size flop root
        run: |
          python tools/hu_b765_rank150_low_flanks.py --solver pinned-solver --flop "$FLOP" --checkpoint-only \
            --output "$RUNNER_TEMP/b765-root" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - name: Preserve the completed original before conditional work
        uses: actions/upload-artifact@v4
        with:
          name: B765-root-R150-${{ matrix.flop }}
          path: ${{ runner.temp }}/b765-root
          if-no-files-found: error
          retention-days: 90
      - name: Resume the original root and verify both policies on reachable river checks
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/b765-source"
          python tools/hu_b765_rank150_low_flanks.py --solver pinned-solver --flop "$FLOP" --output "$folder" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver --checkpoint "$RUNNER_TEMP/b765-root"
          cp "$folder/proof.json" "$RUNNER_TEMP/original-proof"
          python tools/hu_b765_rank150_low_flanks.py --solver pinned-solver --flop "$FLOP" --output "$folder"
          cmp "$RUNNER_TEMP/original-proof" "$folder/proof.json"
          cmp "$RUNNER_TEMP/b765-root/flop/job.json" "$folder/flop/job.json"
          cmp "$RUNNER_TEMP/b765-root/flop/result.json" "$folder/flop/result.json"
      - name: Preserve the conditional jobs and original decisions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B765-R150-${{ matrix.flop }}
          path: ${{ runner.temp }}/b765-source
          if-no-files-found: error
          retention-days: 90
