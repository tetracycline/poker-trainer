name: TASK-HYBRID B346 V45 source failclosed UI rank71 3 GTO NL2 actor boards 600 locks692 b50 research134 HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b346-v45-rank71-ui-600-provenance.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-source-UI-activation-and-independent-full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require successful full B345 source proof SHA and independent V45 157/235, then activate UI V45 with immutable V44+ fallback
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b346_v45_rank71_ui_primary_failclosed.py
          python3 tools/hu_b346_v45_rank71_ui_primary_failclosed.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.'); d=root/'data'
          s=json.load(open(d/'nl2_hu_multiboard_status_v45_b345_rank71.json'))
          p=json.load(open(d/'nl2_hu_b345_v45_rank71_three_gto_nl2_source_gate.json'))
          m=json.load(open(d/'nl2_hu_cert_lock_medium_matrix_v45_b345.json'))
          sh=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          assert (s['CERT_MULTIBOARD'],s['APPROX'],s['EST'],s['TOTAL'])==(157,235,0,392)
          assert p['V45_sha256']==sh(d/'nl2_hu_multiboard_status_v45_b345_rank71.json')
          assert p['matrix_sha256']==sh(d/'nl2_hu_cert_lock_medium_matrix_v45_b345.json')
          assert m['parent_v45_status_sha256']==p['V45_sha256']
          assert (len(m['boards']),len(m['models']))==(600,157)
          assert (m['strict_aggregate']['hero_lock_variants'],m['strict_aggregate']['b50_research_candidate_boards'])==(692,134)
          rank71=[x for x in m['boards'] if x['rank']==71]
          assert [z['flop'] for z in rank71]==['4s4h2d','7s5h3d','3s3h2d']
          assert all(z['exact_action_line']=='b50 c/x b50 c/' and z['actor_seat']==0 and
             z['strictly_reachable_combo_count']>0 and z['hero_lock_proofs'] and
             z['b50_research_status']=='NOT_SUPPORTED_BY_CURRENT_EXACT_BOARD_EVIDENCE' for z in rank71)
          for name in ('nl2-multiboard.js','nl2_hu_multiboard_ui.js'):
            text=(root/name).read_text()
            assert text.count('const v45=d=>{')==1
            assert "return fetch('data/nl2_hu_multiboard_status_v45_b345_rank71.json'" in text
            assert ".catch(()=>fetch('data/nl2_hu_multiboard_status_v44_b331_rank60_four_flops.json'" in text
            assert "d.CERT_MULTIBOARD!==157||d.APPROX!==235" in text
          print('PASS V45 UI strict exact-source 3 FLOPS 157 CERT/235 APPROX, 600 real named GTO plus NL2 locks692 and b50 research-only134')
          PY
      - name: Independently re-audit all 600 V45 actor match and NL2 source-rate provenance 392 cells and 2475 navigation routes
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v45_b345_rank71.json --out nl2-audit/b346-v45-lock.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b346-v45-lock.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(157,235,0)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'],
                  a['aggregate']['board_examples_with_b50_candidate'])==(600,692,134)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B346 full HU 2475/2475")'
      - name: Commit failclosed V45 UI primary and 600/692 lock proof only after all independent Actions audits PASS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          pathlib.Path('docs/NL2_HU_B346_V45_RANK71_UI_WITH_V44_FALLBACK.md').write_text(
            '# B346 V45 rank71 3 actual public flop+turn/river GTO and NL2 BB-OOP source-gated UI\\n\\n'
            'The frontend shows the independently authenticated V45 **157 CERT /235 APPROX /0 EST** from original Rust GTO+real NL2 node locks on 600 exact public boards, 692 partial actor lock variants. '
            'Rank71 has precisely three named paired/low boards 4s4h2d, 7s5h3d and 3s3h2d, exact BB-OOP b50 c/x b50 c/ with 40/70 reach and model SPR match. '
            'The user-facing source links point to the actual source proof and distinguish original GTO from later partial NL2 lock; no private-hand conditional rates claimed. '
            'Fallback V44, V43, V42 etc is failclosed and retained. 134 50%-pot nonpolarized candidates apply only to exact boards that have matching evidence, no generic bet-size claim. '
            'Original B19/B26/B343 100bb LMP flop tree is expressly 50%-only restricted; never call unrestricted GTO. '
            'Full 392/600 actor source audit and HU 2475/2475 independent regression passed before any commit. Draft PR2, NEVER merge or force-push.\\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nl2-multiboard.js nl2_hu_multiboard_ui.js docs/NL2_HU_B346_V45_RANK71_UI_WITH_V44_FALLBACK.md
          git commit -m 'TASK-HYBRID B346: failclosed V45 rank71 3 true GTO+NL2 BB-OOP flops UI with V44 fallback; CERT157/APPROX235 600/692 b50 134 HU2475 PASS'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B346-V45-rank71-source-gated-UI-600-692-HU2475
          path: |
            docs/NL2_HU_B346_V45_RANK71_UI_WITH_V44_FALLBACK.md
            nl2-audit/
          retention-days: 30
