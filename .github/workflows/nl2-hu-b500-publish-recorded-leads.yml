name: Publish and audit completed B500 conditional lead evidence
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b500-publish-recorded-leads.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Authenticate the combined B500 artifact and restore its exact files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/artifacts/14788901829"
          gh api "$api" > "$RUNNER_TEMP/meta.json"
          gh api "$api/zip" > "$RUNNER_TEMP/recorded.zip"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, os, re
          tmp=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((tmp/'meta.json').read_bytes())
          digest='4581502f92891b3a012fe5692bbb6c2105b1d2d5f78215d866998890eaf5a9dc'
          assert (meta['id'],meta['name'],meta['workflow_run']['id'],meta['workflow_run']['repository_id'],meta['digest'])==(14788901829,'B500-conditional-source-comparison',45109395520,1438346845,'sha256:'+digest)
          assert hashlib.sha256((tmp/'recorded.zip').read_bytes()).hexdigest()==digest
          with ZipFile(tmp/'recorded.zip') as z:
              assert len(z.namelist())==len(set(z.namelist()))
              for name in z.namelist():
                  assert name=='nl2_hu_b500_half_pot_leads.json' or re.fullmatch(r'solver_evidence/NL2_(?:B500_[A-Za-z0-9_]+\.zip|MULTIBOARD_B500_[A-Za-z0-9_]+\.json\.gz)',name)
              report=json.loads(z.read('nl2_hu_b500_half_pot_leads.json'))
              assert report['source_run_id']==45109395520
              z.extractall(tmp/'verified'/'data')
          PY
      - name: Verify paired source and publish on the current draft head
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          registry=data/nl2_hu_multiboard_status_current.json
          verified="$RUNNER_TEMP/verified"
          mapfile -t files < <(cd "$verified" && find data -type f)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            cp -a "$verified/data/." "$live/data/"
            (
              cd "$live"
              python tools/hu_b492_half_pot_leads.py --batch B500 --verify-published
              node tools/hu_b492_medium_tree_ui.cjs
              node tools/hu_b492_medium_tree_ui.cjs data/nl2_hu_b500_half_pot_leads.json "$registry"
              git add -f -- "${files[@]}"
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B500: publish two paired rank71 half-pot leads and withhold the river with zero NL2 reach'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then
              cd "$live"
              node tools/hu_extension_runtime_test.cjs "$registry"
              bash tools/hu_exact_batch_audit.sh "$registry"
              exit 0
            fi
            git worktree remove "$live"
          done
          exit 1
