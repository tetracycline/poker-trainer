name: B457 rank45 ISO_BTN_CO check-check GTO and NL2-OOP first board; strict HU2475
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b457-r45-iso-xx-first-board.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: [gto, exp_oop]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trainer
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned exact 100bb Rust CFR
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve first predeclared rank45 ISO original full-menu check-check flop and 8s turn
        working-directory: trainer
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C ../solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C ../solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          set +e
          python3 tools/solve_hu_multiboard_100bb.py \
            --solver-root ../solver --spot ISO_BTN_CO --flop AsKh3d \
            --version "${{ matrix.version }}" --flop-size-profile full \
            --flop-line-policy checkcheck --turn-count 1 \
            --manifest "evidence/ISO_BTN_CO-AsKh3d-${{ matrix.version }}.json"
          status=$?
          set -e
          python3 - <<'PY'
          import json,pathlib
          name='${{ matrix.version }}'
          m=json.loads(pathlib.Path('evidence/ISO_BTN_CO-AsKh3d-'+name+'.json').read_text())
          assert m['spot']=='ISO_BTN_CO' and m['version']==name and m['flop']=='AsKh3d'
          assert m['preflop_ranges']['source']=='ASSUMED_EXPLICIT_169CLASS'
          assert m['flop_size_profile']=='full' and not m['restricted_tree_assumption']
          assert m['selected_lines']==['x x'] and m['turns']==['8s']
          assert not m['failures'] and len(m['cases'])==m['solved_cases']<=1
          print('B457 authentic',name,'cases',m['solved_cases'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NL2-B457-R45-AsKh3d-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/ISO_BTN_CO/${{ matrix.version }}
          retention-days: 30
          if-no-files-found: error
  verify-audit-commit:
    needs: [solve]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trainer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download only this run original Rust source artifacts
        working-directory: trainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ../downloads/gto ../downloads/exp_oop
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'NL2-B457-R45-AsKh3d-gto' --dir ../downloads/gto
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'NL2-B457-R45-AsKh3d-exp_oop' --dir ../downloads/exp_oop
      - name: Verify source SHA, strict GTO and NL2-OOP reach and preserve no false CERT
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_b457_rank45_first_board.py
          python3 tools/verify_b457_rank45_first_board.py --downloads ../downloads --run-id "$GITHUB_RUN_ID"
      - name: Full V51 CERT locks, exact b50-only research, and HU2475 navigation audit
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v51_b453_rank32.json --out /tmp/b457-base.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/b457-base.json'))
          assert (d['cert_multiboard'],d['approx'],d['EST'],d['models_total'])==(164,228,0,392)
          assert (d['aggregate']['named_board_proofs'],d['aggregate']['paired_hero_locked_source_variants'])==(621,713)
          assert d['not_generalized_handclass_GTO'] and d['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js >/tmp/b457-contract.json
          node tools/link_audit.js --md /tmp/b457-link.md --json /tmp/b457-link.json
          node tools/reach_verify.js --log /tmp/b457-reach.md --json /tmp/b457-reach.json
          node tools/hu_model_path_audit.js /tmp/b457-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          node -e 'const c=require("/tmp/b457-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B457 HU2475/2475")'
          git diff --check
      - name: Commit verified original source, or strict-negative, to PR2 draft
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b457_rank45_first_source_proof.json \
            data/solver_evidence/NL2_B457_R45_AS_KH_3D.json.gz \
            data/solver_evidence/NL2_B457_R45_AS_KH_3D.index.json \
            docs/NL2_HU_B457_R45_AS_KH_3D_SOURCE_PROOF.md
          git diff --cached --quiet && exit 1
          git commit -m 'B457: preserve authentic rank45 b100-call first GTO/NL2-OOP source; no premature CERT'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
          done
          exit 1
