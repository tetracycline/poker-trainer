name: B513 rank189 BB-IP rivers after a SB check, 33%-pot stab and full-pot turn bet
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b513-rank189-sbbb-rivers.yml', 'tools/hu_b513_rank189_native.py', 'data/nl2_hu_b513_rank189_artifacts.json']
permissions:
  contents: read
  actions: read
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        flop: [Ac8d2h, Ac6d3h, As7s2s]
        version: [gto, exp_ip]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve GTO and independent BB-IP pooled locks for the actual 33%-flop line
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot SB_BB \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy checked-b33only \
            --turn-line-policy default --lock-marginals-by-street --archive-empty-river-extraction --turn-count 1 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= len(m["turns"])
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert m["cases"] or len(m["skipped"]) == len(m["turns"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B513-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/SB_BB/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 90

  conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate and solve the original flop range with the new per-street NL2 lock
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL: "14628913050"
        run: |
          set -euo pipefail
          originals="$RUNNER_TEMP/originals"
          mkdir -p "$originals"
          api="repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL"
          gh api "$api" > "$originals/$ORIGINAL.json"
          gh api "$api/zip" > "$originals/$ORIGINAL.zip"
          args=(--originals "$originals" --solver pinned-solver)
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
          python tools/hu_b513_rank189_native.py "${args[@]}" --run "$GITHUB_RUN_ID" --results "$RUNNER_TEMP/result" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - uses: actions/upload-artifact@v4
        with:
          name: B513-native-As7h3d
          path: ${{ runner.temp }}/result/NL2_B513_*.json.gz
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: [fresh, conditional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'B513-native-*'
          path: ${{ runner.temp }}/results
      - name: Rebuild both private-hand ranges, exact bet menus and half-pot equity from original files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          originals="$RUNNER_TEMP/originals"
          mkdir -p "$originals" "$RUNNER_TEMP/results"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$originals/run.json"
          fresh_ids=$(jq -r '.artifacts[] | select(.name | test("^B513-(Ac8d2h|Ac6d3h|As7s2s)-(gto|exp_ip)$")) | .id' "$originals/run.json")
          for id in $fresh_ids $(jq -r 'keys[]' data/nl2_hu_b513_rank189_artifacts.json); do
            api="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            gh api "$api" > "$originals/$id.json"
            gh api "$api/zip" > "$originals/$id.zip"
          done
          python tools/hu_b513_rank189_native.py --originals "$originals" --solver pinned-solver --results "$RUNNER_TEMP/results" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA"
      - name: Audit all current routes and register only verified paired boards
        run: |
          set -euo pipefail
          shopt -s nullglob
          branch=fix/nl2-hu-lines-audit-20261118
          status=data/nl2_hu_multiboard_status_current.json
          files=(data/nl2_hu_b513_rank189_attempts.json data/solver_evidence/NL2_B513_*.json.gz data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R189_*.json.gz)
          if test -f data/solver_evidence/reverified/rank189.json; then files+=(data/solver_evidence/reverified/rank189.json data/nl2_hu_b513_locked_medium.json); fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            for file in "${files[@]}"; do
              if test -e "$live/$file"; then cmp "$file" "$live/$file"; fi
            done
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              python tools/hu_apply_cert_extensions.py --out "$status"
              python - "$status" <<'PYVERIFY'
          import json,sys
          report=json.load(open('data/nl2_hu_b513_rank189_attempts.json'))['model']
          model=json.load(open(sys.argv[1]))['records'][report['model_id']]
          if len(report['boards'])>=3:
              assert model['label']=='CERT-MULTIBOARD'
              assert {b['public_board'] for b in model['certified_3_to_5_exact_flop_boards']}=={b['public_board'] for b in report['boards']}
          PYVERIFY
              node tools/hu_b513_rank189_routes.cjs
              node tools/hu_b491_incremental_medium.cjs
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              git add -- "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B513: publish rank189 exact BB-IP 33%-flop and full-pot-turn rivers with source-specific half-pot and lock evidence'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
