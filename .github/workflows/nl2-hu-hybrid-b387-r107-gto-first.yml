name: NL2 B387 rank107 prereg GTO-first three new true Rust flops, positive-reach triage <=29m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b387-r107-gto-first.yml'
      - 'tools/hu_b387_r107_gto_first_three.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        flop: [As9h2d, Js9h4d, QsJh4d]
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Actual 100bb full-flop genuine GTO Rust CFR, source-only no NL2 assumptions
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py --solver-root solver --spot BTN_BB --flop "${{ matrix.flop }}" --version gto --flop-size-profile full --flop-line-policy oop-b33only --turn-count 1 --manifest "evidence/BTN_BB-${{ matrix.flop }}-gto.json"
      - name: Archive every original Rust source including zero-target-combo and unfinished jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B387_R107_GTO_FIRST-BTN_BB-${{ matrix.flop }}-gto
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent real GTO SHA, exact actor, SPR and max/40-70 full-street triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b387-raw-sources
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/b387-raw-sources
          python3 -m py_compile tools/hu_b387_r107_gto_first_three.py
          python3 tools/hu_b387_r107_gto_first_three.py --downloads /tmp/b387-raw-sources --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b387-source-gate.json
      - name: Full HU2475 river links, model reach, front end, source and first10 frozen audit
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b387-contract.json
          node tools/link_audit.js --md /tmp/b387-link.md --json /tmp/b387-link.json
          node tools/reach_verify.js --log /tmp/b387-reach.md --json /tmp/b387-reach.json
          node tools/hu_model_path_audit.js /tmp/b387-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b387-source-gate.json'))
          q=json.load(open('data/nl2_hu_b387_rank107_gto_first_three_frozen_flops.json'))
          c=json.load(open('/tmp/b387-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['no_early_CERT_label'] and len(q['actual_genuine_GTO_only_sources'])==3
          assert set(q['candidate_flops_eligible_for_future_matching_real_NL2_IP_partial_lock'])<=set(q['preregistered_candidate_flops'])
          print('PASS B387 three original GTO-only source triages, 159/233, HU2475/2475')
          PY
          git diff --check
      - name: Commit and push exact original source result, never merge or falsely promote CERT
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b387_rank107_gto_first_three_frozen_flops.json docs/NL2_HU_B387_RANK107_GTO_FIRST_THREE_PROBE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B387: original rank107 GTO-first three exact flops, SHA/40-70 source gate, 159/233'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
