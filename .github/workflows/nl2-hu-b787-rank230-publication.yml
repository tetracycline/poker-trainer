name: B787 replay rank230 and audit its immutable data candidate
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['data/nl2_hu_b787_source_manifest.json']
permissions: {contents: write, actions: read, pull-requests: read}
jobs:
  replay-audit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nl2-hu-lines-audit-20261118
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy phevaluator==0.5.3.1
      - name: Authenticate the final native workers and replay the exact original jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git merge-base --is-ancestor 2e4609d2ff934037b9bdc2f9fd0e998499eff931 HEAD
          python tools/hu_b787_collect.py --output "$RUNNER_TEMP/b787-original"
          cmp data/nl2_hu_b787_source_manifest.json "$RUNNER_TEMP/b787-original/receipt.json"
          python tools/hu_b787_rank230.py --solver pinned-solver \
            --receipts "$RUNNER_TEMP/b787-original/receipt.json" --archives "$RUNNER_TEMP/b787-original" \
            --output "$RUNNER_TEMP/b787-stage/data" > "$RUNNER_TEMP/b787-replay.txt"
          git diff --exit-code -- data/
      - name: Preserve 391 unrelated decisions and stage only verified rank230 evidence
        run: |
          set -euo pipefail
          python tools/hu_b787_integrate.py --stage "$RUNNER_TEMP/b787-stage/data" \
            --paths "$RUNNER_TEMP/b787-paths.txt" --group "$RUNNER_TEMP/b787-group.txt"
          group=$(cat "$RUNNER_TEMP/b787-group.txt")
          if jq -e '.boards | length > 0' "$group" >/dev/null; then node tools/hu_b679_policy_view.cjs "$group"; fi
          sha256sum data/nl2_hu_multiboard_status_current.json data/nl2_hu_verified_extensions.json \
            data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json > "$RUNNER_TEMP/b787-integrated.sha256"
      - name: Run the complete published-batch audit on the candidate tree
        run: |
          set -euo pipefail
          registry=data/nl2_hu_multiboard_status_current.json
          python tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/b787-rebuilt.json"
          cmp "$registry" "$RUNNER_TEMP/b787-rebuilt.json"
          node tools/hu_extension_runtime_test.cjs "$registry"
          bash tools/hu_exact_batch_audit.sh "$registry"
          git fetch --quiet --no-tags --depth=1 origin d0fe026b3cd59b50450f99471bd27c55e7d4b522
          python tools/hu_b491_incremental_medium.py
          node tools/hu_b491_incremental_medium.cjs
          node tools/hu_b483_lock_medium_ui.cjs
          node tools/hu_b485_medium_viewers.cjs
          node tools/hu_b492_medium_tree_ui.cjs
          node tools/hu_b584_optional_river_ui.cjs
          python tools/hu_current_medium_coverage.py --out "$RUNNER_TEMP/b787-coverage.json"
          sha256sum -c "$RUNNER_TEMP/b787-integrated.sha256"
      - name: Create the audited single-parent candidate for the open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          mapfile -t paths < "$RUNNER_TEMP/b787-paths.txt"
          GITHUB_SHA="$parent" python tools/hu_publish_candidate.py \
            --message 'B787 verify the third distinct checked SB/BTN original and preserve rank230 decisions' \
            --paths "${paths[@]}" | tee "$RUNNER_TEMP/b787-candidate.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B787-original-rank230-publication
          path: |
            ${{ runner.temp }}/b787-stage/data/nl2_hu_b787_results.json
            ${{ runner.temp }}/b787-replay.txt
            ${{ runner.temp }}/b787-paths.txt
            ${{ runner.temp }}/b787-coverage.json
            ${{ runner.temp }}/b787-candidate.txt
            data/nl2_hu_b787_integration.json
          if-no-files-found: warn
          retention-days: 90
