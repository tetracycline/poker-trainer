name: B833 rank75 two new monotone gutshot originals
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b833-rank75-new-monotone.yml'
      - 'tools/hu_b833_rank75_new_monotone.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [9d8d2d, Td8d6d]
    env:
      FLOP: ${{ matrix.flop }}
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Preflight exact actor/size/mono displayed QJo turn checks
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b833_rank75_new_monotone.py --preflight --solver pinned-solver --flop "$FLOP" --output "$RUNNER_TEMP/preflight"
      - name: Build pinned native solver
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve each original root once and preserve its checkpoint
        run: |
          set -euo pipefail
          python tools/hu_b833_rank75_new_monotone.py --solver pinned-solver --flop "$FLOP" --checkpoint-only --output "$RUNNER_TEMP/b833-root" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - uses: actions/upload-artifact@v4
        with:
          name: B833-root-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b833-root
          if-no-files-found: error
          retention-days: 90
      - name: Reuse exact original root and solve GTO plus measured NL2 partial locks
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/b833-source"
          python tools/hu_b833_rank75_new_monotone.py --solver pinned-solver --flop "$FLOP" --output "$path" --checkpoint "$RUNNER_TEMP/b833-root" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$path/proof.json" "$RUNNER_TEMP/original-proof"
          python tools/hu_b833_rank75_new_monotone.py --solver pinned-solver --flop "$FLOP" --output "$path"
          cmp "$RUNNER_TEMP/original-proof" "$path/proof.json"
          cmp "$RUNNER_TEMP/b833-root/flop/job.json" "$path/flop/job.json"
          cmp "$RUNNER_TEMP/b833-root/flop/result.json" "$path/flop/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B833-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b833-source
          if-no-files-found: error
          retention-days: 90
