name: TASK-HYBRID B111 V26 original B2 GTO+B108 two true CO_BB actor-IP CERT (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b111-two-cert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-and-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently verify B107 individual original B2 GTO, real B108 actor-IP SHA+reach, ranks215+220 source-blind frozen
        run: |
          set -euo pipefail
          test -s data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.index.json
          test -s data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.json.gz
          python3 -m py_compile tools/hu_b111_v26_rank215_220.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b111_v26_rank215_220.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independent V25 immutable gate, two real CO_BB actor IP models, 539 exact board lock sources, Batch E and 2475 river links
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          old='data/nl2_hu_multiboard_status_v25_b106_rank135.json'
          new='data/nl2_hu_multiboard_status_v26_b111_rank215_220.json'
          a=json.load(open(old));b=json.load(open(new))
          matrix=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v26.json'))
          ix=json.load(open('data/solver_evidence/NL2_MULTIBOARD_B108_CO_XB33_XB100.index.json'))
          pin=json.load(open('data/nl2_hu_b107_co_js9h4d_b2_gto_parent_pin.json'))
          nav=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert (a['CERT_MULTIBOARD'],a['APPROX'])==(135,257)
          assert (b['CERT_MULTIBOARD'],b['APPROX'],b['TOTAL'])==(137,255,392)
          assert b['parent_v25_sha256']==hashlib.sha256(open(old,'rb').read()).hexdigest()
          assert b['B107_original_B2_GTO_pin_SHA256']==hashlib.sha256(
              open('data/nl2_hu_b107_co_js9h4d_b2_gto_parent_pin.json','rb').read()).hexdigest()
          assert pin['B2_failed_SB3_BTN_GTO_job_explicitly_excluded']
          assert ix['original_GTO_flop_NOT_recomputed'] and ix['original_gto_parent_run']==44666290556
          assert ix['run_id']==44832882376 and ix['exact_ip_hero_river_actor_nodes']>0
          changed={k for k in a['records'] if a['records'][k]!=b['records'][k]}
          assert changed=={'ln-ipfr-r_model-2h1iyv','ln-ipfr-r_model-nzfk3y'}
          assert b['source_blind_expansion_ranks']==[215,220] and len(b['b111_certificates'])==2
          for mid in changed:
              r=b['records'][mid]
              assert r['label']=='CERT-MULTIBOARD'
              boards=r['certified_3_to_5_exact_flop_boards']
              assert len(boards)==3 and {x['flop'] for x in boards}=={'8s8h3d','As9h2d','Js9h4d'}
              assert all(x['acting_seat']==1 and x['strict_full_street_combo_reachable']>0 and
                         x['nl2_locked_variants'] and x['relative_spr_error_pct']<=5 for x in boards)
              fresh=next(x for x in boards if x['flop']=='Js9h4d')
              assert fresh['source_run_id']==44666290556
              assert any(v['run_id']==ix['run_id'] for v in fresh['nl2_locked_variants'])
          assert b['records']['ln-ipfr-t_model-sxr0qa']['label']=='APPROX'
          assert matrix['CERT_MULTIBOARD']==137 and matrix['APPROX']==255
          assert len(matrix['boards'])==matrix['strict_aggregate']['named_board_proofs']==539
          assert matrix['parent_v26_status_sha256']==hashlib.sha256(open(new,'rb').read()).hexdigest()
          assert all(x['hero_lock_proofs'] and x['strictly_reachable_combo_count']>0 and
                     x['no_general_bet_size_recommendation'] for x in matrix['boards'])
          e=b['independently_verified_completed_batches']['B4_MICRO']
          assert e['status']=='VERIFIED' and e['run_id']==44732810327 and e['gto_cases']==e['locked_cases']==30
          assert nav['continuing']==nav['reach_river']==2475 and nav['share_pct']==100
          assert nav['missing_river']==nav['link_misses']==nav['reach_violations']==nav['modeled_path_violations']==0
          print('PASS B111 137 CERT /255 APPROX, 539 true board locks; 2 IP river models, E+2475 links')
          PY
      - name: Both frontend loaders must load V26 through every V1 fallback as decoded JSON
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const versions=[
            'v26_b111_rank215_220','v25_b106_rank135','v24_b103_rank43','v23_b100_lmp_pair',
            'v22_batch94','v21_batch92','v20_batch90','v19_batch88','v18_batch86',
            'v17_batch84','v16_batch82','v15_batch80','v14_batch77','v13_batch75',
            'v12_batch73','v11_batch71','v10_batch69','v9_rank40_b67','v8_batch61',
            'v7_batch59','v6_rank33','v5_batch55','v4_batch50','v3_rank28','v2_tie'];
          const urls=versions.map(x=>'data/nl2_hu_multiboard_status_'+x+'.json');
          urls.push('data/nl2_hu_multiboard_status.json');
          assert.equal(urls.length,26);
          const data=urls.map(x=>JSON.parse(fs.readFileSync(x,'utf8')));
          async function check(path){
            const s=fs.readFileSync(path,'utf8');
            const a=s.indexOf('function fetchCertifiedRegistry(){');
            const b=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',a);
            assert(a>=0&&b>a&&!s.includes('fetchCertifiedRegistry()\n .then(r=>'));
            const chunk=s.slice(a,b);
            const fetched=[...chunk.matchAll(/fetch\('([^']+)'/g)].map(x=>x[1]);
            assert.deepEqual(fetched,urls);
            const fn=new Function('fetch',chunk+';return fetchCertifiedRegistry();');
            for(let i=0;i<urls.length;i++){
              const seen=[],got=await fn(async url=>{
                const j=urls.indexOf(url);assert(j>=0);
                seen.push(j);
                return j<i?{ok:false,status:404}:{ok:true,json:async()=>data[j]};
              });
              assert.strictEqual(got,data[i]);
              assert.deepEqual(seen,Array.from({length:i+1},(_,j)=>j));
            }
          }
          (async()=>{await check('nl2-multiboard.js');await check('nl2_hu_multiboard_ui.js');
             console.log('PASS V26 through V1 all 26 fallbacks on BOTH UIs');})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Commit authenticated two-model V26 proof and all 539 named NL2 lock/medium rows to PR#2 Draft, never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v26_b111_rank215_220.json data/nl2_hu_cert_lock_medium_matrix_v26.json docs/NL2_HU_B111_V26_TWO_CERT.md docs/NL2_HU_B111_V26_ALL_LOCKS_MEDIUM.md
          git commit -m 'TASK-HYBRID B111: B107 original B2 plus authentic B108 actor-IP river, ranks215/220 V26 137 CERT/255 APPROX'
          for retry in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$retry"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B111-V26-two-CO-BB-true-CERT
          path: |
            data/nl2_hu_multiboard_status_v26_b111_rank215_220.json
            data/nl2_hu_cert_lock_medium_matrix_v26.json
            docs/NL2_HU_B111_V26_TWO_CERT.md
            docs/NL2_HU_B111_V26_ALL_LOCKS_MEDIUM.md
          retention-days: 30
