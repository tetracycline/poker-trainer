name: TASK-HYBRID B281 V41 rank71 six original GTO SHA 0-actor source dedup, 590 lock HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b281-v41-r71-six-100bb-zero-actor-sha-dedup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank71-original-100bb-six-negative-sha-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recompute six original 100bb Rust GTO raw+gzip SHA and strict BB-OOP exact-line 0-combo negatives without extrapolating turn or tree
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b281_v41_rank71_exact_100bb_zero_actor_source_dedup.py
          python3 tools/hu_b281_v41_rank71_exact_100bb_zero_actor_source_dedup.py
      - name: Recheck immutable B175 two positive rank71 GTO/NL2 actor sources, B173 exact duplicate of B276, V41 154/238
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('data')
          file=d/'nl2_hu_b281_v41_rank71_sha_zero_legal_actor_flop_dedup.json'
          x=json.loads(file.read_text())
          assert x['schema']=='NL2_HU_B281_V41_R71_GENUINE_GTO_ZERO_STRICT_ACTOR_SHA_DEDUP_V1'
          assert (x['CERT_MULTIBOARD'],x['APPROX'],x['EST'],x['TOTAL'])==(154,238,0,392)
          assert x['V41_status_sha256']==hashlib.sha256((d/'nl2_hu_multiboard_status_v41_b271_rank61.json').read_bytes()).hexdigest()
          assert x['parent_B278_sourceblind_sha256']==hashlib.sha256((d/'nl2_hu_b278_v41_238_approx_rank46_and_71_oneflop_true_sourceblind.json').read_bytes()).hexdigest()
          assert x['prior_rank71_two_genuine_GTO_plus_NL2_hero_pair_flops']==['4s4h2d','7s5h3d']
          assert x['zero_legal_actor_known_exact_flop_turn_pairs']==6
          a=x['exact_rank71_OOP_river_negative_100bb_GTO_sources']
          assert len(a)==6 and len({r['flop'] for r in a})==6
          assert all(r['strict_legal_hero_combos']==0 and r['actor']==0 and
              r['exact_line']=='b50 c/x b50 c/' and
              r['constrained_scope']=='EXACT_PUBLIC_FLOP_TURN_LINE_100BB_SOURCE_ONLY' and
              len(r['source_sha256'])==len(r['gzip_sha256'])==64 for r in a)
          assert {r['flop'] for r in a}=={
            'Ks7h2d','9s6h3d','7s7h2d','8s8h3d','9s8h4d','2s4h6d'}
          assert x['queued_B276_same_9s6h3d_Ts_exact_source_was_previously_tested_by_B173']
          assert x['queued_B274_and_B275_different_flops_are_not_proven_by_this_register']
          assert x['all_source_SHA_bytes_independently_rechecked'] and x['no_automatic_CERT_upgrade']
          assert x['no_extrapolation_to_different_turn_or_tree']
          assert x['no_unknown_NL2_hole_card_rates_fabricated'] and x['PR2_Draft_NEVER_MERGE']
          print('PASS B281 six original GTO SHA zero actor BB-OOP exact line and no fake third CERT')
          PY
      - name: Full independent 590 true named GTO/real NL2 actor locked source, 134 b50 exact candidate and HU2475 route/contract
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v41_b271_rank61.json --out nl2-audit/b281-lock-medium.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b281-lock-medium.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(154,238,0)
          assert (a['aggregate']['named_board_proofs'],
             a['aggregate']['paired_hero_locked_source_variants'],
             a['aggregate']['board_examples_with_b50_candidate'])==(590,682,134)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS V41 B281 HU2475/2475")'
      - name: Commit only after SHA verified negative sources, 590 real source locks and 2475 HU PASS, PR2 Draft never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b281_v41_rank71_sha_zero_legal_actor_flop_dedup.json               docs/NL2_HU_B281_RANK71_SIX_SHA_PINNED_ZERO_ACTOR_FLOP_DEDUP.md
          git commit -m 'TASK-HYBRID B281: six real rank71 GTO 0-actor sources SHA verified, no B276 duplicate promotion, all 590 GTO/NL2 source locks HU2475 PASS'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NL2-HU-B281-V41-rank71-six-exact-zero-actor-SHA-HU2475
          path: |
            data/nl2_hu_b281_v41_rank71_sha_zero_legal_actor_flop_dedup.json
            docs/NL2_HU_B281_RANK71_SIX_SHA_PINNED_ZERO_ACTOR_FLOP_DEDUP.md
            nl2-audit/
          retention-days: 30
