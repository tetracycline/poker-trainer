name: TASK-HYBRID B353 rank79 authentic original stage2 44654973894 UTGCO Ks7h2d GTO+NL2 CO-IP SHA exact 40-70 SPR7 V45/HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b353-r79-historic-b2-ks7h2d-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-source-authentication-and-HU2475:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently download and SHA audit authentic source run 44654973894 original UTGCO GTO and real NL2 IP and official batch05 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44654973894" --jq .conclusion)" = success
          mkdir -p downloads/gto downloads/exp_ip downloads/provenance
          gh run download 44654973894 --repo "$GITHUB_REPOSITORY" --name 'nl2-stage2-UTG_CO-gto-Ks7h2d' --dir downloads/gto
          gh run download 44654973894 --repo "$GITHUB_REPOSITORY" --name 'nl2-stage2-UTG_CO-exp_ip-Ks7h2d' --dir downloads/exp_ip
          gh run download 44654973894 --repo "$GITHUB_REPOSITORY" --name 'nl2-stage2-batch05-verified-provenance' --dir downloads/provenance
          test -s downloads/provenance/STAGE2_BATCH05.json
          test -s downloads/gto/evidence/UTG_CO-gto-Ks7h2d.json
          test -s downloads/exp_ip/evidence/UTG_CO-exp_ip-Ks7h2d.json
          python3 -m py_compile tools/hu_b353_rank79_B2_historic_real_UTGCO_gto_nl2_ip.py
          python3 tools/hu_b353_rank79_B2_historic_real_UTGCO_gto_nl2_ip.py --downloads downloads \\
            --out data/nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=pathlib.Path('data')
          x=json.loads((d/'nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json').read_text())
          assert x['schema']=='NL2_HU_B353_R79_STAGE2_ORIGINAL_KS7H2D_9D_GTO_AND_NL2_CO_IP_V1'
          assert x['authenticated_original_stage2_run']==44654973894
          assert (x['hero_actor'],x['spot'],x['flop'],x['turn'],x['line'])==('CO_IP','UTG_CO','Ks7h2d','9d','b50 c/x')
          assert x['original_source_stage2_conclusion_success']
          assert x['original_40_70_B175_GTO_strict_combos']==18
          assert x['genuine_UTGCO_source_GTO']['true_actor_CO_IP_reached_combos']>0
          assert x['genuine_UTGCO_real_NL2_CO_IP_source']['true_actor_CO_IP_reached_combos']>0
          assert x['CURRENT_CERT']==157 and x['CURRENT_APPROX']==235
          print('PASS B353 original true stage2 GTO+NL2 CO IP full historical SHA exact source')
          PY
      - name: Independently full V45 157/235 600 original true GTO plus actor NL2 lock692 134 b50 exact and 2475 HU river paths regression
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v45_b345_rank71.json --out nl2-audit/b353-source.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b353-source.json'))
          b=json.load(open('data/nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(157,235,0)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'],
               a['aggregate']['board_examples_with_b50_candidate'])==(600,692,134)
          assert b['still_requires_two_other_distinct_original_GTO_and_real_NL2_actor_locked_flops']
          assert b['no_observed_private_card_conditional_NL2_frequency']
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B353 HU 2475/2475")'
      - name: Commit source-verified original stage2 GTO+real NL2 CO IP run Ks7h2d only after V45 and HU2475 complete PASS
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json
          z=json.load(open('data/nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json'))
          n=z['genuine_UTGCO_source_GTO']['true_actor_CO_IP_reached_combos']
          m=z['genuine_UTGCO_real_NL2_CO_IP_source']['true_actor_CO_IP_reached_combos']
          pathlib.Path('docs/NL2_HU_B353_R79_TRUE_STAGE2_ORIGINAL_GTO_NL2_COIP.md').write_text(
             '# B353 rank79 authentic original stage2 UTGCO Ks7h2d GTO plus genuine NL2 IP source\n\n'
             'Original successful GitHub Actions run 44654973894, stage2 batch05 original Rust CFR GTO and genuine NL2 CO-IP sources independently SHA pinned against original root/turn/reach and verified batch05 artifact. '
             'Exact board Ks7h2d/9d, action b50 c/x, CO-IP, SPR7 +/-5%, original strategy highest/40/70 source. '
             'Original GTO reached '+str(n)+' combos, genuine real NL2 CO-IP reached '+str(m)+' combos on original same public turn; B175 stricter source audit original GTO 18 legal combos. '
             'The unrelated FAILED B2 run 44666290556 was NOT used: no misattributed original source. '
             'Only one historical paired flop; two new independent GTO+NL2 actor-matched flops across multiple textures still required for rank79 CERT. '
             'Pool observation is street/size marginal, NOT measured conditional on opponent hole cards. '
             'Unchanged V45 157 CERT/235 APPROX, 600 original GTO+true partial NL2 source named boards and 692 actor locks; HU 2475/2475 independently PASS. '
             'PR2 Draft NEVER merge or force-push.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json docs/NL2_HU_B353_R79_TRUE_STAGE2_ORIGINAL_GTO_NL2_COIP.md
          git commit -m 'TASK-HYBRID B353: authentic original stage2 run 44654973894 true UTGCO Ks7h2d GTO+NL2 IP SHA 40-70 SPR7 and V45 600 HU2475 PASS no false B2'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B353-rank79-historical-B2-real-GTO-NL2-COIP-SHA-HU2475
          path: |
            data/nl2_hu_b353_rank79_historic_stage2_original_gto_real_nl2_ip_source.json
            docs/NL2_HU_B353_R79_TRUE_STAGE2_ORIGINAL_GTO_NL2_COIP.md
            nl2-audit/
          retention-days: 30
