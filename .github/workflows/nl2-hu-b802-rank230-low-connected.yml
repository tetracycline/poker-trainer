name: B802 solve two distinct rank230 checked low connected flops
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b802-rank230-low-connected.yml'
      - 'tools/hu_b802_rank230_low_connected.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        flop: [8s7h6s, 9s7h5s]
    env:
      FLOP: ${{ matrix.flop }}
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify J7 suited, its compatible BTN hand and the displayed three-street route
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b802_rank230_low_connected.py --preflight --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native driver
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve the original native flop once with three registered checked boundaries
        run: |
          set -euo pipefail
          python tools/hu_b802_rank230_low_connected.py --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/b802-source" --root-only --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - name: Preserve the completed original before turn solves
        uses: actions/upload-artifact@v4
        with:
          name: B802-root-R230-${{ matrix.flop }}
          path: |
            ${{ runner.temp }}/b802-source/root-checkpoint.json
            ${{ runner.temp }}/b802-source/flop/
          if-no-files-found: error
          retention-days: 90
      - name: Solve reachable turns and replay real two-seat strategy checks
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/b802-source"
          python tools/hu_b802_rank230_low_connected.py --flop "$FLOP" --solver pinned-solver --output "$path" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$path/proof.json" "$RUNNER_TEMP/b802-proof"
          python tools/hu_b802_rank230_low_connected.py --flop "$FLOP" --solver pinned-solver --output "$path"
          cmp "$RUNNER_TEMP/b802-proof" "$path/proof.json"
      - name: Preserve both strategies and all positive and negative source decisions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B802-R230-${{ matrix.flop }}
          path: ${{ runner.temp }}/b802-source
          if-no-files-found: error
          retention-days: 90
