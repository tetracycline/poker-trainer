name: NL2 B420 rank166 durable SHA-pinned original Rust CFR combo archives, source viewer, HU2475 (max11m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b420-r166-persistent-source.yml'
      - 'tools/hu_b420_r166_persistent_original.py'
      - 'data/nl2_hu_b417_rank166_three_true_source_cert_proof.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate-archive-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require actual B405 verified CERT162 and all exact-source lock guards, fail closed on missing
        id: ready
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b420_r166_persistent_original.py
          if [ ! -s data/nl2_hu_b417_rank166_three_true_source_cert_proof.json ];then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json,os
          x=json.load(open('data/nl2_hu_b417_rank166_three_true_source_cert_proof.json'))
          ok=(x.get('CERT_after'),x.get('APPROX_after'),x.get('named_boards_after'),x.get('hero_lock_variants_after'))==(163,229,618,710)
          ok=ok and x.get('original_100bb_rust_actual_GTO_and_NL2_IP_same_public_line_SPR') and x.get('all_three_flop_strict_40_70_hero_combo_positive') and x.get('unknown_lock_denominators_after')==0
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+('true' if ok else 'false')+'\n')
          print('B420 authentic source original archive eligible:',ok)
          PY
      - name: Fetch actual B393 original GTO and B396 partially NL2 IP locked full CFR Rust sources
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b420-gto /tmp/b420-exp
          for flop in KcJh7d QhTc5d;do
            gh run download 45028060598 --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B400_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto" \
              --dir "/tmp/b420-gto/nl2-multiboard-B400_COBB_FIVE_GTO_FIRST-CO_BB-${flop}-gto"
            gh run download 45029267778 --repo "$GITHUB_REPOSITORY" --name "nl2-multiboard-B407_R166_NL2_IP-CO_BB-${flop}-exp_ip" \
              --dir "/tmp/b420-exp/nl2-multiboard-B407_R166_NL2_IP-CO_BB-${flop}-exp_ip"
          done
      - name: Independently verify complete actual Rust CFR per-combo original hashes and gzip preserve all certified pairs
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 tools/hu_b420_r166_persistent_original.py --solver-root solver --gto /tmp/b420-gto --exp /tmp/b420-exp
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b420-source-audit.json
          python3 - <<'PY'
          import json
          x=json.load(open('data/nl2_hu_b420_rank166_persistent_source_index.json'))
          a=json.load(open('/tmp/b420-source-audit.json'))
          assert x['original_GTO_and_NL2_IP_source_SHA_pairing_verified']
          assert len(x['durable_immutable_gzip_CFR_source_archives'])==2
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(163,229,0)
          print('PASS B420 two real original source archive batches, certified CO-IP 163/229')
          PY
      - name: Wire exact source IDs to viewer without incorrectly treating partial NL2 lock as original GTO
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('nl2-multiboard.js')
          s=p.read_text(encoding='utf-8')
          anchor="if(!batch)return null;"
          assert s.count(anchor)==1
          addon="""if(!batch && chosenModel?.model_id==='ln-ipfr-r_model-1spq1ko' &&
             status?.schema==='NL2_HU_392_MULTIBOARD_CERT_STATUS_V50_B417_R166'){
             const verifiedOriginalRuns={45028060598:'B420_COBB_B400',45029267778:'B420_COBB_B407'};
             const code=verifiedOriginalRuns[run];
             if(code)batch=[code,{run_id:run,status:'VERIFIED'}];
           }
           """
          p.write_text(s.replace(anchor,addon+anchor),encoding='utf-8')
          h=pathlib.Path('nl2-multiboard.html');t=h.read_text()
          assert t.count('task-hybrid-b417-v50-20261122')==1
          h.write_text(t.replace('task-hybrid-b417-v50-20261122','task-hybrid-b420-persistent-20261122'))
          r=pathlib.Path('tools/hu_b378_v47_loader_runtime_test.cjs')
          u=r.read_text();needle='414-persistent|417-v50'
          assert u.count(needle)==1
          r.write_text(u.replace(needle,needle+'|420-persistent'))
          PY
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
      - name: Full HU2475/2475 links, action contract, sequential reach, model paths, source label, V49 frontend
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b420-contract.json
          node tools/link_audit.js --md /tmp/b420-link.md --json /tmp/b420-link.json
          node tools/reach_verify.js --log /tmp/b420-reach.md --json /tmp/b420-reach.json
          node tools/hu_model_path_audit.js /tmp/b420-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node -e 'const c=require("/tmp/b420-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B420 HU2475/2475")'
          git diff --check
      - name: Commit and push only original authenticated persistent Rust CFR sources plus source viewer, never merge PR2
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B420_COBB_B400.json.gz \
            data/solver_evidence/NL2_MULTIBOARD_B420_COBB_B407.json.gz \
            data/nl2_hu_b420_rank166_persistent_source_index.json \
            docs/NL2_HU_B420_R166_PERSISTENT_REAL_SOURCE.md \
            nl2-multiboard.js nl2-multiboard.html tools/hu_b378_v47_loader_runtime_test.cjs
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B420: preserve SHA-authenticated rank166 100bb Rust GTO+NL2 per-combo sources, viewer and HU2475'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
