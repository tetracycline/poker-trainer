name: B487 rank14 and rank113 BB re-verification on three archived GTO flops
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b487-cobb-checked-turn.yml'
      - 'tools/hu_b487_cobb_turn_river.py'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        flop: [Js9h3d, Js9s4s, Td8h3c]
        version: [exp_oop]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve the BB lock on the original full flop menu and extract checked-through rivers
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot CO_BB \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy checked-b50only \
            --turn-line-policy checkcheck --lock-marginals-by-street --turn-count 1 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= 1
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert m["cases"] or len(m["skipped"]) == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NL2-B487-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/CO_BB/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 90

  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: NL2-B487-*
          path: ${{ runner.temp }}/b487-new
      - name: Verify immutable original GTO and matching locked sources for both BB decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/b487-originals"
          mkdir -p "$dir"
          for id in $(python3 tools/hu_b487_cobb_turn_river.py --list-artifacts); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$dir/$id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/$id.zip"
          done
          python3 tools/hu_b487_cobb_turn_river.py --originals "$dir" --fresh "$RUNNER_TEMP/b487-new" --run-id "$GITHUB_RUN_ID"
          node tools/hu_b487_model_routes.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: B487-originals-and-paired-rank14-113-proof
          path: |
            data/nl2_hu_b487_cobb_reach.json
            data/solver_evidence/NL2_B487_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R14_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R113_*.json.gz
            data/solver_evidence/reverified/rank14.json
            data/solver_evidence/reverified/rank113.json
          if-no-files-found: error
          retention-days: 90
      - name: Audit the live cumulative registry and publish the verified board groups
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          status=data/nl2_hu_multiboard_status_current.json
          shopt -s nullglob
          files=(data/nl2_hu_b487_cobb_reach.json data/solver_evidence/NL2_B487_*.json.gz
                 data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R14_*.json.gz data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R113_*.json.gz)
          for rank in 14 113; do
            ext="data/solver_evidence/reverified/rank$rank.json"
            if [[ -f "$ext" ]]; then files+=("$ext"); fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              python3 tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/nl2_hu_multiboard_status_current.json').read_bytes())
          for rank in [14,113]:
              group=Path(f'data/solver_evidence/reverified/rank{rank}.json')
              if not group.is_file(): continue
              e=json.loads(group.read_bytes())
              model=reg['records'][e['model_id']]
              assert model['label']=='CERT-MULTIBOARD' and len(e['boards'])>=3
              assert {b['flop'] for b in e['boards']}=={b['flop'] for b in model['certified_3_to_5_exact_flop_boards']}
          PY
              git add "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              if ! git diff --cached --quiet; then git commit -m 'B487: reverify exact CO-BB turn and river decisions with original GTO and locked sources'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
