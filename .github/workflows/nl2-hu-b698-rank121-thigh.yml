name: B698 solve three new T-high two-tone BB rank121 flops after strict root gates
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b698-rank121-thigh.yml'
      - 'tools/hu_b698_rank121_thigh.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [Ts9s6h, Th9h5c, Td8d4s]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact BB check-call prices and build the pinned engine
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b682_stage_prices.py --apply
          python -m py_compile tools/hu_b698_rank121_thigh.py
          node tools/hu_b686_rank121_routes.cjs > "$RUNNER_TEMP/b698-routes.json"
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve original roots and only reachable displayed turn decisions with actor locks
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/b698/$FLOP"
          python tools/hu_b698_rank121_thigh.py --solver pinned-solver --flop "$FLOP" --output "$output" \
            --routes "$RUNNER_TEMP/b698-routes.json" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$output/proof.json" "$RUNNER_TEMP/b698-proof.json"
          python tools/hu_b698_rank121_thigh.py --solver pinned-solver --flop "$FLOP" --output "$output" \
            --routes "$RUNNER_TEMP/b698-routes.json"
          cmp "$output/proof.json" "$RUNNER_TEMP/b698-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B698-R121-${{ matrix.flop }}
          path: ${{ runner.temp }}/b698/${{ matrix.flop }}
          if-no-files-found: error
          retention-days: 90

