name: TASK-HYBRID B121 rank41 fast true actor-IP CO_BB turn-only child from SHA-pinned B114 GTO (max28m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b121-rank41-fast-child.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch only immutable finished successful B114 GTO raw flop, not the still-running EXP flop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p gto_parent
          gh run download 44836834970 --repo "$GITHUB_REPOSITORY" --name 'nl2-multiboard-B114_R41_CO_XX-CO_BB-gto-8s8h3d' --dir gto_parent
          test -s gto_parent/evidence/CO_BB-gto-8s8h3d.json
          test -s gto_parent/solver/postflop/out/CO_BB/gto/8s8h3d_multiboard.json
          test -s gto_parent/solver/postflop/out/CO_BB/gto/8s8h3d_multiboard.job.json
      - name: Compile pinned authentic Rust CFR, strict B114 GTO parent SHA audited
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_b121_co_turnonly_from_b114.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve real Rust turn-only NL2 actor-IP x-x / turn 5s from unchanged B114 root
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-engine-pin.txt
          python3 trainer/tools/solve_hu_b121_co_turnonly_from_b114.py --solver-root solver --gto-artifact-root gto_parent --manifest evidence/CO_BB-8s8h3d-xx-exp_ip.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B121_CO_XX_XB50-CO_BB-exp_ip-8s8h3d
          path: |
            evidence/
            solver/postflop/out/
          retention-days: 30
          if-no-files-found: warn
  verify-and-commit:
    needs: solve
    if: ${{ needs.solve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download one verified genuine Rust turn-only IP NL2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name='nl2-multiboard-B121_CO_XX_XB50-CO_BB-exp_ip-8s8h3d'
          mkdir -p "downloads/$name"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "downloads/$name"
          test -s "downloads/$name/evidence/CO_BB-8s8h3d-xx-exp_ip.json"
      - name: Independent source SHA, strict combo reach, exact actor and original B114 GTO root checksum
        run: |
          set -euo pipefail
          mkdir -p trainer/data/solver_evidence
          python3 trainer/tools/verify_hu_multiboard_100bb.py --downloads downloads --solver-root solver --run-id "$GITHUB_RUN_ID" --out trainer/data/solver_evidence/NL2_MULTIBOARD_B121_CO_XX_XB50.json
      - name: Preserve SHA-authenticated exact turn actor-IP source and strict source-blind target gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,pathlib
          p=pathlib.Path('trainer/data/solver_evidence/NL2_MULTIBOARD_B121_CO_XX_XB50.json')
          d=json.loads(p.read_text())
          assert d['schema']=='NL2_HU_MULTIBOARD_PINNED_CFR_CERT_EVIDENCE_V1'
          assert not d['errors'] and len(d['artifacts'])==1
          assert d['exact_board_gto_sources']==0
          assert d['imputed_pool_locked_sources']==d['new_authentic_board_cases']>=1
          a=d['artifacts'][0]
          assert (a['spot'],a['version'],a['flop'])==('CO_BB','exp_ip','8s8h3d')
          assert not a['errors'] and len(a['cases'])==1
          c=a['cases'][0]
          assert (c['flop_line'],c['turn'])==('x x','5s')
          hero=[n for n in c['nodes'] if n['exact_node_line']=='x x/x' and
             n['acting_seat']==1 and n['strictly_reachable_combos']>0]
          reason=None if hero else 'NO_STRICT_ACTOR_IP_TURN_COMBOS_KEEP_RANK41_APPROX'
          raw=p.read_bytes()
          gz=p.with_suffix('.json.gz')
          gz.write_bytes(gzip.compress(raw,compresslevel=9,mtime=0))
          idx=dict(schema='NL2_MULTIBOARD_VERIFIED_ARCHIVE_INDEX_V1',
            batch='B121_CO_XX_XB50',run_id=d['source_run_id'],
            actual_spot_flop_version_jobs=1,
            verified_cases=d['new_authentic_board_cases'],
            gto_cases=0,locked_cases=d['imputed_pool_locked_sources'],
            source_sha256=hashlib.sha256(raw).hexdigest(),
            gzip_sha256=hashlib.sha256(gz.read_bytes()).hexdigest(),
            generic_model_certification=0,
            original_gto_parent_run=44836834970,
            original_parent_GTO_root_SHA256='af2fcbadbf848208f4046b4098b60dce01618863d76deaaecb35648f7b139741',
            original_parent_GTO_job_SHA256='9d1d6fc120154cb70881f2bda9c0d29fd0d7ddc219b154c25d02c932a9cbbafb',
            original_parent_GTO_manifest_SHA256='2e908a15bba6701cd7fa3bb1079d99a3a985cb05ef586b95eef9f00805c0d2fe',
            original_GTO_flop_NOT_recomputed=True,
            exact_actor_IP_turn_nodes=len(hero),strict_failure_reason=reason,
            rank41_frozen_missing_exact_flop='8s8h3d',
            immediate_CERT_upgrades=0)
          p.with_suffix('.index.json').write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n')
          p.unlink()
          print('PASS B121 independently verified authentic B114 GTO-pinned IP-turn child',idx)
          PY
      - name: Push exact-source B121 archive to Draft PR2, do not claim rank41 CERT before separate matching gate
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/solver_evidence/NL2_MULTIBOARD_B121_CO_XX_XB50.json.gz data/solver_evidence/NL2_MULTIBOARD_B121_CO_XX_XB50.index.json
          git commit -m 'TASK-HYBRID B121: authentic CO_BB 8s8h3d actor-IP turn-only NL2 lock from untouched SHA-pinned B114 GTO root'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B121-verified-actor-IP-child
          path: trainer/data/solver_evidence/NL2_MULTIBOARD_B121_CO_XX_XB50*
          retention-days: 30
