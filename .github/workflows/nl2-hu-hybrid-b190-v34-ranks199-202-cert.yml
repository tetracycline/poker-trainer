name: TASK-HYBRID B190 V34 rank199+202 three authenticated GTO+NL2 boards each ->147 CERT/245 APPROX 569 proofs HU2475 (max16m)
# NOT automatically activated until B189 genuine two-flop Rust IP evidence
# is independently verified, source SHA frozen, and legal actor-IP combos >0.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  certify-only-two-exact-3flop-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze original B188 true B3 two-flop GTO pins and B189 independently verified two genuine NL2 CO IP Rust children
        run: |
          set -euo pipefail
          test -s data/nl2_hu_multiboard_status_v33_b179_rank138.json
          test -s data/nl2_hu_b175_v32_248_exact_GTO_source_provenance.json
          for flop in 8s8h3d 9s6h3d; do
            test -s "data/nl2_hu_b188_rank199_202_${flop}_B3_gto_pin.json"
          done
          test -s data/solver_evidence/NL2_MULTIBOARD_B189_R199_R202_B3_2FLOP_EXP_IP.json.gz
          test -s data/solver_evidence/NL2_MULTIBOARD_B189_R199_R202_B3_2FLOP_EXP_IP.index.json
          python3 -m py_compile tools/hu_b190_v34_rank199_202_cert.py tools/hu_multiboard_promote.py tools/hu_cert_lock_medium_coverage_matrix.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b190_v34_rank199_202_cert.py
      - name: Update both V34 source-validating UI loaders first; preserve every V33-to-V26 fallback and historical B04 restricted disclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          validator=""" const v34=d=>{
           if(d.schema!=='NL2_HU_392_MULTIBOARD_CERT_STATUS_V34_B190_RANK199_202'||
              d.CERT_MULTIBOARD!==147||d.APPROX!==245||d.EST!==0||d.TOTAL!==392||
              d.parent_v33_sha256?.length!==64||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['199']?.flops?.join(',')!=='8s8h3d,9s6h3d,KsQh4d'||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['202']?.flops?.join(',')!=='8s8h3d,9s6h3d,KsQh4d'||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['199']?.actor!=='CO_IP'||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['202']?.actor!=='CO_IP'||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['199']?.original_gto_run!==44666294821||
              d.B190_rank199_202_three_real_GTO_NL2_pairing?.['202']?.original_gto_run!==44666294821||
              d.records?.['ln-iso-lmp_r_model-10l8t7i']?.label!=='CERT-MULTIBOARD'||
              d.records?.['ln-iso-lmp_r_model-10l8t7i']?.proven_exact_board_count!==3||
              d.records?.['ln-iso-lmp_r_model-yh8124']?.label!=='CERT-MULTIBOARD'||
              d.records?.['ln-iso-lmp_r_model-yh8124']?.proven_exact_board_count!==3||
              d.records?.['ln-ipfr-r_model-hqu5je']?.label!=='CERT-MULTIBOARD'||
              d.records?.['ln-iso-lmp_r_model-vlgh2t']?.label!=='APPROX'||
              d.records?.['ln-iso-lmp_r_model-wpg493']?.label!=='APPROX'||
              d.no_generic_texture_GTO!==true||
              d.no_observed_private_card_NL2_rates!==true||
              d.PR2_remains_draft_never_merge!==true||
              Object.keys(d.records||{}).length!==392)
                throw Error('V34 two ranks full sourceblind GTO+NL2 3-flop gate failed');
           return d;
          };
          """
          old=" return fetch('data/nl2_hu_multiboard_status_v33_b179_rank138.json',{cache:'no-store'}).then(open).then(v33)"
          new=" return fetch('data/nl2_hu_multiboard_status_v34_b190_rank199_202.json',{cache:'no-store'}).then(open).then(v34)\n   .catch(()=>fetch('data/nl2_hu_multiboard_status_v33_b179_rank138.json',{cache:'no-store'}).then(open).then(v33))"
          anchor=' const v33=d=>{'
          for path in (Path('nl2-multiboard.js'),Path('nl2_hu_multiboard_ui.js')):
            source=path.read_text()
            assert source.count(old)==1 and source.count(anchor)==1 and ' const v34=d=>' not in source,path
            path.write_text(source.replace(anchor,validator+anchor).replace(old,new))
          PY
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independently compare 392 exact models, only ranks199/202 promoted, 569 real named GTO/NL2 locked boards
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('data')
          load=lambda p:json.loads(p.read_text())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          oldfile=d/'nl2_hu_multiboard_status_v33_b179_rank138.json'
          newfile=d/'nl2_hu_multiboard_status_v34_b190_rank199_202.json'
          a,b=load(oldfile),load(newfile)
          m=load(d/'nl2_hu_cert_lock_medium_matrix_v34_b190.json')
          assert (a['CERT_MULTIBOARD'],a['APPROX'],a['EST'])==(145,247,0)
          assert (b['CERT_MULTIBOARD'],b['APPROX'],b['EST'],b['TOTAL'])==(147,245,0,392)
          assert len(a['records'])==len(b['records'])==392
          assert b['parent_v33_sha256']==sha(oldfile)
          ids={'ln-iso-lmp_r_model-10l8t7i','ln-iso-lmp_r_model-yh8124'}
          assert {mid for mid in a['records'] if a['records'][mid]!=b['records'][mid]}==ids
          assert (m['CERT_MULTIBOARD'],m['APPROX'])==(147,245)
          assert len(m['models'])==147 and len(m['boards'])==569
          assert m['parent_v34_status_sha256']==sha(newfile)
          assert m['strict_aggregate']['named_board_proofs']==569
          assert m['strict_aggregate']['hero_lock_variants']>=661
          assert m['strict_aggregate']['b50_research_candidate_boards']>=132
          for mid in ids:
            r=b['records'][mid]
            assert r['label']=='CERT-MULTIBOARD' and r['proven_exact_board_count']==3
            boards=r['certified_3_to_5_exact_flop_boards']
            assert {z['flop'] for z in boards}=={'8s8h3d','9s6h3d','KsQh4d'}
            assert len({z['flop_texture'] for z in boards})>=2
            for z in boards:
              assert z['acting_seat']==1 and z['actual_exact_action_line']=='x b33 c/x b50 c/x'
              assert z['strict_full_street_combo_reachable']>0 and z['exact_combo_reachable']>0
              assert z['genuine_gto_exploitability_pct']<=.5 and z['relative_spr_error_pct']<=5
              assert z['assumed_preflop_ranges'] is True
              assert z['nl2_locked_variants'] and all(y['version']=='exp_ip' for y in z['nl2_locked_variants'])
          assert all(z['hero_lock_proofs'] and z['strictly_reachable_combo_count']>0 and
            z['no_general_bet_size_recommendation'] for z in m['boards'])
          print('PASS only rank199 and rank202 3 genuine named GTO+NL2 flops, V34 147/245 569 boards')
          PY
      - name: Independently audit 147 CERT 569 real named board GTO/NL2 source locks, measured/default/unknown, exact 50pct nonpolar research +2475 HU
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v34_b190_rank199_202.json --out nl2-audit/b190-lock-medium.json
          python3 - <<'PY'
          import json
          x=json.load(open('nl2-audit/b190-lock-medium.json'))
          assert (x['cert_multiboard'],x['approx'],x['EST'])==(147,245,0)
          assert x['aggregate']['named_board_proofs']==569
          assert x['aggregate']['paired_hero_locked_source_variants']>=661
          assert x['aggregate']['board_examples_with_b50_candidate']>=132
          assert x['not_generalized_handclass_GTO'] and x['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link.md --json nl2-audit/links.json
          node tools/reach_verify.js --log nl2-audit/reach.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/links.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS HU 2475/2475")'
      - name: Verify both frontends V34 primary and prior V33,V32,V31,V30,V29,V28,V27,V26 independently frozen fallbacks
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          for(const name of ['nl2-multiboard.js','nl2_hu_multiboard_ui.js']){
            const s=fs.readFileSync(name,'utf8');
            for(const label of ['v34_b190_rank199_202','v33_b179_rank138','v32_b168_rank80',
              'v31_b161_rank150','v30_b145_rank47','v29_b142_rank88',
              'v28_b133_rank69','v27_b123_r41_236','v26_b111_rank215_220'])
              assert(s.includes('data/nl2_hu_multiboard_status_'+label+'.json'),label);
            assert(s.includes('const v34=d=>{')&&s.includes('const v33=d=>{'));
            assert(s.includes('d.CERT_MULTIBOARD!==147||d.APPROX!==245'));
          }
          console.log('PASS both UIs V34 first, V33->V26 source-frozen fallbacks unchanged');
          JS
      - name: Commit V34 only after 3-board GTO/true NL2 lock on two ranks and complete 569/2475 independent Actions PASS, push PR2 Draft NEVER MERGE
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v34_b190_rank199_202.json data/nl2_hu_cert_lock_medium_matrix_v34_b190.json docs/NL2_HU_B190_V34_TWO_NEW_3FLOP_R199_R202_CERT.md docs/NL2_HU_B190_V34_ALL_569_NAMED_BOARD_LOCK_MEDIUM.md nl2-multiboard.js nl2_hu_multiboard_ui.js
          git commit -m 'TASK-HYBRID B190 V34: original B3 rank199+202 3 true GTO+NL2 flops, 147 CERT/245 APPROX, 569 board node-lock/medium and 2475 HU audited'
          for n in 1 2 3 4 5; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B190-V34-two-ranks-147-CERT-569-exact-GTO-NL2
          path: |
            data/nl2_hu_multiboard_status_v34_b190_rank199_202.json
            data/nl2_hu_cert_lock_medium_matrix_v34_b190.json
            docs/NL2_HU_B190_V34_TWO_NEW_3FLOP_R199_R202_CERT.md
            docs/NL2_HU_B190_V34_ALL_569_NAMED_BOARD_LOCK_MEDIUM.md
            nl2-audit/
          retention-days: 30
