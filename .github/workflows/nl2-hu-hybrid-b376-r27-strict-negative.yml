name: NL2 B376 B372 rank27 original Rust 40-70 strict-zero negative, full HU2475 Actions
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b376-r27-strict-negative.yml'
      - 'tools/hu_b376_r27_strict_zero_reach.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  independent-exact-negative-audit-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Reuse original completed 100bb Rust source, independently check exact SHA + all prior actor 40-70 actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b376-source
          gh run download 45016548530 --repo "$GITHUB_REPOSITORY" --name 'NL2-B372-rank27-9s6h3d-GTO-root-true-NL2-OOP-turn' --dir /tmp/b376-source
          python3 -m py_compile tools/hu_b376_r27_strict_zero_reach.py tools/hu_sequential_cfr_reach.py
          python3 tools/hu_b376_r27_strict_zero_reach.py /tmp/b376-source
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b376-source-audit.json
      - name: Full 2475/2475 HU link, model paths, reach and frontend integrity
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b376-contract.json
          node tools/link_audit.js --md /tmp/b376-link.md --json /tmp/b376-link.json
          node tools/reach_verify.js --log /tmp/b376-reach.md --json /tmp/b376-reach.json
          node tools/hu_model_path_audit.js /tmp/b376-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b376-source-audit.json'))
          q=json.load(open('data/nl2_hu_b376_rank27_b372_exact_full_street_zero_reach_negative.json'))
          c=json.load(open('/tmp/b376-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['sequential_reach_stats']['sequential_actor_combo_nodes']==0
          assert q['no_CERT_upgrade_from_this_flop']
          print('PASS B376 negative source evidence, CERT 159 / APPROX 233, HU2475/2475')
          PY
          git diff --check
      - name: Commit true source negative to draft PR2 without changing CERT, never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b376_rank27_b372_exact_full_street_zero_reach_negative.json docs/NL2_HU_B376_RANK27_STRICT_ZERO_REACH_NEGATIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B376: verified B372 genuine Rust source has zero rank27 strict 40-70 river combos; 159 CERT / 233 APPROX'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
