name: B578 replay measured half-pot turn responses on two certified boards
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b578-conditional-turns.yml'
      - 'tools/hu_checked_gto_boundary.py'
      - 'tools/hu_b578_conditional_turns.py'
      - 'data/nl2_hu_b578_conditional_turns.json'
      - 'data/nl2_hu_b578_turn_inputs.json'
      - 'tools/hu_b578_medium_ui.cjs'
      - 'data/solver_evidence/NL2_B578_CONDITIONAL_TURNS.zip'
permissions: {actions: read, contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy phevaluator==0.5.3.1
      - name: Recompute reach using the original GitHub flop archives and the native policy outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for aid in 14703138852 14703731534 14599037935 14699135035; do
            api="repos/$GITHUB_REPOSITORY/actions/artifacts/$aid"
            gh api "$api" > "$RUNNER_TEMP/$aid.json"
            gh api "$api/zip" > "$RUNNER_TEMP/$aid.zip"
          done
          python tools/hu_b578_conditional_turns.py --originals "$RUNNER_TEMP" --solver pinned-solver --out "$RUNNER_TEMP/replay.json"
          cmp "$RUNNER_TEMP/replay.json" data/nl2_hu_b578_conditional_turns.json
          node tools/hu_b578_medium_ui.cjs
