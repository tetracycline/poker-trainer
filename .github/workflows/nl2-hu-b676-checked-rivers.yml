name: B676 solve six SB three-bet checked rivers for separate rendered models
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b676-checked-rivers.yml'
      - 'tools/hu_b676_checked_rivers.py'
      - 'tools/hu_b676_checked_routes.cjs'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        flop: [Qd8s3h, Kc9d4h, Qh9c5d, Jc7d4s, Td8c5h, 8h6c3d]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned engine and freeze the actual displayed routes
        run: |
          set -euo pipefail
          python -m pip install numpy phevaluator==0.5.3.1
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
          node tools/hu_b676_checked_routes.cjs > "$RUNNER_TEMP/routes.json"
      - name: Solve original GTO and actual OOP partial locks with independent model gates
        env:
          FLOP: ${{ matrix.flop }}
          RAYON_NUM_THREADS: 2
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/b676/$FLOP"
          python tools/hu_b676_checked_rivers.py --solver pinned-solver --flop "$FLOP" --output "$output" \
            --routes "$RUNNER_TEMP/routes.json" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$output/proof.json" "$RUNNER_TEMP/expected-proof.json"
          python tools/hu_b676_checked_rivers.py --solver pinned-solver --flop "$FLOP" --output "$output" --routes "$RUNNER_TEMP/routes.json"
          cmp "$output/proof.json" "$RUNNER_TEMP/expected-proof.json"
          cp "$RUNNER_TEMP/routes.json" "$output/rendered-routes.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B676-SB3-${{ matrix.flop }}
          path: ${{ runner.temp }}/b676/${{ matrix.flop }}
          if-no-files-found: error
          retention-days: 90
