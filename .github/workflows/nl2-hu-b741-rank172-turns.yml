name: B741 BB turn after an exact 75% BTN c-bet and a three-times check-raise
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b741-rank172-turns.yml'
      - 'tools/hu_b741_rank172.py'
      - 'tools/hu_b741_rank172_routes.cjs'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flop: [Jd9s3c, Th8d4c, 6d5h3s]
    env:
      FLOP: ${{ matrix.flop }}
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check observed BB check-raises, compatible BTN calls and displayed turns
        run: |
          set -euo pipefail
          python -m pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b741_rank172.py --flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/preflight" --preflight
      - name: Compile the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Solve the new flop and conditional check-raise turns, then replay both policies
        timeout-minutes: 22
        run: |
          set -euo pipefail
          args=(--flop "$FLOP" --solver pinned-solver --output "$RUNNER_TEMP/b741-out")
          python tools/hu_b741_rank172.py "${args[@]}" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$RUNNER_TEMP/b741-out/proof.json" "$RUNNER_TEMP/b741-original-proof.json"
          python tools/hu_b741_rank172.py "${args[@]}"
          cmp "$RUNNER_TEMP/b741-original-proof.json" "$RUNNER_TEMP/b741-out/proof.json"
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B741-R172-${{ matrix.flop }}
          path: ${{ runner.temp }}/b741-out
          if-no-files-found: error
          retention-days: 90
