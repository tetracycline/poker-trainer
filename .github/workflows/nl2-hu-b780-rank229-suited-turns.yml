name: B780 test three suited turn cards on the verified rank229 flop
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b780-rank229-suited-turns.yml'
      - 'tools/hu_b780_rank229_suited_turns.py'
permissions: {contents: read, actions: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: '1'
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate the B681 root and three previously unextracted diamond turns
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14882375723/zip" > "$RUNNER_TEMP/b681-source.zip"
          python tools/hu_b780_rank229_suited_turns.py --solver pinned-solver \
            --archive "$RUNNER_TEMP/b681-source.zip" --output "$RUNNER_TEMP/b780-source" --preflight
      - name: Build the pinned native solver
        run: |
          set -euo pipefail
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
      - name: Reproduce all original nodes and test paired GTO and measured opponent policies
        run: |
          set -euo pipefail
          args=(--solver pinned-solver --archive "$RUNNER_TEMP/b681-source.zip" --output "$RUNNER_TEMP/b780-source")
          python tools/hu_b780_rank229_suited_turns.py "${args[@]}" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$RUNNER_TEMP/b780-source/proof.json" "$RUNNER_TEMP/b780-original-proof"
          python tools/hu_b780_rank229_suited_turns.py "${args[@]}"
          cmp "$RUNNER_TEMP/b780-source/proof.json" "$RUNNER_TEMP/b780-original-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B780-R229-Kd9c5h
          path: ${{ runner.temp }}/b780-source
          if-no-files-found: error
          retention-days: 90
