name: B900 archive native rank29 negatives and diagnose rank57 sources
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b900_priority_source_diagnostics.py'
      - '.github/workflows/nl2-hu-b900-priority-source-diagnostics.yml'
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  archive-rank29:
    permissions: {contents: write, actions: read, pull-requests: read}
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate native receipts and independently recompute eight failed root gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b900_priority_source_diagnostics.py rank29 "$RUNNER_TEMP/b900"
      - name: Full independent registry and browser audit
        run: |
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
      - name: Create audited detached evidence candidate without ref movement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/hu_b900_priority_source_diagnostics.py upload "$RUNNER_TEMP/b900"
      - uses: actions/upload-artifact@v4
        with:
          name: B900-detached-rank29-archive
          path: ${{ runner.temp }}/b900
          if-no-files-found: error
          retention-days: 90
  diagnose-next-frequency-rank57:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Diagnose source attrition on four existing rank57 flops without native driver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b900_priority_source_diagnostics.py rank57 "$RUNNER_TEMP/b900-r57"
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        with:
          name: B900-rank57-source-diagnostic
          path: ${{ runner.temp }}/b900-r57
          if-no-files-found: error
          retention-days: 90
