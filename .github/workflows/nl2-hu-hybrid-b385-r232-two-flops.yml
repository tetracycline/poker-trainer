name: NL2 B385 rank232 3BP SB-OOP two true full100bb GTO+NL2 partial Rust flops <=29min
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b385-r232-two-flops.yml','tools/hu_b385_rank232_source_gate.py']
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - {flop: 7s5h3d, version: gto}
          - {flop: 7s5h3d, version: exp_oop}
          - {flop: 8s8h3d, version: gto}
          - {flop: 8s8h3d, version: exp_oop}
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Actual original 100bb Rust GTO or partial NL2 OOP flop/turn/river x-b33 call source
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py --solver-root solver --spot SB3_BTN --flop "${{ matrix.flop }}" --version "${{ matrix.version }}" --flop-size-profile full --flop-line-policy checked-b33only --turn-count 1 --manifest "evidence/SB3_BTN-${{ matrix.flop }}-${{ matrix.version }}.json"
      - name: Preserve original genuine Rust source, including zero-reach and failed runs as negatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B385_R232-SB3_BTN-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independent source SHA true Rust, exact 3BP SPR, SB OOP legal max/40-70 gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b385-original
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/b385-original
          python3 -m py_compile tools/hu_b385_rank232_source_gate.py
          python3 tools/hu_b385_rank232_source_gate.py --downloads /tmp/b385-original --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v47_b364_rank96.json --out /tmp/b385-gate.json
      - name: Full HU2475 action-line, river reach, models, JS and source audit
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b385-contract.json
          node tools/link_audit.js --md /tmp/b385-link.md --json /tmp/b385-link.json
          node tools/reach_verify.js --log /tmp/b385-reach.md --json /tmp/b385-reach.json
          node tools/hu_model_path_audit.js /tmp/b385-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b385-gate.json'))
          q=json.load(open('data/nl2_hu_b385_rank232_3bp_two_flop_strict_source_proof.json'))
          c=json.load(open('/tmp/b385-link.json'))['counts']
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(159,233,0)
          assert (c['continuing'],c['reachRiver'],c['riverShare'])==(2475,2475,100)
          assert q['no_CERT_upgrade_without_separate_three_flop_proof']
          print('PASS B385 exact source-only, CERT159 APPROX233 HU2475')
          PY
          git diff --check
      - name: Commit true pinned original GTO/NL2 source and explicitly excluded negatives, never merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b385_rank232_3bp_two_flop_strict_source_proof.json docs/NL2_HU_B385_RANK232_TRUE_TWO_FLOP_SOURCES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'B385: original 3BP rank232 SB OOP true GTO+NL2 partial 40-70 source pairs; no early CERT'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
