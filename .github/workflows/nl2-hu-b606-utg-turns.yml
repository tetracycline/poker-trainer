name: B606 verify UTG responses after 75%, 100%, and checked flops
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b606-utg-turns.yml'
      - 'tools/hu_b606_*'
      - 'data/nl2_hu_b606_rank*_barrels.json'
      - 'data/solver_evidence/NL2_B606_R*.zip'
permissions: {contents: read, actions: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the original native solver
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          git clone -q https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Authenticate all nine original decisions and reproduce the native policies
        working-directory: trainer
        env:
          GH_TOKEN: ${{ github.token }}
          RAYON_NUM_THREADS: 1
        run: |
          set -euo pipefail
          for id in 14528342851 14593222610 14664258709 14664221752 14780587650 14780922318 14780374050; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/$id.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$id.zip"
          done
          for rank in 31 32 33; do
            report="data/nl2_hu_b606_rank${rank}_barrels.json"
            python tools/hu_b606_utg_turns.py --rank "$rank" --solver ../solver --verification-driver ../solver/postflop/pfdriver/target/release/pfdriver --originals "$RUNNER_TEMP" --archive "data/solver_evidence/NL2_B606_R${rank}.zip" --out "$RUNNER_TEMP/replay.json"
            cmp "$RUNNER_TEMP/replay.json" "$report"
            node tools/hu_b590_barrel_ui.cjs "$report"
          done
