name: TASK-HYBRID B58 rank33 third true board; V6 42 CERT/350 APPROX, 164 exact locks (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b58-rank33-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recompute SHA-pinned B51 GTO/EXP pair, one exact rank33 promotion and all V6 lock matrix
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b58_rank33_v6.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b58_rank33_v6.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Independently verify immutable V5, V6 42/350 source board, Batch E and river full navigation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          v6=json.load(open('data/nl2_hu_multiboard_status_v6_rank33.json'))
          v5=json.load(open('data/nl2_hu_multiboard_status_v5_batch55.json'))
          m=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v6.json'))
          nav=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert (v6['CERT_MULTIBOARD'],v6['APPROX'])==(42,350)
          assert (v5['CERT_MULTIBOARD'],v5['APPROX'])==(41,351)
          assert v6['parent_v5_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v5_batch55.json','rb').read()).hexdigest()
          assert len([i for i in v6['records'] if v5['records'][i]!=v6['records'][i]])==1
          assert m['CERT_MULTIBOARD']==42 and m['APPROX']==350 and len(m['boards'])==164
          assert m['parent_v6_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v6_rank33.json','rb').read()).hexdigest()
          assert all(x['hero_lock_proofs'] and x['no_general_bet_size_recommendation'] for x in m['boards'])
          assert v6['independently_verified_completed_batches']['B51_UTG_XX']['run_id']==44808905109
          assert v6['independently_verified_completed_batches']['B4_MICRO']['run_id']==44732810327
          assert nav['continuing']==nav['reach_river']==2475 and nav['share_pct']==100
          print('PASS B58 V6 42 CERT/350 APPROX 164 exact source GTO/lock boards and 100% river')
          PY
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const files=['data/nl2_hu_multiboard_status_v6_rank33.json',
           'data/nl2_hu_multiboard_status_v5_batch55.json',
           'data/nl2_hu_multiboard_status_v4_batch50.json',
           'data/nl2_hu_multiboard_status_v3_rank28.json',
           'data/nl2_hu_multiboard_status_v2_tie.json',
           'data/nl2_hu_multiboard_status.json'];
          const src=files.map(x=>JSON.parse(fs.readFileSync(x,'utf8')));
          async function test(file) {
            const s=fs.readFileSync(file,'utf8'),
             a=s.indexOf('function fetchCertifiedRegistry(){'),
             b=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',a);
            assert(a>=0&&b>a);
            const fn=new Function('fetch',s.slice(a,b)+';return fetchCertifiedRegistry();');
            for(let i=0;i<files.length;i++){
              const v=await fn(async url=>{
                const j=files.findIndex(p=>url.includes(p));assert(j>=0);
                return j<i?{ok:false,status:404}:{ok:true,json:async()=>src[j]};
              });
              assert.strictEqual(v,src[i]);
            }
          }
          (async()=>{await test('nl2-multiboard.js');await test('nl2_hu_multiboard_ui.js');
            console.log('PASS V6-V1 parsed JSON fallback');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Commit exact V6 and complete lock/b50 proofs to Draft PR #2; NEVER merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v6_rank33.json data/nl2_hu_cert_lock_medium_matrix_v6.json docs/NL2_HU_B58_V6_RANK33_CERT.md docs/NL2_HU_B58_V6_ALL_LOCKS_MEDIUM.md
          git commit -m 'TASK-HYBRID B58: rank33 genuine three-board GTO+hero lock; V6 42 CERT/350 APPROX'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B58-V6-rank33-proof
          path: |
            data/nl2_hu_multiboard_status_v6_rank33.json
            data/nl2_hu_cert_lock_medium_matrix_v6.json
            docs/NL2_HU_B58_V6_RANK33_CERT.md
            docs/NL2_HU_B58_V6_ALL_LOCKS_MEDIUM.md
          retention-days: 30
