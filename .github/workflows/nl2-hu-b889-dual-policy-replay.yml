name: B889 verify dual exact-price policies and intersect physical deals
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - 'tools/hu_b889_dual_policy_replay.py'
      - 'data/nl2_hu_b889_dual_policy_pins.json'
      - '.github/workflows/nl2-hu-b889-dual-policy-replay.yml'
permissions: {contents: read, actions: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      NODE_OPTIONS: --max-old-space-size=3072
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 3}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Authenticate and replay both completed native sources; intersect exact two-seat deals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python -m py_compile tools/hu_b889_dual_policy_replay.py
          python tools/hu_b889_dual_policy_replay.py "$RUNNER_TEMP/b889" pinned-solver
          git diff --exit-code -- data nl2.js nl2_hu_model.js
      - uses: actions/upload-artifact@v4
        with:
          name: B889-R158-dual-policy-authenticated-replay
          path: |
            ${{ runner.temp }}/b889/report.json
            ${{ runner.temp }}/b889/receipts.json
            ${{ runner.temp }}/b889/archive/
          if-no-files-found: error
          retention-days: 90
