name: B916 freeze historical inventory and search all six frozen continuation identities
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['tools/hu_b916_history_dedup.py', '.github/workflows/nl2-hu-b916-history-dedup.yml']
permissions: {contents: read, actions: read, pull-requests: read}
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    permissions: {contents: write, actions: read, pull-requests: read}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify immutable inventory artifact and full prior receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b916_history_dedup.py prepare "$RUNNER_TEMP/b916"
      - name: Full static model route and exact named-board audit
        run: |
          node tools/hu_extension_runtime_test.cjs data/nl2_hu_multiboard_status_current.json
          bash tools/hu_exact_batch_audit.sh data/nl2_hu_multiboard_status_current.json
      - name: Create detached archive candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/hu_b916_history_dedup.py publish "$RUNNER_TEMP/b916"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B916-detached-archive
          path: ${{ runner.temp }}/b916
          if-no-files-found: warn
          retention-days: 90
  identity-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compare six frozen jobs with permanent and unnamed archive sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy phevaluator==0.5.3.1
          python tools/hu_b916_history_dedup.py scan "$RUNNER_TEMP/b916-scan"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B916-six-identity-scan
          path: ${{ runner.temp }}/b916-scan
          if-no-files-found: warn
          retention-days: 90
