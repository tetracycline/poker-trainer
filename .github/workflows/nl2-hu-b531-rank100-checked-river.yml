name: B531 rank100 limped checked rivers on five playable middle-pair flop routes
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b531-rank100-checked-river.yml'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flop: [6c4h2d, As7d4c, Th7c4d, Jc8d3h, 9c6d3s]
        version: [gto, exp_oop]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve the original restricted half-pot flop and two independent reached turns
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot LMP_CO_BB \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile lmp-50-only --flop-line-policy checked-b50only --allow-turn-lead \
            --turn-size-menu default --archive-empty-river-extraction --lock-marginals-by-street --turn-count 2 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= 2
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert len(m["cases"]) + len(m["skipped"]) == 2
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: B531-original-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/LMP_CO_BB/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 90

  gate:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install phevaluator==0.5.3.1
      - name: Authenticate the native GTO and NL2 solver jobs and replay both seats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/b531"
          mkdir "$dir"
          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$dir/run.json"
          newids=$(jq -r '.artifacts[] | select(.name | startswith("B531-original-")) | .id' "$dir/run.json")
          for id in $newids; do
            gh api "$api/artifacts/$id" > "$dir/$id.json"
            gh api "$api/artifacts/$id/zip" > "$dir/$id.zip"
          done
          python3 tools/hu_b531_rank100.py "$dir" --run "$GITHUB_RUN_ID" --head "$GITHUB_SHA"
      - name: Publish exact evidence after the full registry and navigation audit
        run: |
          set -euo pipefail
          branch=fix/nl2-hu-lines-audit-20261118
          shopt -s nullglob
          files=(data/nl2_hu_b531_rank100_attempts.json data/solver_evidence/NL2_B531_R100_*.zip data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R100_*.json.gz)
          if test -f data/nl2_hu_b531_locked_medium.json; then
            files+=(data/nl2_hu_b531_locked_medium.json data/solver_evidence/reverified/rank100.json)
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              status=data/nl2_hu_multiboard_status_current.json
              python3 tools/hu_apply_cert_extensions.py --out "$status"
              python - "$status" <<'PYVERIFY'
          import json,sys
          r=json.load(open('data/nl2_hu_b531_rank100_attempts.json'))
          m=json.load(open(sys.argv[1]))['records'][r['model_id']]
          if r['verified_flops']>=3:
              assert m['label']=='CERT-MULTIBOARD'
              assert {b['source_sha256'] for b in m['certified_3_to_5_exact_flop_boards']}=={b['source_sha256'] for b in r['model']['boards']}
          PYVERIFY
              node tools/hu_extension_runtime_test.cjs "$status"
              node tools/hu_b491_incremental_medium.cjs
              node tools/hu_b492_medium_tree_ui.cjs
              bash tools/hu_exact_batch_audit.sh "$status"
              git add -f -- "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B531: publish rank100 checked rivers verified against both private-hand ranges and rendered middle-pair routes'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
