name: B528 rank134 BTN river on monotone flops after a half-pot bet and two turn checks
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b528-rank134-monotone.yml'
      - 'tools/hu_b528_rank134_monotone.py'
      - 'tools/hu_b528_rank134_routes.cjs'
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        flop: [Kh8h3h, Qc7c2c, Jd9d5d, Ks9s5s, 9d7d4d]
        version: [gto, exp_ip]
    steps:
      - uses: actions/checkout@v4
        with: {path: trainer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned Rust solver
        run: |
          set -euo pipefail
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          mkdir -p trainer/evidence
          cp solver/inputs/pool_stats.json trainer/evidence/pool_stats.json
          git -C solver rev-parse HEAD > trainer/evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > trainer/evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve the full flop and the checked turn with native opponent locks
        working-directory: trainer
        env:
          FLOP: ${{ matrix.flop }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/solve_hu_multiboard_100bb.py --solver-root ../solver --spot BTN_BB \
            --flop "$FLOP" --version "$VERSION" --flop-size-profile full --flop-line-policy checked-b50only \
            --turn-line-policy checkcheck --archive-empty-river-extraction --lock-marginals-by-street --turn-count 1 --manifest "evidence/$FLOP-$VERSION.json" || status=$?
          python3 - "$status" "evidence/$FLOP-$VERSION.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[2]))
          assert not m["failures"] and len(m["cases"]) == m["solved_cases"] <= 1
          assert int(sys.argv[1]) == (0 if m["cases"] else 1)
          assert m["cases"] or len(m["skipped"]) == 1
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NL2-B528-${{ matrix.flop }}-${{ matrix.version }}
          path: |
            trainer/evidence
            solver/postflop/out/BTN_BB/${{ matrix.version }}
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'NL2-B528-*'
          path: downloads
      - run: python -m pip install phevaluator==0.5.3.1
      - name: Verify source hands and both rendered predecessor actions
        run: python tools/hu_b528_rank134_monotone.py --downloads downloads --run "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: B528-rank134-verified-decisions
          path: |
            data/nl2_hu_b528_*.json
            data/solver_evidence/reverified/rank134.json
            data/solver_evidence/NL2_B528_*.json.gz
            data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R134_*.json.gz
          if-no-files-found: error
          retention-days: 90
      - name: Audit all current routes and register only verified paired boards
        run: |
          set -euo pipefail
          shopt -s nullglob
          branch=fix/nl2-hu-lines-audit-20261118
          status=data/nl2_hu_multiboard_status_current.json
          files=(data/nl2_hu_b528_rank134_monotone.json data/solver_evidence/NL2_B528_*.json.gz)
          files+=(data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R134_*.json.gz)
          if test -f data/nl2_hu_b528_locked_medium.json; then files+=(data/solver_evidence/reverified/rank134.json data/nl2_hu_b528_locked_medium.json); fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            for file in "${files[@]}"; do
              if test -e "$live/$file"; then cmp "$file" "$live/$file"; fi
            done
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              python tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_extension_runtime_test.cjs "$status"
              node tools/hu_b491_incremental_medium.cjs
              node tools/hu_b492_medium_tree_ui.cjs
              bash tools/hu_exact_batch_audit.sh "$status"
              python -c 'import json; m=json.load(open("data/nl2_hu_b528_rank134_monotone.json")); r=json.load(open("data/nl2_hu_multiboard_status_current.json"))["records"][m["model_id"]]; assert m["qualified_distinct_flops"] < 3 or (r["label"]=="CERT-MULTIBOARD" and {b["source_sha256"] for b in m["verified_pairs"]["boards"]} <= {b["source_sha256"] for b in r["certified_3_to_5_exact_flop_boards"]})'
              git add -- "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B528: publish authenticated BTN monotone river reach and measured locks'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then
              exit 0
            fi
            git worktree remove "$live"
          done
          exit 1
