name: NL2 B431 rank216/218 actual NL2-IP partial-lock on B429 positive LOW-texture flop 7c6h5d, HU2475 <=24m
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b431-r216218-new-texture-nl2-ip.yml'
      - 'tools/hu_b431_rank216218_one_new_texture_nl2_ip_pair.py'
      - 'data/nl2_hu_b429_r216218_three_new_texture_gto_sources.json'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, path: trainer}
      - uses: actions/checkout@v4
        with: {repository: tetracycline/poker-solver, ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b, path: solver, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Genuine original 100bb CO-IP partially NL2-locked Rust source, exact checked-b50 branch
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
          cd ../../..
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot CO_BB --flop 7c6h5d --version exp_ip \
            --flop-size-profile full --flop-line-policy checked-b50only --turn-count 1 \
            --manifest evidence/CO_BB-7c6h5d-exp_ip.json
      - name: Preserve actual Rust NL2 IP artifact even for strict-zero result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B431_R216218_NL2_IP-CO_BB-7c6h5d-exp_ip
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn
  verify-commit:
    needs: solve
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independently pair B429 original GTO SHA and B431 actual NL2-IP SHA, same actor/board/SPR/40-70
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b431-gto /tmp/b431-exp
          gh run download 45055601616 --repo "$GITHUB_REPOSITORY" \
            --name nl2-multiboard-B429_R216218_GTO_FIRST-CO_BB-7c6h5d-gto --dir /tmp/b431-gto
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name nl2-multiboard-B431_R216218_NL2_IP-CO_BB-7c6h5d-exp_ip --dir /tmp/b431-exp || true
          python3 -m py_compile tools/hu_b431_rank216218_one_new_texture_nl2_ip_pair.py
          python3 tools/hu_b431_rank216218_one_new_texture_nl2_ip_pair.py --gto-root /tmp/b431-gto --exp-root /tmp/b431-exp --run-id "$GITHUB_RUN_ID"
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b431-source.json
      - name: Full HU2475 paths, frontend and no-premature-CERT source audit
        run: |
          set -euo pipefail
          node tools/hu_line_contract.js > /tmp/b431-contract.json
          node tools/link_audit.js --md /tmp/b431-link.md --json /tmp/b431-link.json
          node tools/reach_verify.js --log /tmp/b431-reach.md --json /tmp/b431-reach.json
          node tools/hu_model_path_audit.js /tmp/b431-model.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          node -e 'const c=require("/tmp/b431-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B431 HU2475/2475")'
          git diff --check
      - name: Commit true paired GTO+NL2 source-only evidence, never promote one-flop rank or merge PR2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add data/nl2_hu_b431_r216218_one_new_texture_nl2_ip_pair.json docs/NL2_HU_B431_R216218_TRUE_NEW_TEXTURE_NL2_IP_PAIR.md
          if git diff --cached --quiet;then exit 0;fi
          git commit -m 'B431: genuine NL2 IP partial lock paired to new LOW texture B429 GTO source, ranks216/218'
          git pull --rebase origin fix/nl2-hu-lines-audit-20261118
          git push origin HEAD:fix/nl2-hu-lines-audit-20261118
