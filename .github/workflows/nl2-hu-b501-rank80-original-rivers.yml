name: B501 audit rank80 originals on five limped flops
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b501-rank80-original-rivers.yml'
      - 'tools/hu_b501_rank80_originals.py'
      - 'data/nl2_hu_b501_*.json'
permissions:
  actions: read
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Retrieve the ten original GTO and NL2-IP artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b501"
          pins=data/nl2_hu_b501_rank80_artifacts.json
          for id in $(jq -r 'keys[]' "$pins"); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/b501/$id.json"
            jq -e --arg id "$id" --slurpfile entries "$pins" '
              ($entries[0][$id]) as $p | .id==($id|tonumber) and .digest==("sha256:"+$p.sha256)
              and .name==$p.name and .workflow_run.id==$p.run
              and .workflow_run.head_sha==$p.head' "$RUNNER_TEMP/b501/$id.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/b501/$id.zip"
          done
      - name: Recompute each river mask, reconcile the two retained examples and audit the full live registry
        run: |
          set -euo pipefail
          python3 tools/hu_b501_rank80_originals.py "$RUNNER_TEMP/b501" --verify
          python3 tools/hu_apply_cert_extensions.py --out "$RUNNER_TEMP/current.json"
          jq -e '.records["ln-iso-lmp_r_model-17pklmg"] | .label=="APPROX" and .proven_exact_board_count==0 and .remaining_exact_board_evidence==[]' "$RUNNER_TEMP/current.json"
          node tools/hu_extension_runtime_test.cjs "$RUNNER_TEMP/current.json"
          bash tools/hu_exact_batch_audit.sh "$RUNNER_TEMP/current.json"
          bash tools/hu_publish_cert_extensions.sh
