name: TASK-HYBRID B301 rank71 exact B298 PASS-zero / B293-B296 canceled closeout + 593 actor locks HU2475 (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b301-r71-three-run-closeout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rank71-B294-original-GTO-BB-OOP-source-negative-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify ACTUAL B298/B293/B296 final Actions and B298 zero legal GTO source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44950943882" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44951459377" --jq .conclusion)" = cancelled
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44951459385" --jq .conclusion)" = cancelled
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/44951567983" --jq .conclusion)" = success
          python3 - <<'PY'
          import pathlib,json,gzip,hashlib
          d=pathlib.Path('data')
          pin=json.loads((d/'nl2_hu_b298_rank71_lmp_5s5h3d_gto_parent_pin.json').read_text())
          ix=json.loads((d/'solver_evidence/NL2_MULTIBOARD_B298_R71_5S5H3D_GTO.index.json').read_text())
          gz=d/'solver_evidence/NL2_MULTIBOARD_B298_R71_5S5H3D_GTO.json.gz'
          assert ix['source_sha256']==hashlib.sha256(gzip.decompress(gz.read_bytes())).hexdigest()
          assert ix['gzip_sha256']==hashlib.sha256(gz.read_bytes()).hexdigest()
          assert (pin['source_run_id'],ix['run_id'],ix['gto_cases'],ix['locked_cases'])==(44950943882,44950943882,1,0)
          assert (pin['spot'],pin['flop'],pin['turn'],pin['flop_line'],pin['turn_line'])==('LMP_CO_BB','5s5h3d','Kd','b50 c','x b50 c')
          assert (pin['target_exact_actor_OOP_river_nodes'],pin['target_exact_actor_OOP_strict_combos'],ix['exact_target_actor_OOP_strict_combos'])==(0,0,0)
          assert pin['assumed_limped_169class'] and not pin['observed_preflop_ranges'] and not pin['direct_nl2_lock_source_present']
          print('PASS B298 immutable real GTO SHA zero actor reach, B293/B296 canceled, B299 verified')
          PY
      - name: Compile new exact rank71 source authentication and reject 57 SHA/actor/line/SPR/turn/locked-flop forged metadata variants
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_hu_multiboard_100bb.py             tools/solve_hu_b294_rank71_new_original_gto_nl2_oop.py             tools/test_hu_b299_rank71_b294_four_gto_nl2_source_gate.py
          python3 tools/test_hu_b299_rank71_b294_four_gto_nl2_source_gate.py
      - name: Independently assert source-authorization cannot fabricate new rank71 BB-OOP CERT and retains original V42 SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path('data')
          file=d/'nl2_hu_b299_v42_rank71_B294_four_GTO_SHA_negative_gate.json'
          a=json.loads(file.read_text())
          assert a['schema']=='NL2_HU_B299_RANK71_B290_B293_B296_B298_GTO_OOP_SHA_RIVER_ACTOR_76_NEGATIVES_V1'
          assert (a['CERT_MULTIBOARD'],a['APPROX'],a['EST'],a['TOTAL'])==(155,237,0,392)
          assert a['V42_status_sha256']==hashlib.sha256((d/'nl2_hu_multiboard_status_v42_b289_rank46.json').read_bytes()).hexdigest()
          assert a['source_authorizer_sha256']==hashlib.sha256(pathlib.Path('tools/verify_hu_multiboard_100bb.py').read_bytes()).hexdigest()
          assert a['downstream_NL2_source_solver_sha256']==hashlib.sha256(pathlib.Path('tools/solve_hu_b294_rank71_new_original_gto_nl2_oop.py').read_bytes()).hexdigest()
          assert a['exact_future_source_flops_and_runs']=={
            'As7h3d':['B290',44948738190],'QsJh4d':['B293',44951459377],'Js8h3d':['B296',44951459385],'5s5h3d':['B298',44950943882]}
          assert a['adversarial_original_GTO_metadata_cases']==76
          assert a['all_adversarial_source_cases_failclosed']
          assert len(a['negative_test_results'])==76
          assert all(x=='REJECTED' for x in a['negative_test_results'].values())
          assert a['positive_source_not_assumed_or_generated_from_negative_tests']
          assert a['no_new_authenticated_NL2_OOP_partial_source_claimed']
          assert a['no_private_hand_conditional_NL2_frequencies_observed']
          assert a['no_automatic_generic_CERT']
          assert (a['existing_named_board_proofs'],a['existing_real_NL2_actor_lock_variants'],
            a['exact_board_50pct_nonpolarized_research_only'])==(593,685,134)
          assert a['PR2_Draft_NEVER_MERGE']
          print('PASS B299 all 76/76 original GTO SHA/actor BB-OOP source forgeries rejected')
          PY
      - name: Full existing 155 CERT 593 genuine original 100bb GTO plus NL2 actor source locks, b50 research-only, 2475 HU contract and legal path regression
        run: |
          set -euo pipefail
          mkdir -p nl2-audit
          python3 tools/hu_cert_lock_medium_audit.py --source data/nl2_hu_multiboard_status_v42_b289_rank46.json --out nl2-audit/b299-lock-medium.json
          python3 - <<'PY'
          import json
          a=json.load(open('nl2-audit/b299-lock-medium.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'])==(155,237,0)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'],
             a['aggregate']['board_examples_with_b50_candidate'])==(593,685,134)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > nl2-audit/hu-contract.json
          node tools/link_audit.js --md nl2-audit/link-report.md --json nl2-audit/link.json
          node tools/reach_verify.js --log nl2-audit/reach-report.md --json nl2-audit/reach.json
          node tools/hu_model_path_audit.js nl2-audit/model-path.json
          node -e 'const c=require("./nl2-audit/link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B299 HU2475/2475")'
      - name: Commit 76 negative original Rust source tests only after full 593 source and 2475 HU PASS, Draft PR2 normal push never force or merge
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib,json,pathlib
          d=pathlib.Path('data')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          status=d/'nl2_hu_multiboard_status_v42_b289_rank46.json'
          pin=d/'nl2_hu_b298_rank71_lmp_5s5h3d_gto_parent_pin.json'
          idx=d/'solver_evidence/NL2_MULTIBOARD_B298_R71_5S5H3D_GTO.index.json'
          closeout={
           'schema':'NL2_HU_B301_RANK71_ORIGINAL_SOURCE_RUN_CLOSEOUT_V1',
           'source_evidence_status':{
             'B298':{'run_id':44950943882,'result':'SUCCESS_ORIGINAL_GTO','flop':'5s5h3d','turn':'Kd','strict_OOP_combos':0,'NL2_partial_lock':False},
             'B293':{'run_id':44951459377,'result':'CANCELLED_NO_COMPLETED_GTO','flop':'QsJh4d','valid_completed_source':False},
             'B296':{'run_id':44951459385,'result':'CANCELLED_NO_COMPLETED_GTO','flop':'Js8h3d','valid_completed_source':False},
             'B299':{'run_id':44951567983,'result':'PASS_76_OF_76_FORGED_GTO_SOURCES_REJECTED'}},
           'status_sha256':sha(status),'B298_parent_pin_sha256':sha(pin),'B298_source_index_sha256':sha(idx),
           'CERT_MULTIBOARD':155,'APPROX':237,'EST':0,'TOTAL':392,
           'authenticated_named_boards':593,'NL2_actor_matched_lock_variants':685,
           'exact_board_b50_nonpolar_research_candidates_only':134,'HU_river_navigation':'2475/2475',
           'rank71':'APPROX','rank71_verified_flops':['4s4h2d','7s5h3d'],
           'no_GTO_only_or_cancelled_source_CERT':True,
           '169_class_LMP_preflop_ranges':'ASSUMED_NOT_OBSERVED',
           'no_private_hand_NL2_conditional_data_claim':True,'PR2_remains_Draft_NEVER_MERGE':True
          }
          (d/'nl2_hu_b301_rank71_three_run_closeout.json').write_text(json.dumps(closeout,indent=2,ensure_ascii=False)+'\\n')
          pathlib.Path('docs/NL2_HU_B301_RANK71_THREE_RUN_CLOSEOUT.md').write_text('''# B301 rank71 original-GTO exact-source closeout

- B298 44950943882: PASS original 100bb Rust GTO 5s5h3d/Kd, immutable SHA verified; exact BB-OOP river b50 c/x b50 c/ has 0 strict sequential combos, no paired real NL2 lock; never promote.
- B293 44951459377 QsJh4d and B296 44951459385 Js8h3d: canceled within original full-flop solves; no completed original GTO source; never promote.
- B299 44951567983: PASS 76/76 adversarial original SHA/seat/line/SPR negatives; frozen historical PENDING text superseded by this final closeout.
- V42 full audit: 155 CERT / 237 APPROX / 0 EST; 593 exact certified public-board cases, 685 real actor-matched NL2 partial lock variants and 134 exact-board b50 research-only candidates, HU navigation 2475/2475.
- Rank71 keeps two distinct real paired flops 4s4h2d and 7s5h3d. Third must have positive strict OOP actor sequential reach AND separately authentic NL2 downstream lock; a new GTO solve alone never certifies the model.
- 169-class limped preflop is an assumption, not measured NL2 private-hand frequency. PR #2 stays Draft/Open, never merge or force push.
''')
          print('PASS B301 source status closeout written only after full V42/HU2475 audit')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_b301_rank71_three_run_closeout.json docs/NL2_HU_B301_RANK71_THREE_RUN_CLOSEOUT.md
          git commit -m 'TASK-HYBRID B301: final B298 source zero actor combos, B293/B296 canceled; 76 failclosed, 593 actor-lock/HU2475 PASS'
          for n in 1 2 3 4; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NL2-HU-B301-rank71-3-run-actual-source-closeout-593-HU2475
          path: |
            data/nl2_hu_b301_rank71_three_run_closeout.json
            docs/NL2_HU_B301_RANK71_THREE_RUN_CLOSEOUT.md
            nl2-audit/
          retention-days: 30
