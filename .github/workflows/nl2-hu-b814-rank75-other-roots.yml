name: B814 rank75 other two saved monotone roots held-out fourth-suit turns
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-b814-rank75-other-roots.yml'
      - 'tools/hu_b814_rank75_other_roots.py'
permissions: {contents: read}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    strategy:
      fail-fast: false
      matrix:
        flop: [8c7c5c, 9h7h5h]
    env:
      FLOP: ${{ matrix.flop }}
      RAYON_NUM_THREADS: 2
      NODE_OPTIONS: --max-old-space-size=1536
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: b-inary/postflop-solver
          ref: 9d1509fe5077d019825f833eed04b16d342dfda1
          path: pinned-solver/postflop/postflop-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Reconstruct four held-out original jobs and every two-seat reach weight
        run: |
          set -euo pipefail
          pip -q install numpy phevaluator==0.5.3.1
          python tools/hu_b814_rank75_other_roots.py --flop "$FLOP" --preflight --solver pinned-solver --output "$RUNNER_TEMP/preflight"
      - name: Build the pinned native driver
        working-directory: pinned-solver/postflop/pfdriver
        run: RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Solve the missing conditional games and replay evidence from native output
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/b814-source"
          python tools/hu_b814_rank75_other_roots.py --flop "$FLOP" --solver pinned-solver --output "$path" --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
          cp "$path/proof.json" "$RUNNER_TEMP/b814-proof"
          python tools/hu_b814_rank75_other_roots.py --flop "$FLOP" --solver pinned-solver --output "$path"
          cmp "$RUNNER_TEMP/b814-proof" "$path/proof.json"
      - name: Preserve original jobs, decisions and range reconstruction
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B814-R75-${{ matrix.flop }}
          path: ${{ runner.temp }}/b814-source
          if-no-files-found: error
          retention-days: 90
