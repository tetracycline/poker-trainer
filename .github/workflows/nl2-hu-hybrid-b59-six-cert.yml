name: TASK-HYBRID B59 six preregistered V7 48 CERT/344 APPROX, 187 real hero-locked boards (max12m)
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-hybrid-b59-six-cert.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/nl2-hu-lines-audit-20261118}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently authenticate all six source-blind 3–5 real GTO plus NL2 locked flop boards
        run: |
          set -euo pipefail
          python3 -m py_compile tools/hu_b59_v7_six_cert.py tools/hu_cert_lock_medium_audit.py
          python3 tools/hu_b59_v7_six_cert.py
          node --check nl2-multiboard.js
          node --check nl2_hu_multiboard_ui.js
      - name: Strict V7 48/344 parent integrity 187 exact-board locks, Batch E and river audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          v6=json.load(open('data/nl2_hu_multiboard_status_v6_rank33.json'))
          v7=json.load(open('data/nl2_hu_multiboard_status_v7_batch59.json'))
          m=json.load(open('data/nl2_hu_cert_lock_medium_matrix_v7.json'))
          nav=json.load(open('data/nl2_hu_b34_full_integrity.json'))['navigation']
          assert (v6['CERT_MULTIBOARD'],v6['APPROX'])==(42,350)
          assert (v7['CERT_MULTIBOARD'],v7['APPROX'])==(48,344)
          assert v7['source_blind_expansion_ranks']==[59,63,64,65,66,70]
          assert v7['parent_v6_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v6_rank33.json','rb').read()).hexdigest()
          assert v7['source_blind_b57_sha256']==hashlib.sha256(open('data/nl2_hu_b57_next20_sourceblind_gaps.json','rb').read()).hexdigest()
          assert len(v7['b59_certificates'])==6
          changed={key for key in v6['records'] if v6['records'][key]!=v7['records'][key]}
          assert changed=={x['model_id'] for x in v7['b59_certificates']}
          assert m['CERT_MULTIBOARD']==48 and m['APPROX']==344
          assert len(m['boards'])==m['strict_aggregate']['named_board_proofs']==187
          assert m['parent_v7_status_sha256']==hashlib.sha256(open('data/nl2_hu_multiboard_status_v7_batch59.json','rb').read()).hexdigest()
          assert all(x['hero_lock_proofs'] and x['strictly_reachable_combo_count']>0 and x['no_general_bet_size_recommendation'] for x in m['boards'])
          assert nav['continuing']==nav['reach_river']==2475 and nav['share_pct']==100
          assert v7['independently_verified_completed_batches']['B4_MICRO']['run_id']==44732810327
          print('PASS B59 source-pinned V7 48 CERT, 344 APPROX, 187 lock/medium boards, Batch E, river links')
          PY
          node - <<'JS'
          const fs=require('fs'),assert=require('assert').strict;
          const paths=['data/nl2_hu_multiboard_status_v7_batch59.json',
           'data/nl2_hu_multiboard_status_v6_rank33.json',
           'data/nl2_hu_multiboard_status_v5_batch55.json',
           'data/nl2_hu_multiboard_status_v4_batch50.json',
           'data/nl2_hu_multiboard_status_v3_rank28.json',
           'data/nl2_hu_multiboard_status_v2_tie.json',
           'data/nl2_hu_multiboard_status.json'];
          const data=paths.map(p=>JSON.parse(fs.readFileSync(p,'utf8')));
          async function verify(path){
            const s=fs.readFileSync(path,'utf8');
            const a=s.indexOf('function fetchCertifiedRegistry(){');
            const b=s.indexOf('\nfetchCertifiedRegistry()\n .then(d=>{',a);
            assert(a>=0&&b>a,'Decoded JSON consumer missing');
            const fn=new Function('fetch',s.slice(a,b)+';return fetchCertifiedRegistry();');
            for(let i=0;i<paths.length;i++){
              const out=await fn(async url=>{
                const idx=paths.findIndex(x=>url.includes(x));assert(idx>=0);
                return idx<i?{ok:false,status:404}:{ok:true,json:async()=>data[idx]};
              });
              assert.strictEqual(out,data[i]);
            }
          }
          (async()=>{
            await verify('nl2-multiboard.js');
            await verify('nl2_hu_multiboard_ui.js');
            console.log('PASS V7 through V1 fallback on both certification pages');
          })().catch(err=>{console.error(err);process.exitCode=1});
          JS
      - name: Commit authentic six rank V7 and all exact board lock/medium sources to Draft PR #2; NEVER merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nl2_hu_multiboard_status_v7_batch59.json data/nl2_hu_cert_lock_medium_matrix_v7.json docs/NL2_HU_B59_V7_SIX_CERT.md docs/NL2_HU_B59_V7_ALL_LOCKS_MEDIUM.md
          git commit -m 'TASK-HYBRID B59: six source-blind authentic models V7 48 CERT/344 APPROX, 187 exact lock/medium proofs'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
            sleep "$n"
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TASK-HYBRID-B59-V7-six-frozen-authentic-cert
          path: |
            data/nl2_hu_multiboard_status_v7_batch59.json
            data/nl2_hu_cert_lock_medium_matrix_v7.json
            docs/NL2_HU_B59_V7_SIX_CERT.md
            docs/NL2_HU_B59_V7_ALL_LOCKS_MEDIUM.md
          retention-days: 30
