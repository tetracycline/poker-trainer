name: B502 fill BB 3-bettor native checked turns with measured BTN locks
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths: ['.github/workflows/nl2-hu-b502-rank120-bb3-checked-turn.yml']
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - {flop: As8h4d, artifact: 14528551179}
          - {flop: Ks7s2s, artifact: 14530206356}
          - {flop: KsQh4d, artifact: 14592263783}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate and solve the original flop range with the new per-street NL2 lock
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL: ${{ matrix.artifact }}
          FLOP: ${{ matrix.flop }}
        run: |
          set -euo pipefail
          originals="$RUNNER_TEMP/originals"
          mkdir -p "$originals"
          api="repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL"
          gh api "$api" > "$originals/$ORIGINAL.json"
          gh api "$api/zip" > "$originals/$ORIGINAL.zip"
          args=(--originals "$originals" --solver pinned-solver --flop "$FLOP")
          python tools/hu_b502_rank120_native.py "${args[@]}"
          git clone -q https://github.com/b-inary/postflop-solver.git pinned-solver/postflop/postflop-solver
          git -C pinned-solver/postflop/postflop-solver checkout -q 9d1509fe5077d019825f833eed04b16d342dfda1
          (cd pinned-solver/postflop/pfdriver; RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked)
          python tools/hu_b502_rank120_native.py "${args[@]}" --run "$GITHUB_RUN_ID" --results "$RUNNER_TEMP/result" \
            --driver pinned-solver/postflop/pfdriver/target/release/pfdriver
      - uses: actions/upload-artifact@v4
        with:
          name: B502-native-${{ matrix.flop }}
          path: ${{ runner.temp }}/result/NL2_B502_*.json.gz
          if-no-files-found: error
          retention-days: 90
  verify:
    needs: solve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: pinned-solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'B502-native-*'
          path: ${{ runner.temp }}/results
      - name: Rebuild both private-hand ranges, exact bet menus and half-pot equity from original files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          originals="$RUNNER_TEMP/originals"
          mkdir -p "$originals" "$RUNNER_TEMP/results"
          for id in $(jq -r 'keys[]' data/nl2_hu_b502_rank120_artifacts.json); do
            api="repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            gh api "$api" > "$originals/$id.json"
            gh api "$api/zip" > "$originals/$id.zip"
          done
          python tools/hu_b502_rank120_native.py --originals "$originals" --solver pinned-solver --results "$RUNNER_TEMP/results" --run "$GITHUB_RUN_ID"
          node tools/hu_b502_rank120_route.cjs
      - name: Audit all current routes and register only verified paired boards
        run: |
          set -euo pipefail
          shopt -s nullglob
          branch=fix/nl2-hu-lines-audit-20261118
          status=data/nl2_hu_multiboard_status_current.json
          files=(data/nl2_hu_b502_rank120_attempts.json data/solver_evidence/NL2_B502_*.json.gz data/solver_evidence/NL2_MULTIBOARD_REVERIFIED_R120_*.json.gz)
          if test -f data/solver_evidence/reverified/rank120.json; then files+=(data/solver_evidence/reverified/rank120.json data/nl2_hu_b502_locked_medium.json); fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --no-tags origin "$branch"
            git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
            live=$(mktemp -d)
            git worktree add -q --detach "$live" FETCH_HEAD
            cp --parents "${files[@]}" "$live/"
            (
              cd "$live"
              python tools/hu_apply_cert_extensions.py --out "$status"
              node tools/hu_b502_rank120_route.cjs
              node tools/hu_extension_runtime_test.cjs "$status"
              bash tools/hu_exact_batch_audit.sh "$status"
              git add -- "${files[@]}" "$status" data/nl2_hu_verified_extensions.json data/nl2_hu_model_history_crosswalk.json data/nl2_hu_model_source_references.json
              git diff --cached --check
              if ! git diff --cached --quiet; then git commit -m 'B502: publish native BB3-BTN checked turns with source-specific half-pot and lock evidence'; fi
            )
            if git -C "$live" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            git worktree remove "$live"
          done
          exit 1
