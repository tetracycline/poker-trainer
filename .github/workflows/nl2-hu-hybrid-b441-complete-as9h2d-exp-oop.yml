name: B441 complete As9h2d EXP_OOP; audit rank27 negative and rank29 b75 branch
on:
  push:
    branches: [fix/nl2-hu-lines-audit-20261118]
    paths:
      - '.github/workflows/nl2-hu-hybrid-b441-complete-as9h2d-exp-oop.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: b441-as9h2d-exp-oop
  cancel-in-progress: false
jobs:
  solve-exp-oop:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trainer
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile pinned original Rust CFR
        run: |
          set -euo pipefail
          python3 -m py_compile trainer/tools/solve_hu_multiboard_100bb.py trainer/tools/verify_hu_multiboard_100bb.py
          python3 -m pip install numpy matplotlib
          git clone https://github.com/b-inary/postflop-solver.git solver/postflop/postflop-solver
          git -C solver/postflop/postflop-solver checkout 9d1509fe5077d019825f833eed04b16d342dfda1
          cd solver/postflop/pfdriver
          RUSTFLAGS='-A dangerous_implicit_autorefs' CARGO_BUILD_JOBS=2 cargo build --release --locked
      - name: Finish only the missing As9h2d EXP_OOP full-tree source; do not rerun completed GTO
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C solver rev-parse HEAD > evidence/poker-solver-pin.txt
          git -C solver/postflop/postflop-solver rev-parse HEAD > evidence/rust-pin.txt
          set +e
          python3 trainer/tools/solve_hu_multiboard_100bb.py \
            --solver-root solver --spot LMP_CO_BB --flop As9h2d \
            --version exp_oop --flop-size-profile full \
            --flop-line-policy oop-b50only --turn-size-menu river-gaps --turn-count 1 \
            --manifest evidence/LMP_CO_BB-As9h2d-exp_oop.json
          solve_code=$?
          set -e
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence/LMP_CO_BB-As9h2d-exp_oop.json')
          assert p.is_file(),'Missing completed EXP_OOP manifest'
          m=json.loads(p.read_text())
          assert (m['schema'],m['spot'],m['flop'],m['version'])==(
              'NL2_MULTIBOARD_AUTHENTIC_SOURCE_V1','LMP_CO_BB','As9h2d','exp_oop')
          assert m['preflop_ranges']['source']=='ASSUMED_EXPLICIT_169CLASS'
          assert m['flop_size_profile']=='full' and not m['restricted_tree_assumption']
          assert m['selected_lines']==['b50 c'] and 'b75 c' in m['selected_turn_lines']
          assert 'b33 c' in m['selected_turn_lines'] and m['turns']==['Kd']
          assert not m['failures'] and not m['skipped']
          assert m['solved_cases']==1 and len(m['cases'])==1
          c=m['cases'][0]
          assert (c['line'],c['turn'])==('b50 c','Kd')
          assert c['gto_gap_pct'] is not None and c['gto_gap_pct']<=0.5
          assert c['hero_gap_pct'] is not None and c['hero_gap_pct']<=0.5
          assert pathlib.Path('solver/postflop/out/LMP_CO_BB/exp_oop/As9h2d_multiboard.json').is_file()
          assert pathlib.Path('solver/postflop',c['source_path']).is_file()
          print('PASS B441 EXP_OOP complete:',c['source_path'],'gap',c['gto_gap_pct'],c['hero_gap_pct'])
          PY
          test "$solve_code" -eq 0
      - name: Preserve completed EXP_OOP source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2-multiboard-B441_R27_R29_LMPCOBB_B50_B75-LMP_CO_BB-As9h2d-exp_oop
          path: |
            evidence
            solver/postflop/out
          retention-days: 30
          if-no-files-found: warn

  verify-audit-commit:
    needs: solve-exp-oop
    if: needs.solve-exp-oop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trainer
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tetracycline/poker-solver
          ref: abe310c3aad02dd4a7c77fb2831801fd490cf51b
          path: solver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download only this completed EXP_OOP artifact
        working-directory: trainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ../downloads/nl2-multiboard-B441_R27_R29_LMPCOBB_B50_B75-LMP_CO_BB-As9h2d-exp_oop
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name 'nl2-multiboard-B441_R27_R29_LMPCOBB_B50_B75-LMP_CO_BB-As9h2d-exp_oop' \
            --dir ../downloads/nl2-multiboard-B441_R27_R29_LMPCOBB_B50_B75-LMP_CO_BB-As9h2d-exp_oop
      - name: Independently verify EXP_OOP source, exact reach, and paired GTO provenance
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 tools/verify_b441_as9h2d.py \
            --artifact-dir ../downloads/nl2-multiboard-B441_R27_R29_LMPCOBB_B50_B75-LMP_CO_BB-As9h2d-exp_oop \
            --downloads-root ../downloads --solver-root ../solver --run-id "$GITHUB_RUN_ID"
      - name: Full V50 source, medium-size, and HU2475 navigation audit
        working-directory: trainer
        run: |
          set -euo pipefail
          python3 tools/hu_cert_lock_medium_audit.py \
            --source data/nl2_hu_multiboard_status_v50_b417_rank166.json --out /tmp/b441-v50.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/b441-v50.json'))
          assert (a['cert_multiboard'],a['approx'],a['EST'],a['models_total'])==(163,229,0,392)
          assert (a['aggregate']['named_board_proofs'],a['aggregate']['paired_hero_locked_source_variants'])==(618,710)
          assert a['not_generalized_handclass_GTO'] and a['not_actual_NL2_earnings']
          PY
          node tools/hu_line_contract.js > /tmp/b441-contract.json
          node tools/link_audit.js --md /tmp/b441-link.md --json /tmp/b441-link.json
          node tools/reach_verify.js --log /tmp/b441-reach.md --json /tmp/b441-reach.json
          node tools/hu_model_path_audit.js /tmp/b441-path.json
          node --check nl2_hu_multiboard_ui.js
          node --check nl2-multiboard.js
          node tools/hu_b378_v47_loader_runtime_test.cjs
          node -e 'const c=require("/tmp/b441-link.json").counts;if(c.continuing!==2475||c.reachRiver!==2475||c.riverShare!==100)process.exit(1);console.log("PASS B441 HU2475/2475")'
          git diff --check
      - name: Commit verified EXP_OOP source and rank29 exact-board proof; push draft PR2 fast-forward only
        working-directory: trainer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify_b441_as9h2d.py \
            data/nl2_hu_b441_as9h2d_exp_oop_source_proof.json \
            data/solver_evidence/NL2_B441_R27_R29_AS9H2D_EXPOOP.json.gz \
            data/solver_evidence/NL2_B441_R27_R29_AS9H2D_EXPOOP.index.json \
            docs/NL2_HU_B441_AS9H2D_EXP_OOP_SOURCE_PROOF.md
          git diff --cached --quiet && exit 1
          git commit -m 'B441: complete As9h2d EXP_OOP source; audit rank29 b75 branch; preserve no false CERT'
          for n in 1 2 3; do
            git fetch origin fix/nl2-hu-lines-audit-20261118
            git rebase origin/fix/nl2-hu-lines-audit-20261118
            if git push origin HEAD:fix/nl2-hu-lines-audit-20261118; then exit 0; fi
          done
          exit 1
