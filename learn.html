<style>*{box-sizing:border-box}html,body{margin:0;font:18px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}

.gc.low .bars{opacity:.55}.gc.out{background:#0c140f}.gc.out b{color:#3c4f44;text-shadow:none}

.foot{text-align:center;font-size:15px;color:var(--tx2);padding:10px 0 18px}

code{font-size:15px}ul{padding-left:20px;margin:6px 0}li{margin:3px 0}p{margin:6px 0}
.lrow{border-top:1px solid var(--bd);padding:8px 0}.ll{display:flex;justify-content:space-between;align-items:center;gap:8px}.lv{font-size:17px;margin-top:2px}.lv .muted{display:inline-block;min-width:52px;font-size:15px}

.dpick{margin:2px 0 4px}.dpick summary{cursor:pointer;padding:6px 2px;list-style:none;font-size:18px}.dpick summary::-webkit-details-marker{display:none}.dpick summary:before{content:'▸ ';color:var(--ac)}.dpick[open] summary:before{content:'▾ '}
