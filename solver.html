  BTN_BB_xx: {t: 'BTN vs BB 單加注・翻轉都過牌', pre: 'BTNvsBB', line: 'xx'}, CO_BB_bb: {t: 'CO vs BB 單加注・兩槍被跟', pre: 'COvsBB', line: 'bb'},
  SB_BB_bb: {t: 'SB vs BB 單加注・SB 兩槍被跟', pre: 'SBvsBB', line: 'bb'}, SB_BB_bx: {t: 'SB vs BB・c-bet 被跟、轉牌過牌', pre: 'SBvsBB', line: 'bx'},
  BB3_BTN_bx: {t: 'BB 3-bet vs BTN・c-bet 被跟、轉牌過牌', pre: 'BB3vsBTN', line: 'bx'}

const PREF = {BTNvsBB: {agg: 'BTN', def: 'BB', aggIP: true, P0: 5.5, S0: 97.5, agR: [['BTNrfi', 'open']], deR: [['BTNopen>BB', 'call']]}, COvsBB: {agg: 'CO', def: 'BB', aggIP: true, P0: 5.5, S0: 97.5, agR: [['COrfi', 'open']], deR: [['COopen>BB', 'call']]},
  SBvsBB: {agg: 'SB', def: 'BB', aggIP: false, P0: 6, S0: 97, agR: [['SBrfi', 'open']], deR: [['SBopen>BB', 'call']]}, BB3vsBTN: {agg: 'BB', def: 'BTN', aggIP: false, P0: 20.5, S0: 90, agR: [['BTNopen>BB', '3bet']], deR: [['BTNrfi', 'open'], ['BTNopen>BB3b', 'call']]}};
function pfObj() { const nodes = {}; for (const k in PRE.gto) nodes[k] = {acts: PRE.gto[k].acts, strat: PRE.gto[k].s.map(r => r.map(x => x / 100))}; return {names: PRE.names, nodes}; }
let PFO = null;
function toolRanges(pre, line, board) { // mirrors river/precompute.js buildRanges
  PFO = PFO || pfObj(); const fl = board.slice(0, 3), tu = board.slice(0, 4);
  let A = RG.removeDead(RG.fromPreflop(PFO, pre.agR), board), Dd = RG.removeDead(RG.fromPreflop(PFO, pre.deR), board); let pot = pre.P0, st = pre.S0;
  if (line === 'xx') { A = RG.splitBarrel(A, fl, 0.45, 0.15)[1]; A = RG.splitBarrel(A, tu, 0.45, 0.15)[1]; Dd = RG.splitBarrel(Dd, tu, 0.55, 0.12)[1]; }
  else { A = RG.splitBarrel(A, fl, 0.6, 0.2)[0]; Dd = RG.keepTop(Dd, fl, 0.72); const b = 0.33 * pot; pot += 2 * b; st -= b;
    if (line === 'bb') { A = RG.splitBarrel(A, tu, 0.45, 0.12)[0]; Dd = RG.keepTop(Dd, tu, 0.58); const t = 0.75 * pot; pot += 2 * t; st -= t; }
    else { A = RG.splitBarrel(A, tu, 0.45, 0.12)[1]; if (!pre.aggIP) Dd = RG.splitBarrel(Dd, tu, 0.55, 0.12)[1]; } }
  return {A, D: Dd, pot: Math.round(pot * 100) / 100, stack: Math.round(st * 100) / 100};
}
function parseRange(txt) { // "AA,KK:0.5,AKs,T9s" class list with optional weights -> {cls: w}
  const out = {}; (txt || '').split(/[\s,]+/).filter(Boolean).forEach(tok => { const [c, w] = tok.split(':'); const ww = w == null ? 1 : +w;
    const m = c.match(/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+?)$/); if (!m) return; const a = RK.indexOf(m[1]), b = RK.indexOf(m[2]);
    if (a === b) { for (let r = a; r <= (m[4] ? 12 : a); r++) out[RK[r] + RK[r]] = ww; return; }
    const hi = Math.max(a, b), lo = Math.min(a, b); const sfx = m[3] ? [m[3]] : ['s', 'o']; for (let r = lo; r <= (m[4] ? hi - 1 : lo); r++) sfx.forEach(s => out[RK[hi] + RK[r] + s] = ww); });
  return out;
}
function rangeFromText(txt, board) { const map = parseRange(txt); const out = []; const dead = new Set(board);
  Object.keys(map).forEach(c => RG.classCombos(c).forEach(([c1, c2]) => { if (!dead.has(c1) && !dead.has(c2)) out.push({c1, c2, w: map[c]}); })); return out; }
function rangeToText(r) { const m = {}; r.forEach(h => { const c = RG.classOf(h.c1, h.c2); (m[c] = m[c] || []).push(h.w); }); return Object.keys(m).map(c => { const w = m[c].reduce((a, b) => a + b, 0) / RG.classCombos(c).length; return w > 0.97 ? c : w > 0.03 ? c + ':' + w.toFixed(2) : null; }).filter(Boolean).join(','); }
let TOOL = null;
function initTool() {
  if ($('#tool').dataset.ready) return; $('#tool').dataset.ready = 1;
  $('#tool').innerHTML = `<div class="sec"><b>自己解河牌</b><div class="muted small">單條街 DCFR 解算（瀏覽器內運算，含阻擋牌）。範圍由翻前解算＋翻轉牌行動線推出，可手動修改。</div>
  <div class="row" style="margin-top:8px"><select id="tPre">${Object.keys(PRESETS).map(k => `<option value="${k}">${PRESETS[k].t}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:8px"><label>牌面 <input type="text" id="tBoard" value="Ks8h5c2d3s" size="12"></label><button class="btn" id="tLoad">載入範圍</button></div>
  <div class="row" style="margin-top:8px"><label>底池 <input type="number" id="tPot" step="0.1" style="width:80px"></label><label>籌碼 <input type="number" id="tStk" step="0.1" style="width:80px"></label></div>
  <div class="row" style="margin-top:8px"><label>下注尺寸 % <input type="text" id="tBets" value="33,75,150,allin" size="14"></label><label>加注 % <input type="text" id="tRz" value="100" size="4"></label></div>
  <div style="margin-top:8px"><div class="muted small" id="tOopL">OOP 範圍</div><textarea id="tOop"></textarea><div class="muted small" id="tIpL">IP 範圍</div><textarea id="tIp"></textarea></div>
  <div class="row" style="margin-top:8px"><button class="btn fill" id="tGo">求解</button><span class="muted" id="tProg"></span></div></div><div id="tOut"></div>`;
  $('#tLoad').onclick = toolLoad; $('#tGo').onclick = toolSolve; $('#tPre').onchange = toolLoad; toolLoad();
}
function toolBoard() { const s = $('#tBoard').value.replace(/\s/g, ''); const cs = (s.match(/../g) || []).map(x => x[0].toUpperCase() + x[1].toLowerCase()); if (cs.length !== 5 || cs.some(c => RS.card(c) < 0 || RK.indexOf(c[0]) < 0 || 'cdhs'.indexOf(c[1]) < 0)) return null; const ids = cs.map(RS.card); if (new Set(ids).size !== 5) return null; return ids; }
function toolLoad() {
  const b = toolBoard(); if (!b) { $('#tProg').textContent = '牌面格式錯誤（例：Ks8h5c2d3s）'; return; }
  const P = PRESETS[$('#tPre').value], pre = PREF[P.pre]; const R = toolRanges(pre, P.line, b);
  const oopAgg = !pre.aggIP; $('#tPot').value = R.pot; $('#tStk').value = R.stack;
  $('#tOop').value = rangeToText(oopAgg ? R.A : R.D); $('#tIp').value = rangeToText(oopAgg ? R.D : R.A);
  $('#tOopL').textContent = 'OOP 範圍（' + (oopAgg ? pre.agg : pre.def) + '）'; $('#tIpL').textContent = 'IP 範圍（' + (oopAgg ? pre.def : pre.agg) + '）';
  TOOL = {pos: oopAgg ? [pre.agg, pre.def] : [pre.def, pre.agg]}; $('#tProg').textContent = '範圍已載入';
}
function toolSolve() {
  const b = toolBoard(); if (!b) { $('#tProg').textContent = '牌面格式錯誤'; return; }
  const bets = $('#tBets').value.split(/[\s,]+/).filter(Boolean).map(x => x === 'allin' ? 'allin' : +x / 100).filter(x => x === 'allin' || x > 0);
  const rz = $('#tRz').value.split(/[\s,]+/).filter(Boolean).map(x => +x / 100).filter(x => x > 0);
  const spec = {board: b, pot: +$('#tPot').value, stack: +$('#tStk').value, oopBets: bets, ipBets: bets, raises: rz, maxRaises: 1, ranges: [rangeFromText($('#tOop').value, b), rangeFromText($('#tIp').value, b)]};
  if (!spec.ranges[0].length || !spec.ranges[1].length || !(spec.pot > 0) || !(spec.stack > 0)) { $('#tProg').textContent = '輸入不完整'; return; }
  const s = new RS.Solver(spec); const t0 = performance.now(); $('#tGo').disabled = true;
  const step = () => { s.iterate(50); const e = s.exploitability(); $('#tProg').textContent = `迭代 ${s.it}・可剝削度 ${e.exploitPct.toFixed(2)}% 底池`;
    if (e.exploitPct > 0.2 && s.it < 3000) setTimeout(step, 0); else { $('#tGo').disabled = false; toolShow(s, e, performance.now() - t0); } };
  setTimeout(step, 0);

function toolShow(s, e, ms) {
  const rep = s.report(); const ev = s.nodeEVs(); const pos = TOOL ? TOOL.pos : ['OOP', 'IP'];
  const nodes = rep.filter(n => n.hist.replace(/\d+/g, '').length <= 2 && n.reachW > 1e-3 && n.reachOpp > 1e-3);
  const sp = {hands: [0, 1].map(p => s.g.H[p].map(h => RS.cstr(h.c1) + RS.cstr(h.c2))), w: [0, 1].map(p => s.g.H[p].map(h => h.w))};
  let h = `<div class="sec"><b>結果</b> <span class="muted small">${s.it} 次迭代・${Math.round(ms)}ms・可剝削度 ${e.exploitPct.toFixed(2)}% 底池・EV ${pos[0]} ${fmt1(e.ev[0])}bb / ${pos[1]} ${fmt1(e.ev[1])}bb</span>
   <div class="row" style="margin-top:8px"><select id="tNode">${nodes.map((n, i) => `<option value="${i}">${n.hist ? esc(nodeFacingTxt(n.hist, pos, {gto: rep})) : pos[0] + ' 先行動'}（${pos[n.pl]}）</option>`).join('')}</select></div><div id="tNodeOut"></div></div>`;
  $('#tOut').innerHTML = h;
  const show = i => { const n = nodes[i]; const acts = n.acts.map(a => a.label + (a.frac ? ' ' + Math.round(a.frac * 100) + '%' : '') + (a.to ? '|' + a.to : ''));
    const hi = []; n.reach.forEach((r, j) => { if (r > 1e-6) hi.push(j); });
    const nd = {id: n.id, pl: n.pl, acts, freq: n.freq, h: hi, r: hi.map(j => n.reach[j]), S: hi.map(j => n.acts.map((_, a) => Math.round(n.S[a][j] * 100)))};
    const fake = {kind: 'riv', sp: Object.assign({exploit: {}}, sp), nd, nodeId: n.id, combo: 'xxxx'};
    $('#tNodeOut').innerHTML = `<div class="mix">${acts.map((a, k) => `<div style="width:${n.freq[k] * 100}%;background:${actColor(a)}" title="${esc(actZh(a))}"></div>`).join('')}</div>
      <div class="muted small">${acts.map((a, k) => actZh(a) + ' ' + Math.round(n.freq[k] * 100) + '%').join('・')}</div>${gridHTML(fake, 'gto')}${legendHTML(acts)}`; };
  $('#tNode').onchange = e => show(+e.target.value); show(0);
}
function nodeFacingTxt(hist, pos, sp) { const toks = hist.match(/x|B\d+|A\d+|R|A/g) || []; let who = 0, pre = ''; return toks.map(t => { const p = pos[who]; who = 1 - who; const o = t === 'x' ? p + ' 過牌' : t[0] === 'B' ? p + ' 下注 ' + t.slice(1) + '%' : t[0] === 'A' ? p + ' 全下' : p + ' 加注到 ' + (sp ? rAmt(sp, pre) : '設定的尺寸'); pre += t; return o; }).join(' → '); }
function rAmt(sp, pre) { const L = (sp.gto || []).concat(sp.exp || []); const n = L.find(x => x && x.hist === pre); const a = n && n.acts.find(x => x.startsWith('raise|')); return a ? fmt1(+a.split('|')[1]) + 'bb' : '設定的尺寸'; }
// ---------- about ----------
